<style>
/* Layout: one playful phone screen at a time (home, food game, hero chart, potty timer, parents). Single bright daytime look by choice. */
:root{
  color-scheme: light;
  --sky:#bfe6ff; --sky2:#e4f5ff; --sun:#ffc93c; --sun-deep:#f29f05; --grass:#3fb66b; --grass-deep:#22864a;
  --berry:#e2483d; --ink:#21304a; --muted:#56637a; --card:#ffffff; --golu:#ffa94d; --golu-deep:#e8812a; --cheek:#ff7b8a;
  --font:'Baloo 2', 'Mukta', system-ui, sans-serif;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);background-color:var(--sky);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;position:relative}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.bank{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.bank .st{font-size:24px}
.lang{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.lang button{border:0;background:transparent;font:700 15px var(--font);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.back{border:0;background:var(--card);border-radius:999px;font:700 16px var(--font);color:var(--ink);padding:6px 14px;min-height:40px;cursor:pointer;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.screen{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;text-wrap:balance}
h2{margin:0;font-size:26px;line-height:1.1;font-weight:800;text-align:center;text-wrap:balance}
.bubble{background:var(--card);border-radius:20px;padding:10px 16px;font-size:19px;font-weight:600;position:relative;box-shadow:0 3px 0 rgba(33,48,74,.1);max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--card);border-bottom:0}
.golu{width:150px;height:150px;transition:transform .3s}
.golu.small{width:96px;height:96px}
.golu.bounce{animation:bounce .6s}
.golu.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.menu{display:grid;grid-template-columns:1fr;gap:12px}
.tile{display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:14px 16px;text-align:left;font:800 22px var(--font);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(33,48,74,.18);min-height:84px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(33,48,74,.18)}
.tile .ic{font-size:40px;line-height:1;flex:none}
.tile small{display:block;font:600 15px var(--font);color:var(--muted)}
.t-food{background:var(--sun)} .t-chart{background:var(--surface,#9be3b4)} .t-timer{background:var(--surface,#ffc7d0)}
.parents-link{border:0;background:transparent;font:700 15px var(--font);color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center;min-height:40px}
/* food game */
.prog{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.prog i{width:22px;height:8px;border-radius:9px;background:rgba(33,48,74,.15)}
.prog i.ok{background:var(--grass)} .prog i.no{background:var(--berry)} .prog i.now{background:var(--ink)}
.food{background:var(--card);border-radius:28px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;box-shadow:0 6px 0 rgba(33,48,74,.14);overflow:hidden}
.food .pic{font-size:96px;line-height:1.1}
.food .nm{font-size:28px;font-weight:800;text-align:center;line-height:1.1}
.food.struck .pic,.food.struck .nm{opacity:.45}
.food.struck .nm{text-decoration:line-through;text-decoration-color:var(--berry);text-decoration-thickness:4px}
.stamp{position:absolute;top:14px;right:14px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;transform:scale(0) rotate(-20deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.stamp.show{transform:scale(1) rotate(-12deg)}
.food{position:relative}
.bigx{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;font-weight:900;line-height:1;color:var(--berry);opacity:.85;pointer-events:none;animation:popIn .4s ease-out}
.stamp.good{background:var(--grass)} .stamp.bad{background:var(--berry)}
.big-x{position:absolute;inset:0;pointer-events:none}
.ask{font-size:22px;font-weight:700;text-align:center}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{border:0;border-radius:24px;min-height:96px;font:800 24px var(--font);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.yn .ic{font-size:40px;line-height:1}
.yes{background:var(--grass);box-shadow:0 6px 0 var(--grass-deep)} .no{background:var(--berry);box-shadow:0 6px 0 #a92a21}
.yn button:active{transform:translateY(4px);box-shadow:none}
.why{border-radius:18px;padding:12px 14px;font-size:19px;font-weight:600;text-align:center}
.why.good{background:var(--surface,#d8f5e2);color:var(--grass-deep)} .why.bad{background:var(--surface,#ffe0dc);color:var(--tx,#a92a21)}
.go{border:0;border-radius:22px;min-height:64px;font:800 24px var(--font);background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.go:active{transform:translateY(3px);box-shadow:none}
.result{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 6px 0 rgba(33,48,74,.14)}
.result .score{font-size:52px;font-weight:800;color:var(--sun-deep);line-height:1}
/* chart */
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.task{border:3px solid transparent;background:var(--card);border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:700 17px var(--font);color:var(--ink);cursor:pointer;min-height:120px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);position:relative}
.task .ic{font-size:38px;line-height:1}
.task[aria-pressed="true"]{background:var(--surface,#fff6d6);border-color:var(--sun-deep)}
.task .got{position:absolute;top:6px;right:8px;font-size:22px;opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.task[aria-pressed="true"] .got{opacity:1;transform:scale(1)}
.counter{text-align:center;font-weight:800;font-size:22px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.day .b{width:36px;height:36px;border-radius:50%;background:rgba(33,48,74,.08);display:grid;place-items:center;font-size:20px}
.day.today .b{outline:3px solid var(--ink)}
.day.won .b{background:var(--sun)}
.goal{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.goal .bar{height:18px;background:rgba(33,48,74,.1);border-radius:99px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun-deep));border-radius:99px;transition:width .4s}
.goal .lbl{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
/* timer */
.balloon-wrap{height:250px;display:grid;place-items:center;position:relative}
.balloon{width:110px;height:130px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#ff9fae,var(--berry));position:relative;transform:scale(.7);transition:transform 4s ease-in-out}
.balloon::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-7px;border:7px solid transparent;border-bottom-color:var(--berry)}
.balloon.big{transform:scale(1.45)}
.string{position:absolute;bottom:4px;left:50%;width:2px;height:70px;background:var(--muted);margin-left:-1px}
.breath{text-align:center;font-size:26px;font-weight:800;min-height:36px}
.clock{text-align:center;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.mins{display:flex;gap:8px;justify-content:center}
.mins button{border:3px solid var(--card);background:var(--card);border-radius:16px;font:800 20px var(--font);padding:6px 16px;min-height:48px;cursor:pointer;color:var(--ink)}
.mins button[aria-pressed="true"]{border-color:var(--ink)}
.poops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.poop{border:3px solid transparent;background:var(--card);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 16px var(--font);color:var(--ink);cursor:pointer;min-height:100px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);text-align:center}
.poop:active{transform:translateY(3px);box-shadow:none}
.diary{width:100%;border-collapse:collapse;font-size:15px}
.diary th,.diary td{text-align:left;padding:6px 4px;border-bottom:1px solid #e3e9f2}
.diary td.n{font-weight:800;font-variant-numeric:tabular-nums}
/* parents */
.pcard{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;font-family:system-ui,sans-serif;font-size:16px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.pcard h3{margin:0;font:800 20px var(--font)}
.pcard label{font-weight:600}
.pcard input,.pcard select{font:500 17px system-ui,sans-serif;border:2px solid #cfd8e6;border-radius:12px;padding:10px 12px;min-height:48px;width:100%;box-sizing:border-box;color:var(--ink);background:var(--surface,#fff)}
.pcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.save{border:0;border-radius:14px;min-height:50px;font:800 19px var(--font);background:var(--grass);color:#fff;cursor:pointer}
.danger{border:2px solid var(--berry);background:var(--surface,#fff);color:var(--berry);border-radius:14px;min-height:46px;font:700 16px var(--font);cursor:pointer}
.msg{font-weight:700;color:var(--grass-deep)}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.fly{position:fixed;font-size:34px;z-index:60;pointer-events:none;animation:fly .8s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.3}}
.t-story{background:var(--surface,#d9f7c4)} .t-plate{background:var(--surface,#ffd9a8)} .t-screen{background:var(--surface,#b9e4ff)} .t-brush{background:var(--surface,#d4f5f0)} .t-safe{background:var(--surface,#e4d4ff)} .t-behave{background:var(--surface,#fff0b3)}
.grp{background:var(--card);border-radius:20px;padding:10px 10px 12px;border-left:8px solid var(--c);box-shadow:0 4px 0 rgba(33,48,74,.1)}
.grp h3{margin:0 0 8px;font:800 18px var(--font);display:flex;justify-content:space-between;align-items:center;gap:8px;line-height:1.2}
.grp .one{font:700 14px var(--font);color:var(--muted);white-space:nowrap}
.grp .chip{min-height:78px;box-shadow:none;background:var(--surface,#f1f5fa);font-size:14px;line-height:1.15}
.grp .chip .pic{font-size:28px}
.grp .chip[aria-pressed="true"]{border-color:var(--grass);background:var(--surface,#e6f8ea)}
.dietrow{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:16px}
.dietseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.dietseg button{border:3px solid transparent;border-radius:16px;background:var(--card);font:700 15px var(--font);color:var(--ink);min-height:48px;cursor:pointer;padding:4px}
.dietseg button[aria-pressed="true"]{border-color:var(--grass);background:var(--surface,#e6f8ea)}
.t-wash{background:var(--surface,#cfe8ff)} .t-sleep{background:var(--surface,#d9d6ff)} .t-feel{background:var(--surface,#ffe1c2)} .t-drink{background:var(--surface,#c9f1ff)} .t-road{background:var(--surface,#d6f5c9)} .t-aid{background:var(--surface,#ffd9d6)}
.tile[hidden]{display:none}
.opts.col{grid-template-columns:1fr}
.opt.n{background:var(--ink);font-size:18px;min-height:64px;padding:10px 14px;line-height:1.25}
.count20{font-size:84px;font-weight:800;line-height:1;color:var(--grass-deep);font-variant-numeric:tabular-nums}
.seqrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:62px}
.seq{position:relative;width:58px;height:58px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:32px;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.seq b{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--grass);color:#fff;font-size:13px;display:grid;place-items:center}
.seq.empty{background:transparent;border:3px dashed rgba(33,48,74,.3);box-shadow:none;font-size:20px;font-weight:800;color:var(--muted)}
.t-vax{background:var(--surface,#ffd6e3)} .t-body{background:var(--surface,#cdeee9)}
.kidrow.kidrow3{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.kidrow3 .kidbig{padding:12px 4px;font-size:16px}
.teddy{width:170px;height:182px}
.pw{width:140px;height:182px}
.pw g{transform-origin:50px 50px}
.pw.on g{animation:spin .6s linear 4}
.breaths{display:flex;gap:8px;justify-content:center;font-size:26px}
.field{position:relative;height:310px;background:var(--card);border-radius:28px;box-shadow:0 6px 0 rgba(33,48,74,.14);overflow:hidden}
.field .me{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:6px solid #2f8fe0;background:rgba(47,143,224,.12);display:grid;place-items:center}
.field .me .golu{width:92px;height:92px}
.germ{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border:0;padding:0;background:transparent;font-size:40px;line-height:1;cursor:pointer;animation:wob 1.6s ease-in-out infinite;transition:transform .35s,opacity .35s}
.germ.pop{transform:scale(0) rotate(90deg);opacity:0;pointer-events:none;animation:none}
@keyframes wob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(8deg)}}
.rules{display:grid;gap:10px}
.rule{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px 14px;font-weight:800;font-size:22px;line-height:1.2;box-shadow:0 4px 0 rgba(33,48,74,.12)}
.rule .ic{font-size:36px;line-height:1;flex:none}
.rule small{display:block;font:600 16px var(--font);color:var(--muted)}
.go:disabled{opacity:.55}
@media (prefers-reduced-motion: reduce){.germ,.pw.on g{animation:none}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{border:0;border-radius:22px;min-height:88px;font:800 19px var(--font);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:6px}
.opt .ic{font-size:34px;line-height:1}
.opt.g{background:var(--grass)} .opt.y{background:var(--sun-deep);color:var(--ink)} .opt.r{background:var(--berry)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip.wide{grid-column:1 / -1;min-height:64px;flex-direction:row;gap:10px;justify-content:center}
.chip.xj,.chip.xj[aria-pressed="true"]{border-color:#d7263d!important;background:var(--surface,#ffe9ec)!important;color:var(--tx,#a92a21);text-decoration:line-through;text-decoration-thickness:3px}
.chip.xj .pic{opacity:.55}
.junkbox{background:var(--surface,#fff1f0);border:2px solid #d7263d;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--tx,#7a1a14)}
.jx{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.4}
.jx .jp{font-size:28px;flex:none;opacity:.7}
.jn{color:var(--tx,#c0271c);font-size:18px}
.jnote{font-weight:700;color:var(--tx,#a92a21);font-size:16px}
.chip{border:3px solid transparent;background:var(--card);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font:700 15px var(--font);color:var(--ink);cursor:pointer;min-height:92px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);text-align:center}
.chip .pic{font-size:34px;line-height:1.1}
.chip[aria-pressed="true"]{border-color:var(--grass);background:var(--surface,#e6f8ea)}
.plate{background:var(--surface,#fff3d6);border:4px dashed var(--sun-deep);border-radius:50%;width:210px;height:210px;margin:0 auto;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:28px;line-height:1.3;padding:24px;box-sizing:border-box}
.checklist{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.step{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;box-shadow:0 6px 0 rgba(33,48,74,.14)}
.step .n{font-size:17px;color:var(--muted);font-weight:800}
.step .ic{font-size:64px;line-height:1}
.step .big{font-size:23px;font-weight:800;line-height:1.25}
.step .ic.scrub{animation:scrub .5s ease-in-out infinite}
.step .ic.bob{animation:bob 1.1s ease-in-out infinite}
.step .ic.tilt{animation:tilt 1.4s ease-in-out infinite}
.step .ic.spin{animation:spin 2.4s linear infinite}
@keyframes scrub{0%,100%{transform:rotate(-16deg) translateX(-6px)}50%{transform:rotate(16deg) translateX(6px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes tilt{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-40deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.step .ic{animation:none!important}}
.pnote{font:600 15px system-ui,sans-serif;color:var(--muted);text-align:center}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@keyframes hello{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes bobUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes popIn{0%{transform:scale(.92)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.intro{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
.intro .golu{width:120px;height:120px;animation:bobUp 2.4s ease-in-out infinite}
.intro .wave{display:inline-block;transform-origin:70% 70%;animation:hello 1.2s ease-in-out infinite}
.spark{position:absolute;font-size:22px;pointer-events:none;animation:twinkle 2.2s ease-in-out infinite}
.kidbig{font:800 18px system-ui,sans-serif;border:none;border-radius:22px;padding:16px 12px;width:100%;box-shadow:0 6px 0 rgba(33,48,74,.18);cursor:pointer;color:var(--tx,#21304a);background:var(--surface,#fff)}
.kidbig[aria-pressed="true"]{background:var(--surface,#c8f7d7);animation:popIn .45s ease-out}
.kidbig .em{display:block;font-size:34px;line-height:1.1;margin-bottom:4px}
.kidrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kidname{width:100%;box-sizing:border-box;font:700 22px system-ui,sans-serif;padding:14px;border-radius:20px;border:3px solid #9bd3ff;text-align:center;color:var(--tx,#21304a)}
.kidname:focus{outline:4px solid #ffc93c;border-color:#ffc93c}
.letsgo{width:100%;margin-top:16px;font:800 22px system-ui,sans-serif;padding:18px;border:none;border-radius:24px;background:#3fb66b;color:#fff;box-shadow:0 7px 0 #2a8a4d;cursor:pointer}
.kidcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;min-width:96px;border-radius:20px;border:3px solid transparent;background:var(--surface,#fff);font:700 16px system-ui,sans-serif;color:var(--tx,#21304a);cursor:pointer}
.kidcard[aria-pressed="true"]{border-color:#3fb66b;background:var(--surface,#e9fbef)}
.kidcard .golu{width:64px;height:64px}
.kidcards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 2px}
.kidsmall{margin-top:14px;background:none;border:none;font:700 15px system-ui,sans-serif;color:var(--tx,#2563eb);cursor:pointer;text-decoration:underline}
.parentnote{margin-top:22px;font:600 12px system-ui,sans-serif;color:var(--tx,#64748b);text-align:center}
@media (prefers-reduced-motion: reduce){.golu.bounce,.golu.shake,.confetti span,.fly,.intro .golu,.intro .wave,.spark,.kidbig[aria-pressed="true"]{animation:none}.balloon{transition:none}}

      {p:'🚑',ag:'bc',en:'A stranger says, “Your mummy has had an accident. Come with me now.”',hi:'एक अनजान व्यक्ति कहे, “तुम्हारी मम्मी का एक्सीडेंट हो गया है। अभी मेरे साथ चलो।”',a:0,why:{en:'Do not go. Call your parent on the phone, or ask a shopkeeper or police uncle to call them. Stay with a grown-up you know.',hi:'मत जाओ। मम्मी-पापा को फ़ोन करो, या किसी दुकानदार या पुलिस अंकल से फ़ोन करवाओ। किसी जाने-पहचाने बड़े के साथ रहो।'}},
      {p:'🎁',en:'A stranger gives you a gift and asks you to come and see something.',hi:'एक अनजान व्यक्ति तोहफ़ा देकर कहे, “आओ, कुछ दिखाता हूँ।”',a:0,why:{en:'Strangers do not give gifts for free. Say NO and go away.',hi:'अनजान लोग मुफ़्त में तोहफ़े नहीं देते। ना कहो और वहाँ से चले जाओ।'}},
      {p:'🛒',en:'You get lost in the market. You stay where you are and ask a shopkeeper or police uncle for help.',hi:'तुम बाज़ार में खो गए। तुम जहाँ हो वहीं रुकते हो और दुकानदार या पुलिस अंकल से मदद माँगते हो।',a:1,why:{en:'Stay where you are. Tell the shopkeeper or police uncle your parent’s name and phone number. Do not go looking alone.',hi:'जहाँ हो वहीं रुको। दुकानदार या पुलिस अंकल को माता-पिता का नाम और फ़ोन नंबर बताओ। खुद ढूँढने मत निकलो।'}},
      {p:'🏃',ag:'bc',en:'You get lost in the market, so you wander off alone to look for Mummy, or go with a stranger who says he knows where she is.',hi:'तुम बाज़ार में खो गए, तो अकेले मम्मी को ढूँढने निकल पड़ते हो, या ऐसे अनजान के साथ जाते हो जो कहता है कि वह जानता है मम्मी कहाँ हैं।',a:0,why:{en:'Do not wander off. Do not go with a stranger, even if he says he knows Mummy.',hi:'भटको मत। किसी अनजान के साथ मत जाओ, भले ही वह कहे कि वह मम्मी को जानता है।'}},
      {p:'🚪',ag:'bc',en:'You are at home alone, and someone you do not know rings the bell. You open the door.',hi:'तुम घर पर अकेले हो, और कोई अनजान घंटी बजाता है। तुम दरवाज़ा खोल देते हो।',a:0,why:{en:'Never open the door for someone you do not know. Ask who it is, and call a parent.',hi:'जिसे नहीं जानते, उसके लिए दरवाज़ा मत खोलो। पूछो कौन है, और माता-पिता को फ़ोन करो।'}},
      {p:'🚸',en:'You hold a grown-up’s hand and cross the road at the zebra crossing.',hi:'तुम बड़े का हाथ पकड़कर ज़ेब्रा क्रॉसिंग से सड़क पार करते हो।',a:1,why:{en:'Holding a grown-up’s hand and using the crossing keeps you safe on roads.',hi:'बड़े का हाथ पकड़कर क्रॉसिंग से सड़क पार करना सुरक्षित है।'}},
      {p:'🔌',en:'You push a pin or your finger into an electric socket.',hi:'तुम सॉकेट में पिन या उँगली डालते हो।',a:0,why:{en:'Electricity can kill. Keep fingers and things away from sockets, and tell a grown-up.',hi:'बिजली जानलेवा हो सकती है। सॉकेट से उँगली और चीज़ें दूर रखो, और बड़ों को बताओ।'}},
      {p:'📱',ag:'bc',en:'Someone you met in an online game asks for your home address and school name.',hi:'ऑनलाइन गेम में मिला कोई व्यक्ति तुम्हारे घर का पता और स्कूल का नाम पूछता है।',a:0,why:{en:'Never share your address or school online. Tell a parent.',hi:'ऑनलाइन कभी अपना पता या स्कूल का नाम मत बताओ। माता-पिता को बताओ।'}},
      {p:'🤫',ag:'bc',en:'A grown-up asks you to keep a secret that feels uncomfortable.',hi:'कोई बड़ा ऐसा राज़ रखने को कहे जिससे तुम्हें असहज लगे।',a:0,why:{en:'Tell a parent right away. A secret that feels wrong must always be told.',hi:'तुरंत माता-पिता को बताओ। जो राज़ गलत लगे, वह ज़रूर बताना है।'}},
      {p:'🙅',en:'Someone touches the parts of your body covered by your underwear.',hi:'कोई तुम्हारे अंडरवियर से ढके अंगों को छूता है।',a:0,why:{en:'Say NO loudly, move away, and tell a parent. Your body belongs to you.',hi:'ज़ोर से ना कहो, वहाँ से दूर हटो, और माता-पिता को बताओ। तुम्हारा शरीर तुम्हारा है।'}},
      {p:'🗣️',en:'Something makes you uncomfortable, so you tell your parents straight away.',hi:'कुछ असहज लगता है, तो तुम तुरंत माता-पिता को बताते हो।',a:1,why:{en:'Telling a parent right away is the right thing. You will not be in trouble for telling.',hi:'तुरंत बताना सही है। बताने पर तुम्हें डाँट नहीं पड़ेगी।'}},
      {p:'📞',ag:'bc',en:'You are in danger and cannot find a grown-up. You call 112.',hi:'तुम खतरे में हो और कोई बड़ा नहीं मिल रहा। तुम 112 पर फ़ोन करते हो।',a:1,why:{en:'112 is the emergency number in India. Childline 1098 is also free for children in trouble.',hi:'भारत में आपात स्थिति के लिए 112 नंबर है। मुसीबत में बच्चों के लिए चाइल्डलाइन 1098 भी मुफ़्त है।'}}
    ]},
  behave:{ask:'behaveAsk', opts:[{ic:'👍',cls:'g',v:1,en:'Good',hi:'अच्छा'},{ic:'👎',cls:'r',v:0,en:'Not good',hi:'अच्छा नहीं'}],
    list:[
      {p:'🧸',en:'You share your toy with a friend.',hi:'तुम अपना खिलौना दोस्त के साथ बाँटते हो।',a:1,why:{en:'Sharing makes friends happy.',hi:'बाँटने से दोस्त खुश होते हैं।'}},
      {p:'🧸',en:'You grab the toy from your friend and say, “It is mine!”',hi:'तुम दोस्त से खिलौना छीनकर कहते हो, “ये मेरा है!”',a:0,why:{en:'Ask politely, “Can I play with it after you?” and wait for your turn.',hi:'विनम्रता से पूछो, “क्या तुम्हारे बाद मैं खेल सकता हूँ?” और अपनी बारी का इंतज़ार करो।'}},
      {p:'😠',en:'You hit a friend when you are angry.',hi:'गुस्से में तुम दोस्त को मारते हो।',a:0,why:{en:'Say “I am angry” in words instead of hitting. Take a deep breath and count to five.',hi:'मारने की जगह कहो, “मुझे गुस्सा आ रहा है।” गहरी साँस लो और पाँच तक गिनो।'}},
      {p:'🙏',en:'You say sorry after making a mistake.',hi:'गलती होने पर तुम “सॉरी” कहते हो।',a:1,why:{en:'Saying sorry helps mend friendships.',hi:'सॉरी कहने से दोस्ती फिर जुड़ती है।'}},
      {p:'🙅',en:'You break a friend’s toy and walk away without saying anything.',hi:'तुम दोस्त का खिलौना तोड़कर बिना कुछ कहे चले जाते हो।',a:0,why:{en:'Say sorry, and offer to help fix it or share your toy to make it right.',hi:'सॉरी कहो, और ठीक करने में मदद करो या अपना खिलौना दो।'}},
      {p:'💬',en:'You say “please” and “thank you”.',hi:'तुम “प्लीज़” और “थैंक यू” कहते हो।',a:1,why:{en:'Good manners make everyone smile.',hi:'अच्छे तौर-तरीके सबको खुश करते हैं।'}},
      {p:'🍚',en:'You throw food on the floor.',hi:'तुम खाना ज़मीन पर फेंकते हो।',a:0,why:{en:'Food is for eating. Say “I am full” when you have had enough.',hi:'खाना खाने के लिए है। पेट भर जाए तो कहो, “मेरा पेट भर गया।”'}},
      {p:'🥄',ag:'bc',en:'You sit at the table, eat with your mouth closed, and wait until everyone is served.',hi:'तुम मेज़ पर बैठकर मुँह बंद करके खाते हो, और सबको परोसे जाने तक इंतज़ार करते हो।',a:1,why:{en:'Eating politely shows respect for the family and the food.',hi:'तमीज़ से खाना परिवार और खाने दोनों का सम्मान है।'}},
      {p:'📢',en:'You shout at your grandparents.',hi:'तुम दादा-दादी पर चिल्लाते हो।',a:0,why:{en:'Speak softly and kindly, even when upset.',hi:'परेशान हो तो भी धीरे और प्यार से बोलो।'}},
      {p:'🙏',en:'You say “Namaste” or touch your grandparents’ feet when you meet them.',hi:'तुम दादा-दादी से मिलते समय “नमस्ते” कहते हो या उनके पैर छूते हो।',a:1,why:{en:'Greeting elders with respect makes the whole family proud.',hi:'बड़ों का आदर से अभिवादन करना सबको अच्छा लगता है।'}},
      {p:'👂',en:'You keep talking while your friend is speaking.',hi:'दोस्त बोल रहा हो और तुम बीच में बोलते रहते हो।',a:0,why:{en:'Let the other person finish. Then take your turn to speak.',hi:'दूसरे को पूरी बात कहने दो। फिर अपनी बारी में बोलो।'}},
      {p:'😢',en:'Your friend loses the game, and you say, “It is OK, let us play again!”',hi:'दोस्त खेल हार जाता है, और तुम कहते हो, “कोई बात नहीं, फिर से खेलते हैं!”',a:1,why:{en:'Being kind when others lose makes games fun for everyone.',hi:'दूसरे हारें तो प्यार से बोलना सबके लिए खेल मज़ेदार बनाता है।'}},
      {p:'🤭',en:'You laugh at a friend who wears glasses, and call him names.',hi:'तुम चश्मा पहनने वाले दोस्त पर हँसते हो और उसे चिढ़ाते हो।',a:0,why:{en:'Teasing hurts feelings. Be kind to everyone, whatever they look like.',hi:'चिढ़ाने से दिल दुखता है। हर किसी से प्यार से पेश आओ, चाहे वे कैसे भी दिखें।'}},
      {p:'🧺',en:'You help put your toys back in the box.',hi:'तुम खिलौने वापस डिब्बे में रखने में मदद करते हो।',a:1,why:{en:'Tidying up is a helpful habit.',hi:'कमरा साफ़ रखना अच्छी आदत है।'}},
      {p:'🐶',en:'You kick the dog when it comes near you.',hi:'जब कुत्ता पास आता है, तुम उसे लात मारते हो।',a:0,why:{en:'Animals feel pain too. Be gentle, and call a grown-up if you are scared.',hi:'जानवरों को भी दर्द होता है। प्यार से रहो, और डर लगे तो बड़ों को बुलाओ।'}},
      {p:'🥛',en:'You break a cup and tell Mummy the truth.',hi:'कप टूट जाता है और तुम मम्मी को सच बताते हो।',a:1,why:{en:'Telling the truth builds trust.',hi:'सच बोलने से भरोसा बनता है।'}},
      {p:'🤥',ag:'bc',en:'You break a cup, and you blame the cat so you do not get into trouble.',hi:'कप तुम तोड़ते हो, पर डाँट से बचने के लिए बिल्ली पर इल्ज़ाम लगाते हो।',a:0,why:{en:'Telling a lie to avoid trouble makes people trust you less. Say what happened.',hi:'डाँट से बचने के लिए झूठ बोलने से लोग कम भरोसा करते हैं। जो हुआ वही बताओ।'}},
      {p:'🎁',en:'Your friend has a birthday, and you say, “Happy birthday!” and give a card you made.',hi:'दोस्त का जन्मदिन है, और तुम “हैप्पी बर्थडे!” कहकर अपना बनाया कार्ड देते हो।',a:1,why:{en:'Kind words and small gifts show you care.',hi:'प्यार भरे शब्द और छोटे तोहफ़े दिखाते हैं कि तुम परवाह करते हो।'}}
    ]},
  vax:{ask:'vaxAsk', max:10, note:function(){ return L(VT.parent); }, opts:[{ic:'✅',cls:'g',v:1,en:'Right',hi:'सही'},{ic:'❌',cls:'r',v:0,en:'Not right',hi:'सही नहीं'}],
    list:[
      {ag:'b',p:'🤝',en:"You hold Mummy’s hand while you get your vaccine.",hi:'टीका लगते समय तुम मम्मी का हाथ पकड़ते हो।',a:1,why:{en:'Staying close to Mummy or Papa helps you feel safe.',hi:'मम्मी या पापा के पास रहने से डर कम लगता है।'}},
      {ag:'b',p:'🌬️',en:'You take slow, deep breaths, like blowing a pinwheel.',hi:'तुम धीमी, गहरी साँसें लेते हो, जैसे फिरकी घुमा रहे हो।',a:1,why:{en:'Slow breaths help your body relax.',hi:'धीमी साँसों से शरीर ढीला और शांत रहता है।'}},
      {ag:'b',p:'🧸',en:'You bring your favourite toy or book and look at it.',hi:'तुम अपना पसंदीदा खिलौना या किताब साथ लाते हो और उसे देखते हो।',a:1,why:{en:'Thinking about something you like makes the prick feel smaller.',hi:'पसंद की चीज़ पर ध्यान रहे तो चुभन कम महसूस होती है।'}},
      {ag:'bc',p:'💪',en:'You keep your arm soft and still.',hi:'तुम बाँह को ढीला और स्थिर रखते हो।',a:1,why:{en:'A soft, still arm makes the vaccine quicker and easier.',hi:'ढीली और स्थिर बाँह में टीका जल्दी और आसानी से लगता है।'}},
      {ag:'bc',p:'🏃',en:'You pull your arm away when the injection is coming.',hi:'इंजेक्शन आते ही तुम बाँह खींच लेते हो।',a:0,why:{en:'Moving makes it harder and can hurt more. Stay still. It is over in a few seconds.',hi:'हिलने से मुश्किल होती है और ज़्यादा दर्द हो सकता है। स्थिर रहो। कुछ सेकंड में हो जाता है।'}},
      {ag:'bc',p:'💉',en:'“A vaccine does not hurt at all.”',hi:'“टीके में बिल्कुल दर्द नहीं होता।”',a:0,why:{en:'It is a small prick. It hurts a little for a few seconds, and then it is over.',hi:'यह एक छोटी सी चुभन है। कुछ सेकंड थोड़ा दर्द होता है, फिर खत्म।'}},
      {ag:'bc',p:'🛡️',en:'A vaccine teaches your body to fight germs.',hi:'टीका तुम्हारे शरीर को कीटाणुओं से लड़ना सिखाता है।',a:1,why:{en:'After the vaccine, your body remembers the germ and is ready to fight it.',hi:'टीके के बाद शरीर उस कीटाणु को याद रखता है और लड़ने के लिए तैयार रहता है।'}},
      {ag:'bc',p:'😠',en:'“A vaccine is a punishment for naughty children.”',hi:'“टीका शरारती बच्चों की सज़ा है।”',a:0,why:{en:'A vaccine is never a punishment. It is protection, and every child gets it.',hi:'टीका कभी सज़ा नहीं होता। यह सुरक्षा है, जो हर बच्चे को मिलती है।'}},
      {ag:'bc',p:'😢',en:'It is OK to feel a little scared before a vaccine.',hi:'टीके से पहले थोड़ा डर लगना ठीक है।',a:1,why:{en:'Many children feel scared. Brave means you do it even when you are a little scared.',hi:'बहुत से बच्चों को डर लगता है। बहादुर वह है जो थोड़ा डरकर भी काम पूरा करे।'}},
      {ag:'bc',p:'🗣️',en:'You tell the doctor, “I am scared.”',hi:'तुम डॉक्टर से कहते हो, “मुझे डर लग रहा है।”',a:1,why:{en:'Telling helps. The doctor can explain what will happen and go at your pace.',hi:'बताने से मदद मिलती है। डॉक्टर समझाएँगे कि क्या होगा।'}},
      {ag:'c',p:'🔬',en:'A vaccine shows your body a weak or tiny part of a germ, so it learns to fight the real one.',hi:'टीका शरीर को कीटाणु का कमज़ोर या छोटा सा हिस्सा दिखाता है, ताकि शरीर असली कीटाणु से लड़ना सीखे।',a:1,why:{en:'Your body makes antibodies and memory cells. If the real germ comes later, they act fast.',hi:'शरीर एंटीबॉडी और याद रखने वाली कोशिकाएँ बनाता है। बाद में असली कीटाणु आए तो ये तुरंत काम करती हैं।'}},
      {ag:'c',p:'🤒',en:'A sore arm or mild fever can happen for a day or two after a vaccine.',hi:'टीके के बाद एक-दो दिन बाँह में दर्द या हल्का बुखार हो सकता है।',a:1,why:{en:'This can happen while the body builds protection. Tell your parents how you feel.',hi:'शरीर सुरक्षा बना रहा होता है, तब ऐसा हो सकता है। कैसा लग रहा है, माता-पिता को बताओ।'}},
      {ag:'c',p:'💪',en:'“I am healthy, so I do not need vaccines.”',hi:'“मैं स्वस्थ हूँ, इसलिए मुझे टीके की ज़रूरत नहीं।”',a:0,why:{en:'Vaccines work before you fall ill. They are given to healthy children to keep them protected.',hi:'टीका बीमार होने से पहले काम करता है। यह स्वस्थ बच्चों को ही लगाया जाता है, ताकि वे सुरक्षित रहें।'}},
      {ag:'c',p:'👨‍👩‍👧',en:'When you take your vaccine, you also help protect babies and grandparents near you.',hi:'जब तुम टीका लगवाते हो, तो आसपास के छोटे बच्चों और दादा-दादी की सुरक्षा में भी मदद करते हो।',a:1,why:{en:'When you do not catch the disease, you cannot pass it on to them.',hi:'जब तुम्हें बीमारी नहीं होगी, तो तुमसे उन तक भी नहीं पहुँचेगी।'}},
      {ag:'c',p:'👶',en:'“Vaccines are only for babies.”',hi:'“टीके सिर्फ़ छोटे बच्चों के लिए होते हैं।”',a:0,why:{en:'Older children need some vaccines and boosters too. Ask the doctor which ones are due.',hi:'बड़े बच्चों को भी कुछ टीके और बूस्टर लगते हैं। डॉक्टर से पूछो कि कौन से बाकी हैं।'}},
      {ag:'c',p:'😬',en:'You hold your breath and make your arm tight.',hi:'तुम साँस रोक लेते हो और बाँह कड़ी कर लेते हो।',a:0,why:{en:'A tight arm hurts more. Breathe slowly and let the arm hang loose.',hi:'कड़ी बाँह में ज़्यादा दर्द होता है। धीरे साँस लो और बाँह ढीली छोड़ दो।'}}
    ]},
  body:{ask:'safeAsk', max:10, note:function(){ return L(BT.parent); }, end:function(){ return bodyEnd(); }, opts:[{ic:'✅',cls:'g',v:1,en:'Safe',hi:'सुरक्षित'},{ic:'⚠️',cls:'r',v:0,en:'Not safe',hi:'सुरक्षित नहीं'}],
    list:[
      {ag:'a',p:'🤗',en:'Mummy gives you a hug, and you feel happy.',hi:'मम्मी तुम्हें गले लगाती हैं, और तुम्हें अच्छा लगता है।',a:1,why:{en:'A hug from Mummy or Papa that you like is a safe touch.',hi:'मम्मी या पापा का गले लगाना, जो तुम्हें अच्छा लगे, सुरक्षित छूना है।'}},
      {ag:'a',p:'🛁',en:'Mummy or Papa helps you bathe.',hi:'मम्मी या पापा तुम्हें नहलाते हैं।',a:1,why:{en:'Mummy and Papa help to keep you clean and healthy.',hi:'मम्मी और पापा तुम्हें साफ़ और स्वस्थ रखने में मदद करते हैं।'}},
      {ag:'ab',p:'🩺',en:'The doctor checks you, and Mummy or Papa is with you.',hi:'डॉक्टर तुम्हारी जाँच करते हैं, और मम्मी या पापा साथ हैं।',a:1,why:{en:'The doctor checks you to keep you healthy. Mummy or Papa stays with you.',hi:'डॉक्टर तुम्हें स्वस्थ रखने के लिए जाँच करते हैं। मम्मी या पापा साथ रहते हैं।'}},
      {ag:'ab',p:'🙅',en:'Someone touches the parts of your body covered by your underwear.',hi:'कोई तुम्हारे अंडरवियर से ढके अंगों को छूता है।',a:0,why:{en:'Say NO loudly, move away, and tell Mummy or Papa. Your body belongs to you.',hi:'ज़ोर से ना कहो, वहाँ से हटो, और मम्मी या पापा को बताओ। तुम्हारा शरीर तुम्हारा है।'}},
      {ag:'a',p:'🤫',en:'Someone says, “Do not tell Mummy.”',hi:'कोई कहता है, “मम्मी को मत बताना।”',a:0,why:{en:'We do not keep secrets from Mummy and Papa. Tell them.',hi:'मम्मी और पापा से कोई बात नहीं छिपाते। उन्हें बताओ।'}},
      {ag:'ab',p:'😣',en:'Someone holds you tight and does not stop when you say “No”.',hi:'कोई तुम्हें कसकर पकड़ता है और “ना” कहने पर भी नहीं छोड़ता।',a:0,why:{en:'You can say NO to any touch you do not like. Move away and tell Mummy or Papa.',hi:'जो छूना अच्छा न लगे, उसे ना कह सकते हो। वहाँ से हटो और मम्मी या पापा को बताओ।'}},
      {ag:'abc',p:'✋',en:'A touch feels wrong, so you say “NO!” loudly.',hi:'कोई छूना गलत लगता है, तो तुम ज़ोर से “ना!” कहते हो।',a:1,why:{en:'Saying NO loudly is right. Then go away and tell a grown-up you trust.',hi:'ज़ोर से ना कहना सही है। फिर वहाँ से जाओ और भरोसे के बड़े को बताओ।'}},
      {ag:'a',p:'🗣️',en:'A touch feels wrong, and you tell Mummy or Papa.',hi:'कोई छूना गलत लगता है, और तुम मम्मी या पापा को बताते हो।',a:1,why:{en:'Telling is always right. Mummy and Papa will not be angry with you.',hi:'बताना हमेशा सही है। मम्मी और पापा तुमसे नाराज़ नहीं होंगे।'}},
      {ag:'ab',p:'👕',en:'Someone asks you to take off your clothes when Mummy and Papa are not there.',hi:'जब मम्मी और पापा पास नहीं हैं, तब कोई तुमसे कपड़े उतारने को कहता है।',a:0,why:{en:'Say NO, go away, and tell Mummy or Papa.',hi:'ना कहो, वहाँ से जाओ, और मम्मी या पापा को बताओ।'}},
      {ag:'bc',p:'🍫',en:'A grown-up gives you a chocolate and says, “This is our secret. Do not tell anyone.”',hi:'कोई बड़ा तुम्हें चॉकलेट देकर कहता है, “यह हमारा राज़ है। किसी को मत बताना।”',a:0,why:{en:'A secret you must hide from Mummy and Papa is not safe. Tell them, even if you took the chocolate.',hi:'जो राज़ मम्मी और पापा से छिपाना पड़े, वह सुरक्षित नहीं। चॉकलेट ले ली हो, तब भी उन्हें बताओ।'}},
      {ag:'bc',p:'🎂',en:"You keep Papa’s birthday gift a surprise until his birthday.",hi:'तुम पापा के जन्मदिन का तोहफ़ा जन्मदिन तक सरप्राइज़ रखते हो।',a:1,why:{en:'A happy surprise is fine. Everyone finds out soon, and no one feels bad.',hi:'खुशी वाला सरप्राइज़ ठीक है। जल्दी ही सबको पता चल जाता है, और किसी को बुरा नहीं लगता।'}},
      {ag:'bc',p:'👤',en:'Someone you know well touches you in a way that feels wrong.',hi:'कोई जान-पहचान वाला तुम्हें ऐसे छूता है जो गलत लगता है।',a:0,why:{en:'An unsafe touch is not OK, even from a relative, neighbour or teacher. It is never your fault. Tell a grown-up you trust.',hi:'असुरक्षित छूना ठीक नहीं, चाहे वह रिश्तेदार, पड़ोसी या टीचर ही क्यों न हो। इसमें तुम्हारी कोई गलती नहीं। भरोसे के बड़े को बताओ।'}},
      {ag:'bc',p:'📷',en:'Someone wants to take your photo without your clothes.',hi:'कोई बिना कपड़ों के तुम्हारी फ़ोटो लेना चाहता है।',a:0,why:{en:'No one should take such photos. Say NO, go away, and tell a parent.',hi:'ऐसी फ़ोटो कोई नहीं ले सकता। ना कहो, वहाँ से जाओ, और माता-पिता को बताओ।'}},
      {ag:'bc',p:'🔁',en:'You told one grown-up, but they did not listen. So you tell another grown-up you trust.',hi:'तुमने एक बड़े को बताया, पर उन्होंने नहीं सुना। तो तुम दूसरे भरोसे के बड़े को बताते हो।',a:1,why:{en:'Keep telling until someone helps you.',hi:'जब तक कोई मदद न करे, बताते रहो।'}},
      {ag:'bc',p:'👀',en:'Someone shows you their private parts, or pictures of people without clothes.',hi:'कोई तुम्हें अपने निजी अंग या बिना कपड़ों के लोगों की तस्वीरें दिखाता है।',a:0,why:{en:'This is not safe, even if no one touches you. Go away and tell a parent.',hi:'यह सुरक्षित नहीं, भले ही किसी ने छुआ न हो। वहाँ से जाओ और माता-पिता को बताओ।'}},
      {ag:'bc',p:'🙏',en:'You do not want to hug a guest, so you say “Namaste” instead.',hi:'तुम मेहमान को गले नहीं लगाना चाहते, तो “नमस्ते” कहते हो।',a:1,why:{en:'You can choose. Namaste is polite, and your body belongs to you.',hi:'यह तुम चुन सकते हो। नमस्ते कहना भी आदर है, और तुम्हारा शरीर तुम्हारा है।'}},
      {ag:'c',p:'🙅',en:'Someone touches the parts of your body covered by your underwear.',hi:'कोई तुम्हारे अंडरवियर से ढके अंगों को छूता है।',a:0,why:{en:'Say NO loudly, get away, and tell a parent or a grown-up you trust. It is never your fault.',hi:'ज़ोर से ना कहो, वहाँ से निकलो, और माता-पिता या भरोसे के बड़े को बताओ। इसमें तुम्हारी कोई गलती नहीं।'}},
      {ag:'c',p:'📱',en:'Someone you chat with online asks for your photo and says, “Keep our chat secret.”',hi:'ऑनलाइन चैट करने वाला कोई तुम्हारी फ़ोटो माँगता है और कहता है, “हमारी चैट किसी को मत बताना।”',a:0,why:{en:'Do not send photos. Do not delete the chat. Show it to a parent.',hi:'फ़ोटो मत भेजो। चैट मिटाओ मत। माता-पिता को दिखाओ।'}},
      {ag:'c',p:'🤝',en:'A friend tells you that someone touched them in a wrong way. You help your friend tell a trusted grown-up.',hi:'दोस्त बताता है कि किसी ने उसे गलत तरीके से छुआ। तुम उसे भरोसे के बड़े को बताने में मदद करते हो।',a:1,why:{en:'This is too big a secret for children to carry. A trusted grown-up can help your friend.',hi:'यह बात बच्चों के अकेले रखने की नहीं है। भरोसे के बड़े तुम्हारे दोस्त की मदद कर सकते हैं।'}},
      {ag:'c',p:'😟',en:'Someone says, “If you tell anyone, you will be in trouble.”',hi:'कोई कहता है, “किसी को बताया तो तुम मुसीबत में पड़ोगे।”',a:0,why:{en:'This is a trick to keep you quiet. It is never your fault. Tell a parent, or call Childline 1098.',hi:'यह तुम्हें चुप रखने की चाल है। इसमें तुम्हारी कोई गलती नहीं। माता-पिता को बताओ, या चाइल्डलाइन 1098 पर फ़ोन करो।'}},
      {ag:'c',p:'🚪',en:'You close the door when you change clothes, and ask others to knock.',hi:'कपड़े बदलते समय तुम दरवाज़ा बंद करते हो, और दूसरों से खटखटाकर आने को कहते हो।',a:1,why:{en:'Privacy is your right. Give others the same privacy.',hi:'निजता तुम्हारा हक़ है। दूसरों की निजता का भी ध्यान रखो।'}}
    ]},
  wash:{ask:'vaxAsk', max:10, note:function(){ return L(WT.parent); }, opts:[{ic:'✅',cls:'g',v:1,en:'Right',hi:'सही'},{ic:'❌',cls:'r',v:0,en:'Not right',hi:'सही नहीं'}],
    list:[
      {p:'🍽️',en:'You wash your hands with soap before eating.',hi:'खाने से पहले तुम साबुन से हाथ धोते हो।',a:1,why:{en:'Germs on the hands go into the mouth with food. Soap washes them away.',hi:'हाथों के कीटाणु खाने के साथ मुँह में चले जाते हैं। साबुन उन्हें धो देता है।'}},
      {p:'🚽',en:'After the toilet, you rinse your hands with water only.',hi:'टॉयलेट के बाद तुम सिर्फ़ पानी से हाथ धोते हो।',a:0,why:{en:'Water alone does not remove germs. Use soap every time after the toilet.',hi:'सिर्फ़ पानी से कीटाणु नहीं हटते। टॉयलेट के बाद हर बार साबुन लगाओ।'}},
      {p:'⚽',en:'You come home from the park and wash your hands with soap.',hi:'पार्क से घर आकर तुम साबुन से हाथ धोते हो।',a:1,why:{en:'Hands pick up dirt and germs outside. Wash them when you come home.',hi:'बाहर हाथों पर मिट्टी और कीटाणु लग जाते हैं। घर आकर हाथ धोओ।'}},
      {p:'🐶',en:'You pat a dog and then eat a biscuit without washing your hands.',hi:'कुत्ते को सहलाकर तुम बिना हाथ धोए बिस्किट खाते हो।',a:0,why:{en:'Wash your hands with soap after touching animals, and before you eat.',hi:'जानवरों को छूने के बाद और खाने से पहले साबुन से हाथ धोओ।'}},
      {p:'🤧',en:'You sneeze into your hands and then pick up your friend’s toy.',hi:'तुम हाथों में छींकते हो और फिर दोस्त का खिलौना उठा लेते हो।',a:0,why:{en:'Sneeze into your elbow or a tissue. If you sneeze into your hands, wash them.',hi:'कोहनी या टिशू में छींको। हाथों में छींक आ जाए तो हाथ धो लो।'}},
      {p:'⏱️',en:'You rub soap on your hands for 3 seconds and rinse.',hi:'तुम 3 सेकंड साबुन रगड़कर हाथ धो लेते हो।',a:0,why:{en:'Rub with soap for 20 seconds, so every part of the hand gets clean.',hi:'20 सेकंड तक साबुन रगड़ो, ताकि हाथ का हर हिस्सा साफ़ हो।'}},
      {p:'👕',en:'You dry your washed hands on your dirty T-shirt.',hi:'धुले हाथ तुम अपनी गंदी टी-शर्ट से पोंछते हो।',a:0,why:{en:'Dirty cloth puts germs back on clean hands. Use a clean towel.',hi:'गंदे कपड़े से साफ़ हाथों पर फिर कीटाणु लग जाते हैं। साफ़ तौलिया लो।'}},
      {p:'💅',en:'You keep your nails short and clean.',hi:'तुम नाखून छोटे और साफ़ रखते हो।',a:1,why:{en:'Dirt and germs hide under long nails.',hi:'लंबे नाखूनों के नीचे मैल और कीटाणु छिपे रहते हैं।'}},
      {ag:'c',p:'🧴',en:'There is no soap and water, and your hands look clean. You use hand sanitiser.',hi:'साबुन और पानी नहीं है, और हाथ साफ़ दिख रहे हैं। तुम हैंड सैनिटाइज़र लगाते हो।',a:1,why:{en:'Sanitiser is fine when hands are not dirty. When you can see dirt, use soap and water.',hi:'हाथ गंदे न दिखें तो सैनिटाइज़र ठीक है। मैल दिखे तो साबुन और पानी से धोओ।'}}
    ]},
  drink:{ask:'drinkAsk', max:10, note:function(){ return L(DT.parent); }, opts:[{ic:'👍',cls:'g',v:1,en:'Good every day',hi:'रोज़ के लिए ठीक'},{ic:'👎',cls:'r',v:0,en:'Not every day',hi:'रोज़ नहीं'}],
    list:[
      {p:'💧',en:'Plain water',hi:'सादा पानी',a:1,why:{en:'Water is the best drink when you are thirsty.',hi:'प्यास लगे तो पानी सबसे अच्छा पेय है।'}},
      {p:'🥛',en:'Plain milk',hi:'सादा दूध',a:1,why:{en:'Milk gives calcium and protein for strong bones. Drink it without added sugar.',hi:'दूध से हड्डियों के लिए कैल्शियम और प्रोटीन मिलता है। इसे बिना चीनी मिलाए पियो।'}},
      {p:'🥤',en:'Cold drink',hi:'कोल्ड ड्रिंक',a:0,why:{en:'A cold drink is sugar water with gas. It harms the teeth and adds weight.',hi:'कोल्ड ड्रिंक गैस वाला चीनी का पानी है। यह दाँत खराब करता है और वज़न बढ़ाता है।'}},
      {p:'🧃',en:'Packet fruit juice',hi:'पैकेट वाला फलों का जूस',a:0,why:{en:'Packet juice has a lot of sugar and almost no fibre. Eat the whole fruit.',hi:'पैकेट के जूस में बहुत चीनी होती है और रेशा लगभग नहीं। पूरा फल खाओ।'}},
      {p:'🥥',en:'Fresh coconut water',hi:'ताज़ा नारियल पानी',a:1,why:{en:'Fresh coconut water has no added sugar.',hi:'ताज़े नारियल पानी में ऊपर से चीनी नहीं होती।'}},
      {p:'🥣',en:'Chaas, or lassi without sugar',hi:'छाछ, या बिना चीनी की लस्सी',a:1,why:{en:'Chaas is made from curd. It is good for the tummy and has no added sugar.',hi:'छाछ दही से बनती है। यह पेट के लिए अच्छी है और इसमें चीनी नहीं होती।'}},
      {p:'🍹',en:'Sweet sherbet or squash',hi:'मीठा शरबत या स्क्वैश',a:0,why:{en:'Sherbet and squash are mostly sugar and colour.',hi:'शरबत और स्क्वैश में ज़्यादातर चीनी और रंग होता है।'}},
      {ag:'bc',p:'🍋',en:'Home-made nimbu pani with very little sugar',hi:'घर का बना नींबू पानी, बहुत कम चीनी के साथ',a:1,why:{en:'Nimbu pani with very little sugar is fine. With a lot of sugar it becomes a sugary drink.',hi:'बहुत कम चीनी वाला नींबू पानी ठीक है। ज़्यादा चीनी डालने पर यह मीठा पेय बन जाता है।'}},
      {ag:'bc',p:'☕',en:'Tea or coffee',hi:'चाय या कॉफ़ी',a:0,why:{en:'Tea and coffee have caffeine, which can disturb sleep. They are not everyday drinks for children.',hi:'चाय और कॉफ़ी में कैफ़ीन होता है, जो नींद खराब कर सकता है। ये बच्चों के रोज़ के पेय नहीं हैं।'}},
      {ag:'bc',p:'⚡',en:'Energy drink',hi:'एनर्जी ड्रिंक',a:0,why:{en:'Energy drinks have a lot of caffeine and sugar. They are not for children.',hi:'एनर्जी ड्रिंक में बहुत कैफ़ीन और चीनी होती है। ये बच्चों के लिए नहीं हैं।'}},
      {ag:'bc',p:'🏃',en:'A sports drink after playing',hi:'खेलने के बाद स्पोर्ट्स ड्रिंक',a:0,why:{en:'After play, water is enough. Sports drinks add sugar.',hi:'खेलने के बाद पानी काफ़ी है। स्पोर्ट्स ड्रिंक में चीनी होती है।'}},
      {ag:'bc',p:'🍫',en:'Chocolate milk from a packet',hi:'पैकेट वाला चॉकलेट दूध',a:0,why:{en:'Flavoured milk has added sugar. Plain milk is better.',hi:'फ्लेवर वाले दूध में चीनी मिली होती है। सादा दूध बेहतर है।'}},
      {ag:'bc',p:'🍊',en:'A glass of fresh fruit juice every day',hi:'रोज़ एक गिलास ताज़ा फलों का जूस',a:0,why:{en:'Even fresh juice has the sugar of many fruits without their fibre. A whole fruit is better.',hi:'ताज़े जूस में भी कई फलों की चीनी होती है, पर रेशा नहीं। पूरा फल बेहतर है।'}}
    ]},
  road:{ask:'safeAsk', max:10, note:function(){ return L(RT.parent); }, opts:[{ic:'✅',cls:'g',v:1,en:'Safe',hi:'सुरक्षित'},{ic:'⚠️',cls:'r',v:0,en:'Not safe',hi:'सुरक्षित नहीं'}],
    list:[
      {p:'🤝',en:'You hold Papa’s hand while walking near the road.',hi:'सड़क के पास चलते समय तुम पापा का हाथ पकड़ते हो।',a:1,why:{en:'Holding a grown-up’s hand keeps you away from traffic.',hi:'बड़े का हाथ पकड़ने से तुम गाड़ियों से दूर रहते हो।'}},
      {p:'⚽',en:'Your ball rolls onto the road, and you run after it.',hi:'गेंद सड़क पर चली जाती है, और तुम उसके पीछे भागते हो।',a:0,why:{en:'Stop at the edge. Ask a grown-up to get the ball.',hi:'किनारे पर रुक जाओ। गेंद लाने के लिए किसी बड़े से कहो।'}},
      {p:'🛵',en:'You stand in front on the scooter, without a helmet.',hi:'तुम स्कूटर पर आगे खड़े होते हो, बिना हेलमेट के।',a:0,why:{en:'Everyone on a scooter needs a helmet, children too. Sit properly behind the driver and hold on.',hi:'स्कूटर पर हर किसी को हेलमेट चाहिए, बच्चों को भी। चलाने वाले के पीछे ठीक से बैठो और पकड़कर रखो।'}},
      {p:'🚗',en:'In the car, you sit in the back seat with your seat belt on.',hi:'कार में तुम पीछे की सीट पर सीट बेल्ट लगाकर बैठते हो।',a:1,why:{en:'The back seat with a seat belt or child seat is the safest place for children.',hi:'बच्चों के लिए सबसे सुरक्षित जगह पीछे की सीट है, सीट बेल्ट या चाइल्ड सीट के साथ।'}},
      {p:'👩',en:'In the car, you sit on Mummy’s lap in the front seat.',hi:'कार में तुम आगे की सीट पर मम्मी की गोद में बैठते हो।',a:0,why:{en:'A lap cannot hold you in a crash. Sit in the back seat with a belt or child seat.',hi:'टक्कर में गोद तुम्हें नहीं रोक सकती। पीछे की सीट पर बेल्ट या चाइल्ड सीट में बैठो।'}},
      {p:'🚌',en:'You put your head or hand out of the bus window.',hi:'तुम बस की खिड़की से सिर या हाथ बाहर निकालते हो।',a:0,why:{en:'Keep your head and hands inside. Other vehicles pass very close.',hi:'सिर और हाथ अंदर रखो। दूसरी गाड़ियाँ बहुत पास से निकलती हैं।'}},
      {p:'🚙',en:'You play behind a parked car.',hi:'तुम खड़ी कार के पीछे खेलते हो।',a:0,why:{en:'The driver cannot see you behind the car. Play in the park or a safe open place.',hi:'गाड़ी के पीछे ड्राइवर तुम्हें नहीं देख सकता। पार्क या सुरक्षित खुली जगह में खेलो।'}},
      {ag:'bc',p:'👀',en:'Before crossing, you stop, look right, look left, and look right again.',hi:'सड़क पार करने से पहले तुम रुकते हो, दाएँ देखते हो, बाएँ देखते हो, और फिर दाएँ देखते हो।',a:1,why:{en:'Stop, look and listen every time. Cross only when the road is clear.',hi:'हर बार रुको, देखो और सुनो। सड़क खाली हो तभी पार करो।'}},
      {ag:'bc',p:'🚲',en:'You wear a helmet when you ride your cycle.',hi:'साइकिल चलाते समय तुम हेलमेट पहनते हो।',a:1,why:{en:'A helmet protects your head if you fall.',hi:'गिरने पर हेलमेट सिर को बचाता है।'}},
      {ag:'bc',p:'🚦',en:'The signal is about to change, so you run across the road.',hi:'सिग्नल बदलने वाला है, इसलिए तुम भागकर सड़क पार करते हो।',a:0,why:{en:'Do not run. Wait for the next green signal for walkers.',hi:'भागो मत। पैदल चलने वालों के अगले हरे सिग्नल का इंतज़ार करो।'}},
      {ag:'bc',p:'🚌',en:'You jump off the bus before it stops fully.',hi:'बस पूरी रुकने से पहले तुम उतर जाते हो।',a:0,why:{en:'Get on and off only when the bus has stopped.',hi:'बस पूरी रुक जाए, तभी चढ़ो और उतरो।'}},
      {ag:'bc',p:'🚶',en:'You walk on the footpath, not on the road.',hi:'तुम सड़क पर नहीं, फुटपाथ पर चलते हो।',a:1,why:{en:'The footpath is for walking. If there is none, walk at the side, facing the traffic.',hi:'फुटपाथ चलने के लिए है। फुटपाथ न हो तो किनारे पर, सामने से आती गाड़ियों की ओर मुँह करके चलो।'}},
      {ag:'c',p:'📱',en:'You cross the road while looking at your phone, with earphones on.',hi:'तुम फ़ोन देखते हुए और ईयरफ़ोन लगाकर सड़क पार करते हो।',a:0,why:{en:'Phone away and earphones off near the road. You need your eyes and ears.',hi:'सड़क के पास फ़ोन रख दो और ईयरफ़ोन उतार दो। आँख और कान दोनों चाहिए।'}},
      {ag:'c',p:'🌙',en:'You cycle in the evening with a light, reflectors and bright clothes.',hi:'शाम को तुम लाइट, रिफ़्लेक्टर और चमकीले कपड़ों के साथ साइकिल चलाते हो।',a:1,why:{en:'Drivers must be able to see you in the dark.',hi:'अँधेरे में गाड़ी वालों को तुम दिखने चाहिए।'}},
      {ag:'c',p:'🛵',en:'You ride your cousin’s scooter on the road by yourself.',hi:'तुम चचेरे भाई की स्कूटी खुद सड़क पर चलाते हो।',a:0,why:{en:'Children must not drive. It is against the law and very dangerous.',hi:'बच्चों को गाड़ी नहीं चलानी चाहिए। यह कानून के खिलाफ़ और बहुत खतरनाक है।'}}
    ]},
  feel:{ask:'feelAsk', max:8, col:true, note:function(){ return L(FT.parent); },
    list:[
      {ag:'a',p:'😀',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Happy',hi:'खुश'},{en:'Sad',hi:'उदास'},{en:'Angry',hi:'गुस्सा'}],a:0,why:{en:'This face is happy. What makes {N} happy?',hi:'यह चेहरा खुश है। {N} को किस बात से खुशी मिलती है?'}},
      {ag:'a',p:'😢',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Sleepy',hi:'नींद में'},{en:'Sad',hi:'उदास'},{en:'Happy',hi:'खुश'}],a:1,why:{en:'This face is sad. When you feel sad, tell Mummy or Papa. A hug helps.',hi:'यह चेहरा उदास है। उदास लगे तो मम्मी या पापा को बताओ। गले लगने से अच्छा लगता है।'}},
      {ag:'a',p:'😠',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Angry',hi:'गुस्सा'},{en:'Scared',hi:'डरा हुआ'},{en:'Happy',hi:'खुश'}],a:0,why:{en:'This face is angry. When you feel angry, take a deep breath. Do not hit.',hi:'यह चेहरा गुस्से में है। गुस्सा आए तो गहरी साँस लो। मारो मत।'}},
      {ag:'a',p:'😨',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Happy',hi:'खुश'},{en:'Sleepy',hi:'नींद में'},{en:'Scared',hi:'डरा हुआ'}],a:2,why:{en:'This face is scared. When you feel scared, go to Mummy or Papa.',hi:'यह चेहरा डरा हुआ है। डर लगे तो मम्मी या पापा के पास जाओ।'}},
      {ag:'a',p:'😴',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Angry',hi:'गुस्सा'},{en:'Sleepy',hi:'नींद में'},{en:'Sad',hi:'उदास'}],a:1,why:{en:'This face is sleepy. When you feel sleepy, it is time for bed.',hi:'इस चेहरे को नींद आ रही है। नींद आए तो सोने का समय है।'}},
      {ag:'a',p:'😲',ask:{en:'How does this face feel?',hi:'यह चेहरा कैसा महसूस कर रहा है?'},opts:[{en:'Surprised',hi:'हैरान'},{en:'Sad',hi:'उदास'},{en:'Angry',hi:'गुस्सा'}],a:0,why:{en:'This face is surprised. Something new happened!',hi:'यह चेहरा हैरान है। कुछ नया हुआ है!'}},
      {ag:'b',p:'😠',en:'Your brother tears your drawing. You feel very angry.',hi:'भाई तुम्हारी ड्रॉइंग फाड़ देता है। तुम्हें बहुत गुस्सा आता है।',opts:[{en:'Hit him',hi:'उसे मार दो'},{en:'Take 3 deep breaths and say, “I am angry”',hi:'3 गहरी साँसें लो और कहो, “मुझे गुस्सा आ रहा है”'},{en:'Tear his book',hi:'उसकी किताब फाड़ दो'}],a:1,why:{en:'Feeling angry is OK. Hitting is not. Breathe slowly and say it in words.',hi:'गुस्सा आना ठीक है। मारना ठीक नहीं। धीरे साँस लो और बात शब्दों में कहो।'}},
      {ag:'b',p:'😢',en:'Your friend does not play with you today. You feel sad.',hi:'आज दोस्त तुम्हारे साथ नहीं खेलता। तुम उदास हो।',opts:[{en:'Tell Mummy or Papa how you feel',hi:'मम्मी या पापा को बताओ कि कैसा लग रहा है'},{en:'Hide in your room and tell no one',hi:'कमरे में छिप जाओ और किसी को न बताओ'}],a:0,why:{en:'Talking about a sad feeling makes it lighter.',hi:'उदासी की बात बताने से मन हल्का होता है।'}},
      {ag:'b',p:'😨',en:'You feel scared of the dark at night.',hi:'रात को तुम्हें अँधेरे से डर लगता है।',opts:[{en:'Stay awake quietly all night',hi:'चुपचाप पूरी रात जागते रहो'},{en:'Tell Mummy or Papa, and ask for a small night lamp',hi:'मम्मी या पापा को बताओ, और छोटा नाइट लैंप माँगो'}],a:1,why:{en:'Many children feel scared of the dark. Telling a grown-up helps.',hi:'बहुत से बच्चों को अँधेरे से डर लगता है। बड़ों को बताने से मदद मिलती है।'}},
      {ag:'b',p:'😤',en:'You lose a game of ludo.',hi:'तुम लूडो का खेल हार जाते हो।',opts:[{en:'Say, “Good game!” and play again',hi:'कहो, “अच्छा खेले!” और फिर से खेलो'},{en:'Throw the board',hi:'बोर्ड फेंक दो'},{en:'Say, “You cheated!”',hi:'कहो, “तुमने बेईमानी की!”'}],a:0,why:{en:'Everyone loses sometimes. A good player stays kind.',hi:'कभी-कभी हर कोई हारता है। अच्छा खिलाड़ी प्यार से पेश आता है।'}},
      {ag:'b',p:'😟',en:'You are worried about tomorrow’s test.',hi:'तुम्हें कल के टेस्ट की चिंता है।',opts:[{en:'Say you have a tummy ache and skip school',hi:'पेट दर्द का बहाना बनाकर स्कूल मत जाओ'},{en:'Tell Mummy or Papa, and revise a little',hi:'मम्मी या पापा को बताओ, और थोड़ा दोहरा लो'}],a:1,why:{en:'Sharing the worry and doing a little practice makes it smaller.',hi:'चिंता बताने और थोड़ा अभ्यास करने से वह छोटी हो जाती है।'}},
      {ag:'b',p:'😭',en:'Your friend is crying in the playground.',hi:'खेल के मैदान में तुम्हारा दोस्त रो रहा है।',opts:[{en:'Laugh at your friend',hi:'दोस्त पर हँसो'},{en:'Walk away',hi:'वहाँ से चले जाओ'},{en:'Ask, “Are you OK?” and call the teacher',hi:'पूछो, “तुम ठीक हो?” और टीचर को बुलाओ'}],a:2,why:{en:'Kind words help a sad friend. A grown-up can help too.',hi:'प्यार के शब्द उदास दोस्त की मदद करते हैं। बड़े भी मदद कर सकते हैं।'}},
      {ag:'bc',p:'😳',en:'You give a wrong answer in class, and some children laugh.',hi:'कक्षा में तुम्हारा जवाब गलत हो जाता है, और कुछ बच्चे हँसते हैं।',opts:[{en:'Never answer in class again',hi:'फिर कभी कक्षा में जवाब मत दो'},{en:'Tell yourself, “Mistakes help me learn,” and try again',hi:'खुद से कहो, “गलतियों से सीखते हैं,” और फिर कोशिश करो'}],a:1,why:{en:'Everyone makes mistakes. Trying again is how you learn.',hi:'गलती सबसे होती है। फिर कोशिश करने से ही सीखते हैं।'}},
      {ag:'c',p:'😔',en:'A classmate teases you every day and calls you names.',hi:'एक सहपाठी रोज़ तुम्हें चिढ़ाता है और बुरे नाम से बुलाता है।',opts:[{en:'Keep quiet and bear it',hi:'चुप रहो और सहते रहो'},{en:'Tell a parent or teacher you trust',hi:'माता-पिता या भरोसे के टीचर को बताओ'},{en:'Hit the classmate',hi:'उसे मार दो'}],a:1,why:{en:'Teasing again and again is bullying. It is not your fault. A trusted grown-up can stop it.',hi:'बार-बार चिढ़ाना बुलिंग है। इसमें तुम्हारी गलती नहीं। भरोसे के बड़े इसे रोक सकते हैं।'}},
      {ag:'c',p:'📚',en:'Exams are near, and you feel very tense.',hi:'परीक्षा पास है, और तुम बहुत तनाव में हो।',opts:[{en:'Make a study plan, take short breaks, and sleep on time',hi:'पढ़ाई की योजना बनाओ, छोटे ब्रेक लो, और समय पर सोओ'},{en:'Study all night without sleep',hi:'बिना सोए पूरी रात पढ़ो'}],a:0,why:{en:'A plan, breaks and good sleep help the brain remember. Tell your parents if the tension stays.',hi:'योजना, ब्रेक और अच्छी नींद से दिमाग याद रखता है। तनाव बना रहे तो माता-पिता को बताओ।'}},
      {ag:'c',p:'😡',en:'Papa says no to a new phone. You feel angry.',hi:'पापा नए फ़ोन के लिए मना कर देते हैं। तुम्हें गुस्सा आता है।',opts:[{en:'Shout and bang the door',hi:'चिल्लाओ और दरवाज़ा पटको'},{en:'Calm down first, then talk about it politely',hi:'पहले शांत हो जाओ, फिर आराम से बात करो'}],a:1,why:{en:'Wait until the anger settles. A calm talk is heard better.',hi:'गुस्सा शांत होने दो। शांत होकर कही बात ज़्यादा सुनी जाती है।'}},
      {ag:'c',p:'💬',en:'Someone writes a mean comment about you online.',hi:'कोई ऑनलाइन तुम्हारे बारे में बुरी बात लिखता है।',opts:[{en:'Write a mean reply',hi:'तुम भी बुरा जवाब लिखो'},{en:'Do not reply. Take a screenshot and show a parent',hi:'जवाब मत दो। स्क्रीनशॉट लो और माता-पिता को दिखाओ'}],a:1,why:{en:'An angry reply makes it worse. Save the proof and tell a parent.',hi:'गुस्से का जवाब बात बिगाड़ता है। सबूत रखो और माता-पिता को बताओ।'}},
      {ag:'c',p:'😞',en:'You have felt sad for many days, and nothing feels fun.',hi:'तुम कई दिनों से उदास हो, और किसी चीज़ में मन नहीं लगता।',opts:[{en:'Tell a parent how you feel',hi:'माता-पिता को बताओ कि कैसा लग रहा है'},{en:'Wait alone for it to go away',hi:'अकेले इंतज़ार करो कि यह खुद ठीक हो जाए'}],a:0,why:{en:'Sadness that stays for many days needs help. Talk to a parent. The doctor can help too.',hi:'कई दिन तक रहने वाली उदासी में मदद चाहिए। माता-पिता से बात करो। डॉक्टर भी मदद कर सकते हैं।'}},

function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box = document.createElement('div'); box.className='confetti';
  var cols = ['#ffc93c','#3fb66b','#e2483d','#4aa8ff','#ff7b8a','#ffa94d'];
  for(var i=0;i<36;i++){ var s=document.createElement('span'); s.style.left=(Math.random()*100)+'%'; s.style.background=cols[i%cols.length]; s.style.animationDelay=(Math.random()*.3)+'s'; s.style.animationDuration=(1+Math.random()*.8)+'s'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(function(){ box.remove(); }, 2300);
}
function flyStar(fromEl){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var a = fromEl.getBoundingClientRect(), b = document.getElementById('bankBox').getBoundingClientRect();
  var s = document.createElement('div'); s.className='fly'; s.textContent='⭐';
  s.style.left = (a.left + a.width/2 - 17)+'px'; s.style.top = (a.top + a.height/2 - 17)+'px';
  s.style.setProperty('--dx', (b.left - a.left - a.width/2 + 20)+'px'); s.style.setProperty('--dy', (b.top - a.top - a.height/2)+'px');
  document.body.appendChild(s); setTimeout(function(){ s.remove(); updateBank(); }, 800);
}

var MC = null, mTimer = null, mGame = null;
function mNote(f,t,d){ var o=MC.createOscillator(), g=MC.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.02); g.gain.linearRampToValueAtTime(0,t+d*.9); o.connect(g); g.connect(MC.destination); o.start(t); o.stop(t+d); }
function mPlay(name){
  try{
    if(!MC){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return; MC = new AC(); }
    if(MC.state === 'suspended') MC.resume();
  }catch(e){ return; }
  var beat = .4, t = MC.currentTime + .05, total = 0;
  MTR[name].forEach(function(n){ mNote(n[0], t + total*beat, n[1]*beat); total += n[1]; });
  mTimer = setTimeout(function(){ if(mGame === name && MUS.on) mPlay(name); }, total*beat*1000 - 50);
}
function mStop(){ mGame = null; clearTimeout(mTimer); mTimer = null; }
function musicFor(name){ mStop(); if(MUS.on && MTR[name]){ mGame = name; mPlay(name); } }
function syncMusicBtn(){ var b = document.getElementById('musicBtn'); if(!b) return; b.textContent = MUS.on ? '🎵' : '🔇'; b.setAttribute('aria-pressed', String(MUS.on)); b.setAttribute('aria-label', MUS.on ? 'Music on' : 'Music off'); }
function musicToggle(){ MUS.on = !MUS.on; try{ localStorage.setItem('golu-music-v2', MUS.on ? 'on' : 'off'); }catch(e){} syncMusicBtn(); if(MUS.on) musicFor(current); else mStop(); }

/* ---------- food game ---------- */
var G = null;
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function startGame(){
  var pool = forAge(FOODS);
  var good = shuffle(pool.filter(function(f){return f.g;})).slice(0,5);
  var bad = shuffle(pool.filter(function(f){return !f.g;})).slice(0,5);
  G = {list: shuffle(good.concat(bad)), i:0, res:[], answered:false, won:0};
  renderFood();
}
function progHtml(){
  return '<div class="prog">'+G.list.map(function(f,k){ var c = k<G.res.length ? (G.res[k]?'ok':'no') : (k===G.i?'now':''); return '<i class="'+c+'"></i>'; }).join('')+'</div>';
}
function renderFood(){
  var el = document.getElementById('s-food');
  if(G.i >= G.list.length){
    var mood = G.won >= 8 ? 'wow' : G.won >= 5 ? 'happy' : 'sad';
    el.innerHTML = progHtml()+'<div class="result">'+goluSvg(mood,'bounce')+'<h2>'+L(T.done)+'</h2><div>'+L(T.youGot)+'</div><div class="score">⭐ '+G.won+' / '+G.list.length+'</div></div>'+
      '<button type="button" class="go" id="again">'+L(T.playAgain)+'</button>';
    if(G.won >= 7) confetti();
    return;
  }
  var f = G.list[G.i];
  var h = progHtml()+
    '<div style="display:flex;justify-content:center">'+goluSvg('happy','small')+'</div>'+
    '<div class="food" id="foodCard"><span class="pic" aria-hidden="true">'+f.p+'</span><span class="nm">'+esc(L(f))+'</span><span class="stamp" id="stamp"></span></div>';
  if(!G.answered){
    h += '<div class="ask">'+L(T.ask)+'</div><div class="yn"><button type="button" class="yes" data-ans="1"><span class="ic">👍</span>'+L(T.yes)+'</button><button type="button" class="no" data-ans="0"><span class="ic">👎</span>'+L(T.no)+'</button></div>';
  }
  el.innerHTML = h;
}
function answer(v, btn){
  if(G.answered) return;
  var f = G.list[G.i], ok = (v === !!f.g);
  G.answered = true; G.res.push(ok);
  var el = document.getElementById('s-food');
  el.querySelector('.ask').remove(); el.querySelector('.yn').remove();
  var card = document.getElementById('foodCard'), stamp = document.getElementById('stamp');
  var why = f.g ? (f.why || GOODWHY) : f.why;
  if(ok){
    G.won++; KID().bonus++; save();
    react(el,'wow'); flyStar(card);
  } else {
    react(el,'sad');
  }
  // The mark shows the food, not the answer: healthy food gets a green tick, junk food gets a big red cross.
  if(f.g){
    stamp.className='stamp good show'; stamp.textContent='✓';
  } else {
    card.classList.add('struck');
    var bx = document.createElement('div'); bx.className='bigx'; bx.setAttribute('aria-hidden','true'); bx.textContent='✗';
    card.appendChild(bx);
  }
  var w = document.createElement('div'); w.className = 'why '+(ok?'good':'bad');
  w.innerHTML = '<div style="font-size:22px;font-weight:800">'+(ok?L(T.right):L(T.wrong))+'</div>'+esc(L(why));
  var nx = document.createElement('button'); nx.type='button'; nx.className='go'; nx.id='nextFood'; nx.textContent = L(T.next)+' →';
  el.appendChild(w); el.appendChild(nx);
  // refresh progress dots
  el.querySelector('.prog').outerHTML = progHtml();
  nx.focus();
}

function stopTimer(){ if(typeof WH !== 'undefined' && WH && WH.t){ clearInterval(WH.t); WH.t = null; } }

/* ---------- quiz games: screen, safe, behave ---------- */
var QS = {};
function progHtml2(st){ return '<div class="prog">'+st.list.map(function(f,k){ var c = k<st.res.length ? (st.res[k]?'ok':'no') : (k===st.i?'now':''); return '<i class="'+c+'"></i>'; }).join('')+'</div>'; }
function qStart(name){ var ql = shuffle(forAge(QZ[name].list)); if(QZ[name].max) ql = ql.slice(0, QZ[name].max); QS[name] = {list: ql, i:0, won:0, res:[], answered:false}; qRender(name); }
function qRender(name){
  if(!QS[name]){ qStart(name); return; }
  var el = document.getElementById('s-'+name), cfg = QZ[name], st = QS[name];
  if(st.i >= st.list.length){
    var mood = st.won >= st.list.length-1 ? 'wow' : st.won >= Math.ceil(st.list.length/2) ? 'happy' : 'sad';
    el.innerHTML = progHtml2(st)+'<div class="result">'+goluSvg(mood,'bounce')+'<h2>'+L(T.done)+'</h2><div class="score">⭐ '+st.won+' / '+st.list.length+'</div></div>'+
      '<button type="button" class="go" data-qstart="'+name+'">'+L(T.playAgain)+'</button>'+
      (cfg.end ? cfg.end() : '')+(cfg.note ? '<div class="pnote">'+cfg.note()+'</div>' : '');
    if(st.won >= st.list.length-1) confetti();
    return;
  }
  var it = st.list[st.i];
  var h = progHtml2(st)+'<div style="display:flex;justify-content:center">'+goluSvg('happy','small')+'</div>'+
    '<div class="food" id="qCard"><span class="pic" aria-hidden="true">'+it.p+'</span>'+(it.en ? '<span class="nm">'+esc(L(it))+'</span>' : '')+'<span class="stamp" id="qStamp"></span></div>';
  if(!st.answered){
    h += '<div class="ask">'+L(it.ask || T[cfg.ask])+'</div><div class="opts'+(cfg.col ? ' col' : '')+'">'+(it.opts || cfg.opts).map(function(o,k){
      return '<button type="button" class="opt '+(o.cls || 'n')+'" data-qname="'+name+'" data-qi="'+k+'">'+(o.ic ? '<span class="ic">'+o.ic+'</span>' : '')+esc(L(o))+'</button>';
    }).join('')+'</div>';
  }
  el.innerHTML = h;
}
function qAnswer(name, k){
  var st = QS[name], cfg = QZ[name];
  if(!st || st.answered) return;
  var it = st.list[st.i], ok = it.opts ? (k === it.a) : (cfg.opts[k].v === it.a);
  st.answered = true; st.res.push(ok);
  var el = document.getElementById('s-'+name), card = document.getElementById('qCard'), stamp = document.getElementById('qStamp');
  el.querySelector('.ask').remove(); el.querySelector('.opts').remove();
  if(ok){ st.won++; KID().bonus++; save(); stamp.className='stamp good show'; stamp.textContent='✓'; react(el,'wow'); flyStar(card); }
  else { stamp.className='stamp bad show'; stamp.textContent='✗'; react(el,'sad'); }
  var w = document.createElement('div'); w.className = 'why '+(ok?'good':'bad');
  w.innerHTML = '<div style="font-size:22px;font-weight:800">'+(ok?L(T.right):L(T.wrong))+'</div>'+(it.opts ? '<div style="font-weight:800">✓ '+esc(L(it.opts[it.a]))+'</div>' : '')+esc(L(it.why));
  var nx = document.createElement('button'); nx.type='button'; nx.className='go'; nx.dataset.qnext = name; nx.textContent = L(T.next)+' →';
  el.appendChild(w); el.appendChild(nx); el.querySelector('.prog').outerHTML = progHtml2(st); nx.focus();
}
function qNext(name){ var st = QS[name]; st.i++; st.answered = false; qRender(name); }

/* ---------- balanced plate ---------- */
var PL = {sel:{}, junk:{}, scored:false, res:false};
function plateDiet(){ return KID().diet || 'veg'; }
function plateGroups(){
  var d = plateDiet();
  return PLATE_GROUPS.filter(function(g){ return !g.diet || (g.diet === 'egg' && d !== 'veg') || (g.diet === 'nv' && d === 'nv'); });
}
function plateRender(){
  var el = document.getElementById('s-plate'), groups = plateGroups(), d = plateDiet(), filled = 0, picked = '';
  var rows = groups.map(function(g, n){
    var items = forAge(g.items), has = items.some(function(x){ return PL.sel[g.k] === x.k; });
    if(!has) delete PL.sel[g.k]; else { filled++; picked += items.filter(function(x){ return PL.sel[g.k] === x.k; })[0].p + ' '; }
    return '<div class="grp" style="--c:'+g.c+'"><h3><span>'+(n+1)+'. '+esc(L(g))+'</span><span class="one'+(has?' ok':'')+'">'+(has ? '✅' : L(PT.one))+'</span></h3>'+
      '<div class="chips">'+items.map(function(x){ return '<button type="button" class="chip" aria-pressed="'+(PL.sel[g.k]===x.k)+'" data-pg="'+g.k+'" data-pi="'+x.k+'"><span class="pic" aria-hidden="true">'+x.p+'</span>'+esc(L(x))+'</button>'; }).join('')+'</div></div>';
  }).join('');
  var junk = forAge(PLATE_JUNK);
  junk.forEach(function(x){ if(PL.junk[x.k]) picked += x.p + ' '; });
  el.innerHTML = '<div class="bubble" style="text-align:center;align-self:center">'+L(T.plateAsk)+'</div>'+
    '<div class="dietrow"><b>'+L(PT.diet)+'</b><div class="dietseg">'+DIETS.map(function(x){ return '<button type="button" data-diet="'+x.k+'" aria-pressed="'+(d===x.k)+'">'+x.p+' '+esc(L(x))+'</button>'; }).join('')+'</div></div>'+
    '<div class="plate" aria-live="polite">'+(picked ? picked : esc(L(T.plateEmpty)))+'</div>'+
    '<div class="counter">'+L(PT.count).replace('{n}', filled).replace('{t}', groups.length)+'</div>'+
    rows+
    '<div class="grp" style="--c:#d7263d"><h3><span>'+L(PT.junk)+'</span></h3><div class="chips">'+junk.map(function(x){ return '<button type="button" class="chip" aria-pressed="'+(!!PL.junk[x.k])+'" data-pj="'+x.k+'"><span class="pic" aria-hidden="true">'+x.p+'</span>'+esc(L(x))+'</button>'; }).join('')+'</div></div>'+
    '<button type="button" class="go" data-pcheck="1">'+L(T.plateCheck)+'</button>'+
    '<div id="plateRes"></div><div class="pnote">'+L(PT.parent)+'</div>';
  if(PL.res) plateCheck(true);
}
function plateCheck(quiet){
  var groups = plateGroups(), junk = forAge(PLATE_JUNK).filter(function(x){ return PL.junk[x.k]; });
  var rows = groups.map(function(g){ return '<div>'+(PL.sel[g.k]?'✅':'⬜')+' '+esc(L(g))+'</div>'; }).join('');
  var allOk = groups.every(function(g){ return PL.sel[g.k]; }) && !junk.length;
  var msg = allOk ? L(T.plateGood) : (junk.length ? L(T.plateJunk) : L(T.plateMissing));
  var junkBox = '';
  if(junk.length){
    document.querySelectorAll('[data-pj]').forEach(function(b){ if(PL.junk[b.getAttribute('data-pj')]) b.classList.add('xj'); });
    junkBox = '<div class="junkbox">'+junk.map(function(x){
      return '<div class="jx"><span class="jp" aria-hidden="true">'+x.p+'</span><div><b class="jn">✖ '+esc(L(x))+'</b><br>'+esc(L(x.why))+'</div></div>';
    }).join('')+'<div class="jnote">'+L(T.junkNote)+'</div></div>';
  }
  PL.res = true;
  var box = document.getElementById('plateRes');
  box.innerHTML = '<div class="checklist">'+rows+'</div><div class="why '+(allOk?'good':'bad')+'">'+msg+'</div>'+junkBox;
  if(!quiet) box.scrollIntoView({block:'nearest'});
  if(allOk && !PL.scored){ PL.scored = true; KID().bonus++; save(); updateBank(); confetti(); }
}
function plateTap(b){
  if(b.dataset.diet){ KID().diet = b.dataset.diet; save(); PL.res = false; plateRender(); return; }
  var y = window.scrollY;
  if(b.dataset.pg){ if(PL.sel[b.dataset.pg] === b.dataset.pi) delete PL.sel[b.dataset.pg]; else PL.sel[b.dataset.pg] = b.dataset.pi; }
  else if(b.dataset.pj){ PL.junk[b.dataset.pj] = !PL.junk[b.dataset.pj]; }
  PL.res = false; plateRender(); window.scrollTo(0, y);
}

    '<div class="field" id="vxField"><div class="me">'+goluSvg(left ? 'happy' : 'wow','small')+'</div>'+html+'</div>'+
    (left ? '' : '<div class="why good">'+L(VT.shieldDone)+'</div><button type="button" class="go" data-vx="quiz">'+L(VT.quizGo)+' →</button>')+note;
}
function vaxAct(a){
  if(a === 'step'){ if(VX.i < VAX_TEDDY.length-1) VX.i++; vaxRender(); if(VX.i === VAX_TEDDY.length-1) vaxStar('teddy', document.getElementById('vxCard')); return; }
  if(a === 'blowgo'){ VX.phase = 'blow'; VX.breaths = 0; vaxRender(); return; }
  if(a === 'blow'){
    var pw = document.querySelector('#s-vax .pw'), btn = document.querySelector('#s-vax [data-vx="blow"]');
    if(!pw || pw.classList.contains('on')) return;
    pw.classList.add('on'); if(btn) btn.disabled = true;
    setTimeout(function(){ if(current !== 'vax' || VX.phase !== 'blow') return; VX.breaths++; vaxRender(); if(VX.breaths >= 5) vaxStar('blow', document.getElementById('vxCard')); }, 2400);
    return;
  }
  if(a === 'again'){ VX.phase = ''; VX.i = 0; VX.breaths = 0; VX.germs = []; vaxRender(); return; }
  if(a === 'quiz'){ VX.phase = 'quiz'; qStart('vax'); return; }
}
function germTap(n){
