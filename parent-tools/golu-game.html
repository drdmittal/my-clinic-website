</head><body><title>Golu's Good Habits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one playful phone screen at a time (home, food game, hero chart, potty timer, parents). Single bright daytime look by choice. */
:root{
  color-scheme: light;
  --sky:#bfe6ff; --sky2:#e4f5ff; --sun:#ffc93c; --sun-deep:#f29f05; --grass:#3fb66b; --grass-deep:#22864a;
  --berry:#e2483d; --ink:#21304a; --muted:#56637a; --card:#ffffff; --golu:#ffa94d; --golu-deep:#e8812a; --cheek:#ff7b8a;
  --font:'Baloo 2', 'Mukta', system-ui, sans-serif;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 70%);background-color:var(--sky);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.35}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bank{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 14px 4px 8px;font-weight:800;font-size:20px;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.bank .st{font-size:24px}
.lang{display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.lang button{border:0;background:transparent;font:700 15px var(--font);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.back{border:0;background:var(--card);border-radius:999px;font:700 16px var(--font);color:var(--ink);padding:6px 14px;min-height:40px;cursor:pointer;box-shadow:0 3px 0 rgba(33,48,74,.12)}
.screen{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;text-wrap:balance}
h2{margin:0;font-size:26px;line-height:1.1;font-weight:800;text-align:center;text-wrap:balance}
.bubble{background:var(--card);border-radius:20px;padding:10px 16px;font-size:19px;font-weight:600;position:relative;box-shadow:0 3px 0 rgba(33,48,74,.1);max-width:420px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--card);border-bottom:0}
.golu{width:150px;height:150px;transition:transform .3s}
.golu.small{width:96px;height:96px}
.golu.bounce{animation:bounce .6s}
.golu.shake{animation:shake .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.menu{display:grid;grid-template-columns:1fr;gap:12px}
.tile{display:flex;align-items:center;gap:14px;border:0;border-radius:22px;padding:14px 16px;text-align:left;font:800 22px var(--font);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 rgba(33,48,74,.18);min-height:84px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(33,48,74,.18)}
.tile .ic{font-size:40px;line-height:1;flex:none}
.tile small{display:block;font:600 15px var(--font);color:var(--muted)}
.t-food{background:var(--sun)} .t-chart{background:#9be3b4} .t-timer{background:#ffc7d0}
.parents-link{border:0;background:transparent;font:700 15px var(--font);color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center;min-height:40px}
/* food game */
.prog{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.prog i{width:22px;height:8px;border-radius:9px;background:rgba(33,48,74,.15)}
.prog i.ok{background:var(--grass)} .prog i.no{background:var(--berry)} .prog i.now{background:var(--ink)}
.food{background:var(--card);border-radius:28px;padding:18px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;box-shadow:0 6px 0 rgba(33,48,74,.14);overflow:hidden}
.food .pic{font-size:96px;line-height:1.1}
.food .nm{font-size:28px;font-weight:800;text-align:center;line-height:1.1}
.food.struck .pic,.food.struck .nm{opacity:.45}
.food.struck .nm{text-decoration:line-through;text-decoration-color:var(--berry);text-decoration-thickness:4px}
.stamp{position:absolute;top:14px;right:14px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;transform:scale(0) rotate(-20deg);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.stamp.show{transform:scale(1) rotate(-12deg)}
.stamp.good{background:var(--grass)} .stamp.bad{background:var(--berry)}
.big-x{position:absolute;inset:0;pointer-events:none}
.ask{font-size:22px;font-weight:700;text-align:center}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{border:0;border-radius:24px;min-height:96px;font:800 24px var(--font);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.yn .ic{font-size:40px;line-height:1}
.yes{background:var(--grass);box-shadow:0 6px 0 var(--grass-deep)} .no{background:var(--berry);box-shadow:0 6px 0 #a92a21}
.yn button:active{transform:translateY(4px);box-shadow:none}
.why{border-radius:18px;padding:12px 14px;font-size:19px;font-weight:600;text-align:center}
.why.good{background:#d8f5e2;color:var(--grass-deep)} .why.bad{background:#ffe0dc;color:#a92a21}
.go{border:0;border-radius:22px;min-height:64px;font:800 24px var(--font);background:var(--ink);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.go:active{transform:translateY(3px);box-shadow:none}
.result{background:var(--card);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 6px 0 rgba(33,48,74,.14)}
.result .score{font-size:52px;font-weight:800;color:var(--sun-deep);line-height:1}
/* chart */
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.task{border:3px solid transparent;background:var(--card);border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:700 17px var(--font);color:var(--ink);cursor:pointer;min-height:120px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);position:relative}
.task .ic{font-size:38px;line-height:1}
.task[aria-pressed="true"]{background:#fff6d6;border-color:var(--sun-deep)}
.task .got{position:absolute;top:6px;right:8px;font-size:22px;opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.task[aria-pressed="true"] .got{opacity:1;transform:scale(1)}
.counter{text-align:center;font-weight:800;font-size:22px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:20px;padding:10px 8px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.day .b{width:36px;height:36px;border-radius:50%;background:rgba(33,48,74,.08);display:grid;place-items:center;font-size:20px}
.day.today .b{outline:3px solid var(--ink)}
.day.won .b{background:var(--sun)}
.goal{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.goal .bar{height:18px;background:rgba(33,48,74,.1);border-radius:99px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--sun-deep));border-radius:99px;transition:width .4s}
.goal .lbl{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
/* timer */
.balloon-wrap{height:250px;display:grid;place-items:center;position:relative}
.balloon{width:110px;height:130px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#ff9fae,var(--berry));position:relative;transform:scale(.7);transition:transform 4s ease-in-out}
.balloon::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-7px;border:7px solid transparent;border-bottom-color:var(--berry)}
.balloon.big{transform:scale(1.45)}
.string{position:absolute;bottom:4px;left:50%;width:2px;height:70px;background:var(--muted);margin-left:-1px}
.breath{text-align:center;font-size:26px;font-weight:800;min-height:36px}
.clock{text-align:center;font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.mins{display:flex;gap:8px;justify-content:center}
.mins button{border:3px solid var(--card);background:var(--card);border-radius:16px;font:800 20px var(--font);padding:6px 16px;min-height:48px;cursor:pointer;color:var(--ink)}
.mins button[aria-pressed="true"]{border-color:var(--ink)}
.poops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.poop{border:3px solid transparent;background:var(--card);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 16px var(--font);color:var(--ink);cursor:pointer;min-height:100px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);text-align:center}
.poop:active{transform:translateY(3px);box-shadow:none}
.diary{width:100%;border-collapse:collapse;font-size:15px}
.diary th,.diary td{text-align:left;padding:6px 4px;border-bottom:1px solid #e3e9f2}
.diary td.n{font-weight:800;font-variant-numeric:tabular-nums}
/* parents */
.pcard{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;font-family:system-ui,sans-serif;font-size:16px;box-shadow:0 4px 0 rgba(33,48,74,.1)}
.pcard h3{margin:0;font:800 20px var(--font)}
.pcard label{font-weight:600}
.pcard input,.pcard select{font:500 17px system-ui,sans-serif;border:2px solid #cfd8e6;border-radius:12px;padding:10px 12px;min-height:48px;width:100%;box-sizing:border-box;color:var(--ink);background:#fff}
.pcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.save{border:0;border-radius:14px;min-height:50px;font:800 19px var(--font);background:var(--grass);color:#fff;cursor:pointer}
.danger{border:2px solid var(--berry);background:#fff;color:var(--berry);border-radius:14px;min-height:46px;font:700 16px var(--font);cursor:pointer}
.msg{font-weight:700;color:var(--grass-deep)}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.fly{position:fixed;font-size:34px;z-index:60;pointer-events:none;animation:fly .8s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.3}}
.t-plate{background:#ffd9a8} .t-screen{background:#b9e4ff} .t-brush{background:#d4f5f0} .t-safe{background:#e4d4ff} .t-behave{background:#fff0b3}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{border:0;border-radius:22px;min-height:88px;font:800 19px var(--font);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:6px}
.opt .ic{font-size:34px;line-height:1}
.opt.g{background:var(--grass)} .opt.y{background:var(--sun-deep);color:var(--ink)} .opt.r{background:var(--berry)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{border:3px solid transparent;background:var(--card);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font:700 15px var(--font);color:var(--ink);cursor:pointer;min-height:92px;justify-content:center;box-shadow:0 4px 0 rgba(33,48,74,.12);text-align:center}
.chip .pic{font-size:34px;line-height:1.1}
.chip[aria-pressed="true"]{border-color:var(--grass);background:#e6f8ea}
.plate{background:#fff3d6;border:4px dashed var(--sun-deep);border-radius:50%;width:210px;height:210px;margin:0 auto;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:28px;line-height:1.3;padding:24px;box-sizing:border-box}
.checklist{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.step{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;box-shadow:0 6px 0 rgba(33,48,74,.14)}
.step .n{font-size:17px;color:var(--muted);font-weight:800}
.step .ic{font-size:64px;line-height:1}
.step .big{font-size:23px;font-weight:800;line-height:1.25}
.step .ic.scrub{animation:scrub .5s ease-in-out infinite}
.step .ic.bob{animation:bob 1.1s ease-in-out infinite}
.step .ic.tilt{animation:tilt 1.4s ease-in-out infinite}
.step .ic.spin{animation:spin 2.4s linear infinite}
@keyframes scrub{0%,100%{transform:rotate(-16deg) translateX(-6px)}50%{transform:rotate(16deg) translateX(6px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes tilt{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-40deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.step .ic{animation:none!important}}
.pnote{font:600 15px system-ui,sans-serif;color:var(--muted);text-align:center}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion: reduce){.golu.bounce,.golu.shake,.confetti span,.fly{animation:none}.balloon{transition:none}}
</style>

<div class="app" id="app">
  <div class="top">
    <button type="button" class="back" id="backBtn" hidden>← <span data-t="home"></span></button>
    <div class="bank" id="bankBox" aria-label="Stars"><span class="st">⭐</span><span id="bank">0</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="hi" aria-pressed="false">हिं</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <!-- HOME -->
  <section class="screen" id="s-home">
    <div class="hero">
      <div class="bubble" id="homeSay"></div>
      <div id="goluHome"></div>
      <h1 data-t="title"></h1>
    </div>
    <div class="menu">
      <button type="button" class="tile t-food" data-go="food"><span class="ic">🍎</span><span><span data-t="foodGame"></span><small data-t="foodGameSub"></small></span></button>
      <button type="button" class="tile t-chart" data-go="chart"><span class="ic">🏆</span><span><span data-t="chart"></span><small data-t="chartSub"></small></span></button>
      <button type="button" class="tile t-timer" data-go="report"><span class="ic">🚽</span><span><span data-t="report"></span><small data-t="reportSub"></small></span></button>
      <button type="button" class="tile t-plate" data-go="plate"><span class="ic">🍽️</span><span><span data-t="plateGame"></span><small data-t="plateGameSub"></small></span></button>
      <button type="button" class="tile t-screen" data-go="screen"><span class="ic">🚦</span><span><span data-t="screenGame"></span><small data-t="screenGameSub"></small></span></button>
      <button type="button" class="tile t-brush" data-go="brush"><span class="ic">🪥</span><span><span data-t="brushGame"></span><small data-t="brushGameSub"></small></span></button>
      <button type="button" class="tile t-safe" data-go="safe"><span class="ic">🛡️</span><span><span data-t="safeGame"></span><small data-t="safeGameSub"></small></span></button>
      <button type="button" class="tile t-behave" data-go="behave"><span class="ic">😊</span><span><span data-t="behaveGame"></span><small data-t="behaveGameSub"></small></span></button>
    </div>
    <button type="button" class="parents-link" data-go="parents" data-t="forParents"></button>
  </section>

  <!-- FOOD GAME -->
  <section class="screen" id="s-food" hidden></section>

  <!-- CHART -->
  <section class="screen" id="s-chart" hidden></section>

  <!-- POOP REPORT -->
  <section class="screen" id="s-report" hidden></section>

  <!-- PARENTS -->
  <section class="screen" id="s-parents" hidden></section>

  <!-- HABIT GAMES -->
  <section class="screen" id="s-plate" hidden></section>
  <section class="screen" id="s-screen" hidden></section>
  <section class="screen" id="s-brush" hidden></section>
  <section class="screen" id="s-safe" hidden></section>
  <section class="screen" id="s-behave" hidden></section>
</div>

<script>

var T = {

  foodGameSub:{en:'Is it good for Golu? Yes or No!',hi:'गोलू के लिए अच्छा? हाँ या ना!'},
  chart:{en:'Potty Hero Chart',hi:'पॉटी हीरो चार्ट'},
  chartSub:{en:'Do your jobs, win stars every day',hi:'रोज़ काम करो, स्टार जीतो'},
  report:{en:'Poop Report',hi:'पॉटी रिपोर्ट'},

var G = null;
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function startGame(){
  var good = shuffle(FOODS.filter(function(f){return f.g;})).slice(0,5);
  var bad = shuffle(FOODS.filter(function(f){return !f.g;})).slice(0,5);
  G = {list: shuffle(good.concat(bad)), i:0, res:[], answered:false, won:0};
  renderFood();
}
function progHtml(){
  return '<div class="prog">'+G.list.map(function(f,k){ var c = k<G.res.length ? (G.res[k]?'ok':'no') : (k===G.i?'now':''); return '<i class="'+c+'"></i>'; }).join('')+'</div>';
}
function renderFood(){
  var el = document.getElementById('s-food');
  if(G.i >= G.list.length){
    var mood = G.won >= 8 ? 'wow' : G.won >= 5 ? 'happy' : 'sad';
    el.innerHTML = progHtml()+'<div class="result">'+goluSvg(mood,'bounce')+'<h2>'+L(T.done)+'</h2><div>'+L(T.youGot)+'</div><div class="score">⭐ '+G.won+' / '+G.list.length+'</div></div>'+
      '<button type="button" class="go" id="again">'+L(T.playAgain)+'</button>';
    if(G.won >= 7) confetti();
    return;
  }
  var f = G.list[G.i];
  var h = progHtml()+
    '<div style="display:flex;justify-content:center">'+goluSvg('happy','small')+'</div>'+
    '<div class="food" id="foodCard"><span class="pic" aria-hidden="true">'+f.p+'</span><span class="nm">'+esc(L(f))+'</span><span class="stamp" id="stamp"></span></div>';
  if(!G.answered){
    h += '<div class="ask">'+L(T.ask)+'</div><div class="yn"><button type="button" class="yes" data-ans="1"><span class="ic">👍</span>'+L(T.yes)+'</button><button type="button" class="no" data-ans="0"><span class="ic">👎</span>'+L(T.no)+'</button></div>';
  }
  el.innerHTML = h;
}
function answer(v, btn){
  if(G.answered) return;
  var f = G.list[G.i], ok = (v === !!f.g);
  G.answered = true; G.res.push(ok);
  var el = document.getElementById('s-food');
  el.querySelector('.ask').remove(); el.querySelector('.yn').remove();
  var card = document.getElementById('foodCard'), stamp = document.getElementById('stamp');
  var why = f.g ? (f.why || GOODWHY) : f.why;
  if(ok){
    G.won++; S.bonus++; save();
    stamp.className='stamp good show'; stamp.textContent='✓';
    react(el,'wow'); flyStar(card);
  } else {
    stamp.className='stamp bad show'; stamp.textContent='✗';
    card.classList.add('struck'); react(el,'sad');
  }
  // Junk food always gets struck out, so the lesson sticks even when the child answered right.
  if(!f.g) card.classList.add('struck');
  var w = document.createElement('div'); w.className = 'why '+(f.g?'good':'bad');
  w.innerHTML = '<div style="font-size:22px;font-weight:800">'+(ok?L(T.right):L(T.wrong))+'</div>'+esc(L(why));
  var nx = document.createElement('button'); nx.type='button'; nx.className='go'; nx.id='nextFood'; nx.textContent = L(T.next)+' →';
  el.appendChild(w); el.appendChild(nx);

  nx.focus();
}

    var mood = st.won >= st.list.length-1 ? 'wow' : st.won >= Math.ceil(st.list.length/2) ? 'happy' : 'sad';
    el.innerHTML = progHtml2(st)+'<div class="result">'+goluSvg(mood,'bounce')+'<h2>'+L(T.done)+'</h2><div class="score">⭐ '+st.won+' / '+st.list.length+'</div></div>'+
      '<button type="button" class="go" data-qstart="'+name+'">'+L(T.playAgain)+'</button>';
    if(st.won >= st.list.length-1) confetti();
    return;
  }
  var it = st.list[st.i];
  var h = progHtml2(st)+'<div style="display:flex;justify-content:center">'+goluSvg('happy','small')+'</div>'+
    '<div class="food" id="qCard"><span class="pic" aria-hidden="true">'+it.p+'</span><span class="nm">'+esc(L(it))+'</span><span class="stamp" id="qStamp"></span></div>';
  if(!st.answered){
    h += '<div class="ask">'+L(T[cfg.ask])+'</div><div class="opts">'+cfg.opts.map(function(o,k){
      return '<button type="button" class="opt '+o.cls+'" data-qname="'+name+'" data-qi="'+k+'"><span class="ic">'+o.ic+'</span>'+esc(L(o))+'</button>';
    }).join('')+'</div>';
  }
  el.innerHTML = h;
}
function qAnswer(name, k){
  var st = QS[name], cfg = QZ[name];
  if(!st || st.answered) return;
  var it = st.list[st.i], ok = (cfg.opts[k].v === it.a);
  st.answered = true; st.res.push(ok);
  var el = document.getElementById('s-'+name), card = document.getElementById('qCard'), stamp = document.getElementById('qStamp');
  el.querySelector('.ask').remove(); el.querySelector('.opts').remove();
  if(ok){ st.won++; S.bonus++; save(); stamp.className='stamp good show'; stamp.textContent='✓'; react(el,'wow'); flyStar(card); }
  else { stamp.className='stamp bad show'; stamp.textContent='✗'; react(el,'sad'); }
  var w = document.createElement('div'); w.className = 'why '+(ok?'good':'bad');
  w.innerHTML = '<div style="font-size:22px;font-weight:800">'+(ok?L(T.right):L(T.wrong))+'</div>'+esc(L(it.why));
  var nx = document.createElement('button'); nx.type='button'; nx.className='go'; nx.dataset.qnext = name; nx.textContent = L(T.next)+' →';
  el.appendChild(w); el.appendChild(nx); el.querySelector('.prog').outerHTML = progHtml2(st); nx.focus();
}
function qNext(name){ var st = QS[name]; st.i++; st.answered = false; qRender(name); }

/* ---------- balanced plate ---------- */
var PL = {sel:{}, scored:false};
function plateRender(){
  var el = document.getElementById('s-plate');
  var chips = PLATE_ITEMS.map(function(x,k){ return '<button type="button" class="chip" aria-pressed="'+(!!PL.sel[k])+'" data-pl="'+k+'"><span class="pic" aria-hidden="true">'+x.p+'</span>'+esc(L(x))+'</button>'; }).join('');
  var picked = PLATE_ITEMS.filter(function(x,k){ return PL.sel[k]; }).map(function(x){ return x.p; }).join(' ');
  el.innerHTML = '<div class="bubble" style="text-align:center">'+L(T.plateAsk)+'</div>'+
    '<div class="plate" aria-live="polite">'+(picked ? picked : esc(L(T.plateEmpty)))+'</div>'+
    '<div class="chips">'+chips+'</div>'+
    '<button type="button" class="go" data-pcheck="1">'+L(T.plateCheck)+'</button>'+
    '<div id="plateRes"></div>';
}
function plateCheck(){
  var have = {}, junk = 0;
  PLATE_ITEMS.forEach(function(x,k){ if(PL.sel[k]){ if(x.g==='junk') junk++; else have[x.g]=true; } });
  var rows = Object.keys(PLATE_GROUPS).map(function(g){ return '<div>'+(have[g]?'✅':'⬜')+' '+esc(L(PLATE_GROUPS[g]))+'</div>'; }).join('');
  var allOk = Object.keys(PLATE_GROUPS).every(function(g){ return have[g]; }) && junk === 0;
  var msg = allOk ? L(T.plateGood) : (junk ? L(T.plateJunk) : L(T.plateMissing));
  document.getElementById('plateRes').innerHTML = '<div class="checklist">'+rows+'</div><div class="why '+(allOk?'good':'bad')+'">'+msg+'</div>';
  if(allOk && !PL.scored){ PL.scored = true; S.bonus++; save(); updateBank(); confetti(); }
}

/* ---------- brushing ---------- */
var BR = {i:0, done:false};
function brushRender(){
  var el = document.getElementById('s-brush'), N = BRUSH_STEPS.length, s = BRUSH_STEPS[BR.i];
  var last = BR.i === N-1;
  el.innerHTML = '<div class="step"><div class="n">'+(BR.i+1)+' / '+N+'</div><div class="ic '+s.a+' " aria-hidden="true">'+s.ic+'</div><div class="big">'+esc(L(s))+'</div></div>'+
    (!last ? '<button type="button" class="go" data-bnext="1">'+L(T.next)+' →</button>'
           : '<div class="why good">'+L(T.brushDone)+'</div><button type="button" class="go" data-bagain="1">'+L(T.playAgain)+'</button>')+
    '<div class="pnote">'+L(T.brushParent)+'</div>';
}
function brushNext(){
  if(BR.i < BRUSH_STEPS.length-1){ BR.i++; if(BR.i === BRUSH_STEPS.length-1 && !BR.done){ BR.done = true; S.bonus++; save(); updateBank(); confetti(); } }
  brushRender();
}

/* ---------- events ---------- */
document.getElementById('app').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){ S.lang = b.dataset.lang; save(); applyLang(); show(current==='food'?'home':current); return; }
  if(b.id==='backBtn'){ show('home'); return; }
  if(b.dataset.go){ show(b.dataset.go); return; }
  if(b.dataset.ans !== undefined){ answer(b.dataset.ans==='1', b); return; }
  if(b.dataset.qname !== undefined){ qAnswer(b.dataset.qname, +b.dataset.qi); return; }
  if(b.dataset.qnext){ qNext(b.dataset.qnext); return; }
  if(b.dataset.qstart){ qStart(b.dataset.qstart); return; }
  if(b.dataset.pl !== undefined){ var pk = +b.dataset.pl; PL.sel[pk] = !PL.sel[pk]; plateRender(); return; }
  if(b.dataset.pcheck){ plateCheck(); return; }
  if(b.dataset.bnext){ brushNext(); return; }
  if(b.dataset.bagain){ BR.i = 0; brushRender(); return; }
  if(b.id==='nextFood'){ G.i++; G.answered=false; renderFood(); return; }
  if(b.id==='again'){ startGame(); return; }
  if(b.dataset.task !== undefined){ toggleTask(+b.dataset.task, b); return; }
  if(b.dataset.poop !== undefined){ logPoop(+b.dataset.poop, b); return; }
  if(b.id==='repDone'){ show('home'); return; }
  if(b.id==='saveRw'){ S.reward = {text: document.getElementById('rw').value.trim(), goal: +document.getElementById('gl').value}; save(); renderParents(S.lang==='hi'?'सेव हो गया ✓':'Saved ✓'); return; }
  if(b.id==='resetAsk'){ var hi=S.lang==='hi'; document.getElementById('resetZone').innerHTML = '<p style="margin:0 0 8px">'+(hi?'पक्का? सारे स्टार मिट जाएँगे।':'Sure? All stars will be cleared.')+'</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button type="button" class="danger" id="resetYes">'+(hi?'हाँ, मिटाएँ':'Yes, clear')+'</button><button type="button" class="save" id="resetNo">'+(hi?'नहीं':'No')+'</button></div>'; return; }
  if(b.id==='resetYes'){ S.bonus=0; S.days={}; S.log=[]; save(); updateBank(); renderParents(S.lang==='hi'?'साफ़ हो गया':'Cleared'); return; }
  if(b.id==='resetNo'){ renderParents(); return; }
});

applyLang(); updateBank(); show('home');
})();
</script>
