  {k:'mum',p:'👩',en:'Mummy',hi:'मम्मी'},{k:'dad',p:'👨',en:'Papa',hi:'पापा'},{k:'gma',p:'👵',en:'Dadi or Nani',hi:'दादी या नानी'},
  {k:'gpa',p:'👴',en:'Dada or Nana',hi:'दादा या नाना'},{k:'tch',p:'🏫',en:'Teacher',hi:'टीचर'},{k:'sib',p:'🧑',en:'Grown-up Didi or Bhaiya',hi:'बड़ी दीदी या भैया'},
  {k:'aunt',p:'🙋',en:'Aunt',hi:'बुआ, मौसी या चाची'},{k:'unc',p:'🧔',en:'Uncle',hi:'चाचा या मामा'},{k:'doc',p:'🩺',en:'Doctor',hi:'डॉक्टर'}
];
var BD = {phase:'intro'};
function bodyEnd(){ return '<button type="button" class="go" data-bd="hand" style="background:var(--grass);box-shadow:0 5px 0 var(--grass-deep)">'+L(BT.handGo)+'</button>'; }
function bodyRender(){
  var el = document.getElementById('s-body'), kid = KID(), note = '<div class="pnote">'+L(BT.parent)+'</div>';
  if(BD.phase === 'quiz'){ qRender('body'); return; }
  if(BD.phase === 'hand'){
    var sel = kid.hand || [], n = sel.length;
    el.innerHTML = '<h2>'+L(BT.handGo)+'</h2><div class="bubble" style="text-align:center;align-self:center">'+L(BT.handAsk)+'</div>'+
      '<div class="chips">'+HAND.map(function(x){ return '<button type="button" class="chip" aria-pressed="'+(sel.indexOf(x.k)>=0)+'" data-hand="'+x.k+'"><span class="pic" aria-hidden="true">'+x.p+'</span>'+esc(L(x))+'</button>'; }).join('')+'</div>'+
      (n >= 5 ? '<div class="why good" id="handRes">'+L(BT.handDone)+'</div>' : '<div class="counter" id="handRes">✋ '+n+' / 5 · '+L(BT.handMore).replace('{n}', 5-n)+'</div>')+
      '<button type="button" class="go" data-bd="again">'+L(T.playAgain)+'</button>'+note;
    return;
  }
  var rule = function(ic, a, b){ return '<div class="rule"><span class="ic" aria-hidden="true">'+ic+'</span><span>'+L(a)+'<small>'+L(b)+'</small></span></div>'; };
  el.innerHTML = '<h2>'+L(T.bodyGame)+'</h2><div style="display:flex;justify-content:center">'+goluSvg('happy','small')+'</div>'+
    '<div class="bubble" style="align-self:center">'+L(AGE()==='c' ? BT.ruleC : BT.ruleA)+'</div>'+
    '<div class="ask">'+L(BT.feel)+'</div>'+
    '<div class="rules">'+rule('✋',BT.no,BT.noSub)+rule('🏃',BT.go,BT.goSub)+rule('🗣️',BT.tell,BT.tellSub)+'</div>'+
    '<button type="button" class="go" data-bd="start">'+L(BT.start)+' →</button>'+note;
}
function bodyAct(a){
  if(a === 'start'){ BD.phase = 'quiz'; qStart('body'); return; }
  if(a === 'hand'){ BD.phase = 'hand'; bodyRender(); window.scrollTo(0,0); return; }
  if(a === 'again'){ BD.phase = 'intro'; delete QS.body; bodyRender(); window.scrollTo(0,0); return; }
}
function handTap(k){
  var kid = KID(); kid.hand = kid.hand || [];
  var at = kid.hand.indexOf(k);
  if(at >= 0) kid.hand.splice(at,1); else if(kid.hand.length < 5) kid.hand.push(k); else return;
  var first = kid.hand.length === 5 && !kid.handStar;
  if(first){ kid.handStar = true; kid.bonus++; }
  save(); bodyRender();
  if(first){ confetti(); updateBank(); }
}


/* ---------- parent notes for the quiz games ---------- */
var WT = {
  done:{en:'Clean hands! {N} is a Handwash Hero. +1 star',hi:'साफ़ हाथ! {N} हाथ धोने का हीरो है। +1 स्टार'},
  quizGo:{en:'Next: handwash quiz',hi:'आगे: हाथ धोने की क्विज़'},
  parent:{en:'Parents: children wash hands with soap before eating, after the toilet, and after coming home. Help children under 5 years.',hi:'माता-पिता: बच्चे खाने से पहले, टॉयलेट के बाद और बाहर से घर आकर साबुन से हाथ धोएँ। 5 साल से छोटे बच्चों की मदद करें।'}
};
var DT = {parent:{en:'Parents: water and plain milk are the everyday drinks. Keep sugary drinks out of the daily routine.',hi:'माता-पिता: पानी और सादा दूध रोज़ के पेय हैं। मीठे पेय रोज़ की आदत में न रखें।'}};
var RT = {parent:{en:'Parents: children copy what you do. Wear your own helmet and seat belt on every trip.',hi:'माता-पिता: बच्चे वही करते हैं जो आप करते हैं। हर बार खुद हेलमेट और सीट बेल्ट लगाएँ।'}};
var FT = {parent:{en:'Parents: name the feeling for your child (“You look sad”). All feelings are allowed. Hurting others is not.',hi:'माता-पिता: बच्चे की भावना को नाम दें (“तुम उदास लग रहे हो”)। हर भावना ठीक है। किसी को चोट पहुँचाना ठीक नहीं।'}};
var AT = {parent:{en:'For children of 9–12 years. The first step is always to tell a grown-up. Emergency number: 112.',hi:'9–12 साल के बच्चों के लिए। पहला कदम हमेशा बड़ों को बताना है। आपात नंबर: 112।'}};

/* ---------- Handwash Hero: steps for every age, then a quiz for 5–12 years ---------- */
var WASH_STEPS = [
  {ic:'🚰',a:'bob',en:'Wet your hands with clean water',hi:'साफ़ पानी से हाथ गीले करो'},
  {ic:'🧼',a:'bob',en:'Take soap',hi:'साबुन लगाओ'},
  {ic:'🙌',a:'scrub',en:'Rub your palms together',hi:'हथेलियाँ आपस में रगड़ो'},
  {ic:'🤚',a:'scrub',en:'Rub the back of each hand',hi:'दोनों हाथों का पिछला हिस्सा रगड़ो'},
  {ic:'🖐️',a:'scrub',en:'Rub between your fingers',hi:'उँगलियों के बीच रगड़ो'},
  {ic:'👍',a:'scrub',en:'Rub your thumbs and under your nails',hi:'अँगूठे और नाखूनों के नीचे रगड़ो'},
  {ic:'⏱️',a:'bob',count:true,en:'Keep rubbing for 20 seconds. Count with me!',hi:'20 सेकंड तक रगड़ते रहो। मेरे साथ गिनो!'},
  {ic:'💦',a:'bob',en:'Rinse with clean water',hi:'साफ़ पानी से धो लो'},
  {ic:'🧻',a:'bob',en:'Dry with a clean towel',hi:'साफ़ तौलिए से पोंछो'}
];
var WH = {phase:'steps', i:0, done:false, t:null, n:0};
function washRender(){
  if(WH.t){ clearInterval(WH.t); WH.t = null; }
  if(WH.phase === 'quiz' && AGE() !== 'a'){ qRender('wash'); return; }
  WH.phase = 'steps';
  var el = document.getElementById('s-wash'), N = WASH_STEPS.length, s = WASH_STEPS[WH.i], last = WH.i === N-1;
  el.innerHTML = '<h2>'+L(T.washGame)+'</h2><div class="step"><div class="n">'+(WH.i+1)+' / '+N+'</div>'+
    (s.count ? '<div class="count20" id="count20" aria-live="off">1</div>' : '<div class="ic '+s.a+'" aria-hidden="true">'+s.ic+'</div>')+
    '<div class="big">'+esc(L(s))+'</div></div>'+
    (!last ? '<button type="button" class="go" data-wh="next">'+L(T.next)+' →</button>'
           : '<div class="why good">'+L(WT.done)+'</div>'+(AGE() === 'a' ? '' : '<button type="button" class="go" data-wh="quiz">'+L(WT.quizGo)+' →</button>')+
             '<button type="button" class="go" data-wh="again"'+(AGE() === 'a' ? '' : ' style="background:var(--card);color:var(--ink)"')+'>'+L(T.playAgain)+'</button>')+
    '<div class="pnote">'+L(WT.parent)+'</div>';
  if(s.count){
    WH.n = 1;
    WH.t = setInterval(function(){
      var c = document.getElementById('count20');
      if(!c || WH.n >= 20){ clearInterval(WH.t); WH.t = null; return; }
      WH.n++; c.textContent = WH.n;
    }, 1000);
  }
}
function washAct(a){
  if(a === 'next'){ if(WH.i < WASH_STEPS.length-1){ WH.i++; if(WH.i === WASH_STEPS.length-1 && !WH.done){ WH.done = true; KID().bonus++; save(); updateBank(); confetti(); } } washRender(); return; }
  if(a === 'again'){ WH.i = 0; WH.phase = 'steps'; washRender(); return; }
  if(a === 'quiz'){ WH.phase = 'quiz'; qStart('wash'); return; }
}

/* ---------- Sleep Time: put the bedtime routine in order ----------
   Order is by stage, so brush / toilet / night clothes can come in any order:
   0 screens off, 1 get ready, 2 story, 3 sleep. */
var SLEEP_STEPS = [
  {k:'off',r:0,ag:'bc',p:'📵',en:'Screens off',hi:'स्क्रीन बंद'},
  {k:'brush',r:1,p:'🪥',en:'Brush teeth',hi:'ब्रश करो'},
  {k:'toilet',r:1,ag:'bc',p:'🚽',en:'Toilet',hi:'टॉयलेट जाओ'},
  {k:'pj',r:1,p:'👕',en:'Night clothes',hi:'रात के कपड़े'},
  {k:'story',r:2,p:'📖',en:'Story or book',hi:'कहानी या किताब'},
  {k:'sleep',r:3,p:'🌙',en:'Lights off, sleep',hi:'लाइट बंद, सो जाओ'}
];
var ST = {
  ask:{en:'It is bedtime for {N}. Tap what comes first!',hi:'{N} के सोने का समय है। जो पहले आता है, उसे टैप करो!'},
  hint:[
    {en:'First, switch off all screens.',hi:'सबसे पहले सारी स्क्रीन बंद करो।'},
    {en:'Get ready for bed first.',hi:'पहले सोने की तैयारी करो।'},
    {en:'Now a quiet story, then sleep.',hi:'अब एक शांत कहानी, फिर नींद।'},
    {en:'Sleep comes last.',hi:'नींद सबसे आख़िर में आती है।'}
  ],
  done:{en:'Good night, {N}! The same bedtime every day keeps you fresh. +1 star',hi:'शुभ रात्रि, {N}! रोज़ एक ही समय पर सोने से ताज़गी रहती है। +1 स्टार'},
  hrs:{
    a:{en:'Sleep needed in 24 hours, naps included: 11–14 hours at 1–2 years, and 10–13 hours at 3–5 years.',hi:'24 घंटे में ज़रूरी नींद, दिन की झपकी मिलाकर: 1–2 साल में 11–14 घंटे, और 3–5 साल में 10–13 घंटे।'},
    b:{en:'Sleep needed every night: 9–12 hours at 6–12 years (10–13 hours at 5 years).',hi:'हर रात ज़रूरी नींद: 6–12 साल में 9–12 घंटे (5 साल में 10–13 घंटे)।'},
    c:{en:'Sleep needed every night at 6–12 years: 9–12 hours.',hi:'6–12 साल में हर रात ज़रूरी नींद: 9–12 घंटे।'}
  },
  parent:{en:'Parents: keep the same bedtime and wake-up time every day, and no screens before bedtime.',hi:'माता-पिता: रोज़ सोने और उठने का समय एक ही रखें, और सोने से पहले स्क्रीन नहीं।'}
};
var SL = null;
function sleepStart(){ SL = {left: shuffle(forAge(SLEEP_STEPS)), done: [], hint: -1, scored: false}; }
function sleepRender(){
  if(!SL) sleepStart();
  var el = document.getElementById('s-sleep'), fin = !SL.left.length;
  var row = SL.done.map(function(x, n){ return '<span class="seq"><b>'+(n+1)+'</b>'+x.p+'</span>'; }).join('');
  el.innerHTML = '<h2>'+L(T.sleepGame)+'</h2><div class="bubble" style="text-align:center;align-self:center">'+L(ST.ask)+'</div>'+
    '<div class="seqrow" aria-live="polite">'+(row || '<span class="seq empty">1</span>')+'</div>'+
    '<div class="chips">'+SL.left.map(function(x){ return '<button type="button" class="chip" data-sl="'+x.k+'"><span class="pic" aria-hidden="true">'+x.p+'</span>'+esc(L(x))+'</button>'; }).join('')+'</div>'+
    (fin ? '<div class="why good">'+L(ST.done)+'</div><div class="checklist">'+L(ST.hrs[AGE()])+'</div><button type="button" class="go" data-sl="again">'+L(T.playAgain)+'</button>'
         : (SL.hint >= 0 ? '<div class="why bad">'+L(ST.hint[SL.hint])+'</div>' : ''))+
    '<div class="pnote">'+L(ST.parent)+'</div>';
}
function sleepTap(k){
  if(k === 'again'){ sleepStart(); sleepRender(); return; }
  var it = SL.left.filter(function(x){ return x.k === k; })[0]; if(!it) return;
  var min = Math.min.apply(null, SL.left.map(function(x){ return x.r; }));
  if(it.r === min){
    SL.left = SL.left.filter(function(x){ return x.k !== k; }); SL.done.push(it); SL.hint = -1;
    if(!SL.left.length && !SL.scored){ SL.scored = true; KID().bonus++; save(); updateBank(); confetti(); }
  } else { SL.hint = min; }
  sleepRender();
}

/* ---------- parents: reset stars ----------
   Hold the star counter for 3 seconds, or tap it 5 times quickly. Both ask for confirmation. */
var holdT = null, tapN = 0, tapT = null, bankEl = document.getElementById('bankBox');
bankEl.title = 'Parents: hold for 3 seconds, or tap 5 times, to reset stars';
function askReset(){
  var hi = S.lang === 'hi';
  if(window.confirm(hi ? 'इनके स्टार मिटाएँ: '+charName()+'? (केवल माता-पिता के लिए)' : 'Reset stars for '+charName()+'? (for parents only)')){
    KID().bonus = 0; save(); updateBank(); if(current === 'home') renderHome();
  }
}
function startHold(){ clearTimeout(holdT); holdT = setTimeout(function(){ holdT = null; tapN = 0; askReset(); }, 3000); }
function endHold(){ clearTimeout(holdT); holdT = null; }
bankEl.addEventListener('touchstart', startHold, {passive:true});
bankEl.addEventListener('touchend', endHold);
bankEl.addEventListener('touchcancel', endHold);
bankEl.addEventListener('touchmove', endHold, {passive:true});
bankEl.addEventListener('mousedown', startHold);
bankEl.addEventListener('mouseup', endHold);
bankEl.addEventListener('mouseleave', endHold);
bankEl.addEventListener('click', function(){
  tapN++; clearTimeout(tapT); tapT = setTimeout(function(){ tapN = 0; }, 3000);
  if(tapN >= 5){ tapN = 0; clearTimeout(tapT); endHold(); askReset(); }
});
bankEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- events ---------- */
document.getElementById('app').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.music !== undefined){ musicToggle(); return; }
  if(b.dataset.charopen !== undefined){ show('char'); return; }
  if(b.dataset.kid){ stashName(); S.active = b.dataset.kid; resetRounds(); save(); updateBank(); renderCharPick(); return; }
  if(b.dataset.kidnew!==undefined){ stashName(); var nk = {id:'k'+Date.now().toString(36), name:'', gender:'', bonus:0}; S.kids.push(nk); S.active = nk.id; save(); updateBank(); renderCharPick(); var ni = document.getElementById('kidName'); if(ni) ni.focus(); return; }
  if(b.dataset.gender){ stashName(); KID().gender = b.dataset.gender; save(); renderCharPick(); return; }
  if(b.dataset.age){ stashName(); KID().age = b.dataset.age; save(); resetRounds(); renderCharPick(); return; }
  if(b.dataset.vx){ vaxAct(b.dataset.vx); return; }
  if(b.dataset.wh){ washAct(b.dataset.wh); return; }
  if(b.dataset.sl){ sleepTap(b.dataset.sl); return; }
  if(b.dataset.germ !== undefined){ germTap(+b.dataset.germ); return; }
  if(b.dataset.bd){ bodyAct(b.dataset.bd); return; }
  if(b.dataset.hand){ handTap(b.dataset.hand); return; }
  if(b.dataset.kidsave!==undefined){ if(!stashName()){ var ip = document.getElementById('kidName'); if(ip) ip.focus(); return; } if(!KID().gender){ var gh = document.getElementById('genderHint'); if(gh) gh.hidden = false; return; } if(!KID().age){ var ah = document.getElementById('ageHint'); if(ah) ah.hidden = false; return; } resetRounds(); save(); syncCharBtn(); confetti(); show('home'); return; }
  if(b.dataset.kidremove!==undefined){ var gone = KID(); if(window.confirm(S.lang==='hi' ? (gone.name||'यह बच्चा')+' की प्रोफ़ाइल और स्टार हटाएँ?' : 'Remove '+(gone.name||'this child')+' and their stars?')){ S.kids = S.kids.filter(function(k){ return k.id!==gone.id; }); S.active = S.kids[0].id; save(); renderCharPick(); } return; }
  if(b.dataset.lang){ S.lang = b.dataset.lang; save(); applyLang(); show(current==='food'?'home':current); return; }
  if(b.id==='backBtn'){ show('home'); return; }
  if(b.dataset.go){ show(b.dataset.go); return; }
  if(b.dataset.ans !== undefined){ answer(b.dataset.ans==='1', b); return; }
  if(b.dataset.qname !== undefined){ qAnswer(b.dataset.qname, +b.dataset.qi); return; }
  if(b.dataset.qnext){ qNext(b.dataset.qnext); return; }
  if(b.dataset.qstart){ qStart(b.dataset.qstart); return; }
  if(b.dataset.pg || b.dataset.pj || b.dataset.diet){ plateTap(b); return; }
  if(b.dataset.pcheck){ plateCheck(); return; }
  if(b.dataset.bnext){ brushNext(); return; }
  if(b.dataset.bagain){ BR.i = 0; brushRender(); return; }
  if(b.id==='nextFood'){ G.i++; G.answered=false; renderFood(); return; }
  if(b.id==='again'){ startGame(); return; }
});

applyLang(); updateBank();
var ready = KID().name && KID().gender && KID().age, want = (location.hash || '').slice(1);
show(!ready ? 'char' : (['vax','body','wash','sleep','feel','drink','road','aid'].indexOf(want) >= 0) ? want : 'home');
})();
</script>
