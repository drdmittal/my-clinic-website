function baby(k){
  var id = 'a'+k, hi = 'var(--pink)', sk = 'var(--skin)', ln = 'var(--skin-line)';
  function part(name){ return k===name ? hi : sk; }
  var back = (k==='back');
  var s = '<svg viewBox="0 0 160 200" role="img" aria-label="'+k+'"><defs><marker id="'+id+'" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--indigo-2)"/></marker></defs>';
  s += '<rect x="2" y="2" width="156" height="196" rx="18" fill="var(--surface)"/>';
  var limb = function(x1,y1,x2,y2,w,c){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+ln+'" stroke-width="'+(w+3)+'" stroke-linecap="round"/><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>'; };
  s += limb(60,76,30,116,15,part('arms')) + limb(100,76,130,116,15,part('arms'));
  s += limb(70,126,58,180,17,part('legs')) + limb(90,126,102,180,17,part('legs'));
  var bodyFill = (k==='chest'||k==='tummy'||k==='back') ? sk : sk;
  s += '<rect x="56" y="62" width="48" height="72" rx="22" fill="'+bodyFill+'" stroke="'+ln+'" stroke-width="1.5"/>';
  if(k==='chest') s += '<rect x="58" y="66" width="44" height="28" rx="14" fill="'+hi+'" opacity=".85"/>';
  if(k==='tummy') s += '<ellipse cx="80" cy="108" rx="20" ry="18" fill="'+hi+'" opacity=".85"/>';
  if(k==='back') s += '<rect x="58" y="66" width="44" height="64" rx="20" fill="'+hi+'" opacity=".85"/><line x1="80" y1="68" x2="80" y2="128" stroke="'+ln+'" stroke-width="1.5" stroke-dasharray="3 3"/>';
  s += '<circle cx="80" cy="38" r="24" fill="'+(k==='face'?hi:sk)+'" stroke="'+ln+'" stroke-width="1.5"/>';
  if(back){ s += '<path d="M60 30q20-18 40 0" fill="none" stroke="'+ln+'" stroke-width="2"/><path d="M64 24q16-10 32 0" fill="none" stroke="'+ln+'" stroke-width="2"/>'; }
  else { s += '<path d="M70 37q3-3 6 0M84 37q3-3 6 0" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M74 48q6 4 12 0" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/>';
    if(k!=='chest') s += '<circle cx="80" cy="108" r="2.2" fill="'+ln+'"/>'; }
  var A = function(d){ return '<path d="'+d+'" fill="none" stroke="var(--indigo-2)" stroke-width="3" stroke-linecap="round" marker-end="url(#'+id+')"/>'; };
  if(k==='legs') s += A('M50 132L38 170') + A('M110 132L122 170') + '<circle cx="58" cy="186" r="5" fill="none" stroke="var(--indigo-2)" stroke-width="2"/><circle cx="102" cy="186" r="5" fill="none" stroke="var(--indigo-2)" stroke-width="2"/>';
  if(k==='arms') s += A('M50 66L22 102') + A('M110 66L138 102');
  if(k==='chest') s += A('M76 80Q66 76 50 82') + A('M84 80Q94 76 110 82');
  if(k==='tummy') s += A('M66 118 A16 15 0 1 1 94 118');
  if(k==='back') s += A('M70 72L70 124') + A('M90 72L90 124');
  if(k==='face') s += A('M76 26Q70 22 62 26') + A('M84 26Q90 22 98 26');
  return s + '</svg>';
}

function ul(list, cls){ return '<ul class="pts '+cls+'">'+list.map(function(x){ return '<li><span>'+t(x)+'</span></li>'; }).join('')+'</ul>'; }
function ol(list, c){ return '<ol class="steps" style="--c:var(--'+(c||'sky')+')">'+list.map(function(x){ return '<li><span>'+t(x)+'</span></li>'; }).join('')+'</ol>'; }
function sec(icon, title, inner, c){ return '<section class="sec" style="--c:var(--'+(c||'indigo')+')"><h2><span class="n"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[icon]+'</svg></span>'+t(title)+'</h2>'+inner+'</section>'; }
function glance(g){ return '<div class="glance">'+g.map(function(x){ return '<div class="gl" style="--c:var(--'+x[3]+');--soft:var(--'+x[3]+'-soft)"><b>'+(L==='hi'?({'Coconut oil':'नारियल तेल','Day 7':'7वाँ दिन'}[x[0]]||x[0]):x[0])+'</b><span>'+(L==='hi'?x[2]:x[1])+'</span></div>'; }).join('')+'</div>'; }

function panelNormal(){
  var cards = '<div class="cards">'+NORMAL.map(function(n){
    return '<div class="nc"><b>'+t(n.h)+'</b><p>'+t(n.p)+'</p>'+(n.s?'<p class="strong">'+t(n.s)+'</p>':'')+(n.w?'<p class="worry"><strong>'+t(UI.worryIf)+'</strong>'+t(n.w)+'</p>':'')+'</div>';
  }).join('')+'</div>';
  return sec('alert',['When to worry','चिंता कब करें'],
      '<p class="lead">'+t(['A newborn can become sick quickly. Do not wait and watch if you see any of these.','नवजात बहुत जल्दी बीमार हो सकता है। इनमें से कुछ भी दिखे तो इंतज़ार न करें।'])+'</p>'+
      '<div class="box er"><h3>'+t(['Go to the hospital at once','तुरंत अस्पताल ले जाएँ'])+'</h3>'+ul(ER,'warn')+'</div>'+
      '<div class="box doc"><h3>'+t(['See the doctor the same day','उसी दिन डॉक्टर को दिखाएँ'])+'</h3>'+ul(DOC,'dot')+'</div>'+
      '<p class="note">'+t(['You know your baby best. If you feel something is not right, call the clinic.','अपने बच्चे को आप सबसे अच्छी तरह जानते हैं। कुछ ठीक न लगे तो क्लिनिक को कॉल करें।'])+'</p>','red')+
    sec('check',['Usually normal: no need to worry','आमतौर पर सामान्य: चिंता की बात नहीं'],
      '<p class="lead">'+t(['These are common in healthy newborns. Each card also says when it is not normal.','ये बातें स्वस्थ नवजात में आम हैं। हर कार्ड में यह भी लिखा है कि कब यह सामान्य नहीं है।'])+'</p>'+cards,'leaf');
}
function panelBath(){
  return sec('clock',['When to bathe','कब नहलाएँ'], glance(BATH.glance)+'<div style="margin-top:14px">'+ul(BATH.when,'dot')+'</div>','sky')+
    sec('list',['Keep ready','पहले से तैयार रखें'], ul(BATH.ready,'ok'),'teal')+
    sec('drop',['Sponge bath: until the cord falls off','स्पंज स्नान: नाल गिरने तक'], ol(BATH.sponge,'sky'),'sky')+
    sec('bath',['Full bath with a mug: after the cord falls off','मग से पूरा स्नान: नाल गिरने के बाद'], ol(BATH.mug,'teal')+'<div class="box er"><h3>'+t(['Safety','सुरक्षा'])+'</h3><p>'+t(BATH.safety)+'</p></div>','teal')+
    sec('check',['After the bath','स्नान के बाद'], ul(BATH.after,'dot'),'grape');
}
function panelMassage(){
  var steps = MASSAGE.steps.map(function(s,i){ return '<div class="mstep">'+baby(s.k)+'<div><h3><i>'+(i+1)+'</i>'+t(s.h)+'</h3><p>'+t(s.p)+'</p></div></div>'; }).join('');
  return sec('users',['Who should massage','मालिश कौन करे'], '<p style="font-size:18px">'+t(MASSAGE.who)+'</p>','pink')+
    sec('clock',['Oil, time and when','तेल, समय और कब'], glance(MASSAGE.glance)+'<h3>'+t(['When','कब'])+'</h3>'+ul(MASSAGE.when,'dot')+'<h3>'+t(['Which oil','कौन-सा तेल'])+'</h3>'+ul(MASSAGE.oil,'dot'),'teal')+
    sec('list',['Before you start','शुरू करने से पहले'], ul(MASSAGE.ready,'ok'),'sky')+
    sec('massage',['Step by step','एक-एक करके'], '<p class="lead">'+t(['Pink shows where to massage; arrows show the direction. Repeat each stroke 4–6 times.','गुलाबी रंग बताता है कहाँ मालिश करें; तीर दिशा बताते हैं। हर बार 4–6 बार दोहराएँ।'])+'</p>'+steps,'pink')+
    sec('avoid',['Do not','ये न करें'], ul(MASSAGE.dont,'no'),'red');
}
function panelAvoid(){
  return sec('avoid',['Please avoid these','कृपया ये न करें'], '<p class="lead">'+t(['Some old practices are still common but can harm a newborn.','कुछ पुरानी प्रथाएँ आज भी आम हैं, पर नवजात को नुकसान पहुँचा सकती हैं।'])+'</p><div class="av">'+AVOID.map(function(a){ return '<div><span><b>'+t(a[0])+'</b><p>'+t(a[1])+'</p></span></div>'; }).join('')+'</div>','red');
}
var SRC = {
  normal:['IMNCI danger signs for young infants: Ministry of Health and Family Welfare, Government of India.','WHO recommendations on maternal and newborn care for a positive postnatal experience (2022).'],
  bath:['Indian Academy of Pediatrics (IAP) Guidelines for Pediatric Skin Care. Indian Pediatrics 2021;58:153–161.'],
  massage:['Indian Academy of Pediatrics (IAP) Guidelines for Pediatric Skin Care. Indian Pediatrics 2021;58:153–161.'],
  avoid:['Indian Academy of Pediatrics (IAP) Guidelines for Pediatric Skin Care. Indian Pediatrics 2021;58:153–161.','IAP Infant and Young Child Feeding Guidelines.','WHO recommendations on maternal and newborn care for a positive postnatal experience (2022).']
};
var DISC = ['<b>For health education only.</b> This is general information for parents. It does not replace a consultation or examination by your doctor, and it is not advice for any particular baby. If you are worried about your baby, see a doctor without delay.','<b>सिर्फ़ स्वास्थ्य शिक्षा के लिए।</b> यह माता-पिता के लिए सामान्य जानकारी है। यह डॉक्टर से परामर्श या जाँच का विकल्प नहीं है, और किसी ख़ास बच्चे के लिए सलाह नहीं है। बच्चे को लेकर चिंता हो तो बिना देर किए डॉक्टर को दिखाएँ।'];
function srcBlock(k){ return '<div class="src"><b>'+t(['Sources','स्रोत'])+'</b><ul>'+SRC[k].map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul><p>'+t(DISC)+'</p></div>'; }
var PANELS = [['normal',panelNormal,'teal'],['bath',panelBath,'sky'],['massage',panelMassage,'pink'],['avoid',panelAvoid,'red']];

function render(){
  document.documentElement.lang = L; document.documentElement.setAttribute('data-lang', L);
  ['sub','eyebrow','title','intro'].forEach(function(k){ document.getElementById(k).textContent = t(UI[k]); });
  document.getElementById('pfText').textContent = t(UI.pfoot);
  document.querySelectorAll('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===L)); });
  document.getElementById('tabs').innerHTML = PANELS.map(function(p){
    return '<button type="button" class="tab" role="tab" id="tab-'+p[0]+'" aria-controls="p-'+p[0]+'" data-tab="'+p[0]+'" aria-selected="'+(p[0]===TAB)+'" style="--c:var(--'+p[2]+');--c-soft:var(--'+p[2]+'-soft)"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[p[0]]+'</svg><b>'+t(UI.tabs[p[0]])+'</b></button>';
  }).join('');
  var o = PANELS.map(function(p){
    return '<div class="panel" role="tabpanel" id="p-'+p[0]+'" aria-labelledby="tab-'+p[0]+'"'+(p[0]===TAB?'':' hidden')+'><h2 class="ptitle">'+t(UI.tabs[p[0]])+'</h2>'+p[1]()+srcBlock(p[0])+'</div>';
  }).join('');
  o += '<div class="actions"><a class="btn btn-line" href="/newborn.html">'+t(['← Newborn corner','← नवजात कॉर्नर'])+'</a><a class="btn btn-green" href="/book.html">'+t(UI.book)+'</a><a class="btn btn-indigo" href="tel:+918130521456">'+t(UI.call)+'</a><button type="button" class="btn btn-line" id="print">'+t(UI.print)+'</button></div>';
  o += '<p class="foot">'+t(UI.basis)+'</p>';
  document.getElementById('out').innerHTML = o;
  document.getElementById('clinic').innerHTML = '<b>Dr. Dinesh Mittal Child Clinic</b>Dr. Dinesh Mittal, MBBS, DCH · DMC/R/00668<br>H-34/69, Sector 3, Rohini, Delhi 110085<br>'+(L==='hi'?'फ़ोन':'Phone')+': <a href="tel:+918130521456">+91 81305 21456</a><br>Mon–Sat 10:00 AM–1:00 PM &amp; 6:00–8:30 PM · Sun 11:00 AM–12:00 PM<br><a href="https://www.drdineshmittal.com">www.drdineshmittal.com</a>';
}
function setTab(k, scroll){
  if(!PANELS.some(function(p){return p[0]===k;})) return;
  TAB = k;
  PANELS.forEach(function(p){ document.getElementById('p-'+p[0]).hidden = p[0]!==k; var b=document.getElementById('tab-'+p[0]); b.setAttribute('aria-selected', String(p[0]===k)); });
  try{ history.replaceState(null,'','#'+k); }catch(e){}
  if(scroll){ var y = document.querySelector('.tabsbar').getBoundingClientRect().top + window.scrollY - 60; if(window.scrollY > y) window.scrollTo({top:y}); }
  if(typeof gtag==='function') gtag('event','newborn_tab',{tab:k});
}
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){ L = b.dataset.lang; try{ localStorage.setItem('preferredClinicLang', L); }catch(err){} render(); return; }
  if(b.dataset.tab){ setTab(b.dataset.tab, true); return; }
  if(b.id==='print'){ window.print(); }
});
var h = (location.hash||'').slice(1); if(['normal','bath','massage','avoid'].indexOf(h)>=0) TAB = h;
render();
})();
</script>
</body>
</html>
