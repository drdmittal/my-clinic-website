<script>
(function(){
/* clinical rules (doctor protocol) */
var FEVER = 100.4, HIGH = 103, VERY_HIGH = 104;
var PCM_GAP = 5*60, PCM_MAX = 5;
var RECHECK = 60;
var MEF_GAP = 8*60, MEF_MAX = 3;
var SPONGE_MIN = 15;
var MIN = 60000;

var DEF_CHILD = {name:'', age:'6m+', pcmMl:'', pcmStr:'250 mg/5 ml', mefMl:'', mefOk:false, phone:'+91 81305 21456'};
var S = {lang:'hi', unit:'F', tab:'now', child:Object.assign({}, DEF_CHILD), log:[], checks:{}, todo:{}};
try{ var sv = JSON.parse(localStorage.getItem('fever-care')||'null'); if(sv){ Object.assign(S, sv); S.child = Object.assign({}, DEF_CHILD, sv.child||{}); S.todo = sv.todo||{}; S.checks = sv.checks||{}; } }catch(e){}
function save(){ try{ localStorage.setItem('fever-care', JSON.stringify(S)); }catch(e){} }

function t(en, hi){ return S.lang==='hi' ? hi : en; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function toF(v){ return S.unit==='F' ? v : v*9/5+32; }
function show(f){ return S.unit==='F' ? f.toFixed(1)+'°F' : ((f-32)*5/9).toFixed(1)+'°C'; }
function hm(ts){ var d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function at(ts){ return S.lang==='hi' ? hm(ts)+' बजे' : hm(ts); }
function dkey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dlabel(k){ var p=k.split('-'); return p[2]+'/'+p[1]; }
function minsSince(ts){ return (Date.now()-ts)/MIN; }
function dur(ms){ var m=Math.max(0,Math.ceil(ms/MIN)); var h=Math.floor(m/60); m=m%60; return h ? (h+t('h ','घं ')+m+t('m','मि')) : (m+t(' min',' मिनट')); }
function mmss(ms){ var s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function last(kind){ for(var i=S.log.length-1;i>=0;i--){ if(S.log[i].k===kind) return S.log[i]; } return null; }
function count24(kind){ var c=0, lim=Date.now()-24*3600e3; S.log.forEach(function(e){ if(e.k===kind && e.ts>=lim) c++; }); return c; }
function nextAllowed(kind){ var l=last(kind); if(!l) return null; var n=l.ts+(kind==='p'?PCM_GAP:MEF_GAP)*MIN; return n>Date.now()?n:null; }
function mefAllowed(){ var c=S.child; return c.mefOk && c.mefMl && c.age!=='lt6m' && c.age!=='lt3m'; }

/* where are we in the flow? */
function flowState(){
  var lt = last('t'), lp = last('p'), lm = last('m');
  if(lp && (!lt || lp.ts > lt.ts) && minsSince(lp.ts) < 3*60) return {node:'wait', from:lp.ts, after:'p'};
  if(!lt || minsSince(lt.ts) > 8*60) return {node:'check'};
  if(S.child.age==='lt3m' && lt.v >= FEVER) return {node:'baby'};
  if(lm && lm.ts > lt.ts) return {node:'wait', from:lm.ts, after:'m'};
  if(lt.v < FEVER){
    var had = S.log.some(function(e){ return e.k==='t' && e.v>=FEVER && e.ts<lt.ts && e.ts>lt.ts-8*60*MIN; });
    return {node: had ? 'down' : 'none'};
  }
  if(lp && lt.ts - lp.ts < PCM_GAP*MIN){
    if(lt.ts - lp.ts < 50*MIN) return {node:'wait', from:lp.ts, after:'p'};
    if(lm && lm.ts > lp.ts){ return (lt.ts - lm.ts >= 50*MIN) ? {node:'er'} : {node:'wait', from:lm.ts, after:'m'}; }
    return {node: S.comfort===1 ? 'mef' : (S.comfort===0 ? 'calm' : 'comfort')};
  }
  if(count24('p') >= PCM_MAX) return {node:'pcmmax'};
  return {node:'act'};
}
var MAP = [
  {n:'1', en:'Check', hi:'नापें'}, {n:'2', en:'3 things', hi:'3 काम'}, {n:'3', en:'Wait 1 h', hi:'1 घंटा'},
  {n:'4', en:'Comfortable?', hi:'आराम में?'}, {n:'5', en:'Mefenamic', hi:'मेफ़ेनामिक'}, {n:'6', en:'Wait 1 h', hi:'1 घंटा'}, {n:'✓', en:'Better', hi:'ठीक'}
];
function mapPos(fs){
  var n = fs.node;
  if(n==='act'||n==='pcmmax') return 1;
  if(n==='wait') return fs.after==='m' ? 5 : 2;
  if(n==='comfort'||n==='calm') return 3; if(n==='mef') return 4; if(n==='er'||n==='down') return 6; return 0;
}
function mapHtml(fs){
  var p = mapPos(fs), end = fs.node==='er' ? {n:'!', en:'Hospital', hi:'अस्पताल', cls:'red'} : {n:'✓', en:'Better', hi:'ठीक', cls:'green'};
  return '<div class="map" aria-label="'+t('Steps','कदम')+'">'+MAP.map(function(s,i){
    var lab = i===6 ? end : s, cls = (i<p?'done':(i===p?'now':'')) + (i===6?' '+end.cls:'');
    return '<span class="chip '+cls+'"><i>'+(i<p?'✓':lab.n)+'</i>'+t(lab.en,lab.hi)+'</span>';
  }).join('')+'</div>';
}

    }

    if(n==='mef'){
      h += '<div class="step"><span class="eyebrow">'+t('Step 5','कदम 5')+'</span><h2>'+t('Mefenamic acid — only if really needed','मेफ़ेनामिक एसिड — सिर्फ़ ज़रूरत पड़ने पर')+'</h2>';
      if(!mefAllowed()) h += '<div class="out bad"><b>'+t('Mefenamic acid is not prescribed for this child. Keep sponging and contact the doctor.','इस बच्चे के लिए मेफ़ेनामिक एसिड लिखी नहीं है। स्पंजिंग करते रहें और डॉक्टर से संपर्क करें।')+'</b>'+phoneHtml()+'</div>';
      else if(count24('m') >= MEF_MAX) h += '<div class="out bad"><b>'+t('Already given 3 times in 24 hours. Go to the hospital.','24 घंटे में 3 बार दी जा चुकी। अस्पताल जाएँ।')+'</b></div>';
      else if(nextAllowed('m')) h += '<div class="out warn"><b>'+t('Last dose was less than 8 hours ago. Do not repeat. Keep sponging; if the child stays very uncomfortable, go to the hospital.','पिछली खुराक को 8 घंटे नहीं हुए। दोबारा न दें। स्पंजिंग करते रहें; बच्चा बहुत बेचैन रहे तो अस्पताल जाएँ।')+'</b></div>';

        if(st.any) h += '<div class="out bad"><b>'+t('Do NOT give mefenamic acid. Contact the doctor or go to the hospital now.','मेफ़ेनामिक एसिड न दें। अभी डॉक्टर से संपर्क करें या अस्पताल जाएँ।')+'</b>'+phoneHtml()+'</div>';
        else if(st.all) h += '<div class="dose" style="color:var(--mef)">'+t('Mefenamic acid','मेफ़ेनामिक एसिड')+' · '+esc(c.mefMl)+' ml</div><p class="muted">'+t('Give after food or milk. Keep sponging.','खाने या दूध के बाद दें। स्पंजिंग जारी रखें।')+'</p><button type="button" class="btn mef" data-add="m">'+t('I gave mefenamic acid','मैंने मेफ़ेनामिक एसिड दी')+'</button>';
      }
      h += '</div>';

  if(n==='er') return '<div class="step bad"><span class="eyebrow">'+t('Emergency','इमरजेंसी')+'</span><h2>'+t('Go to hospital emergency now','तुरंत अस्पताल इमरजेंसी जाएँ')+'</h2><div class="pic">'+picHospital()+'</div><p><b>'+t('Fever has not come down even after paracetamol and mefenamic acid.','पैरासिटामोल और मेफ़ेनामिक एसिड के बाद भी बुख़ार नहीं उतरा।')+'</b> '+t('Keep sponging on the way. Carry this phone to show the doctor the graph.','रास्ते में स्पंजिंग करते रहें। डॉक्टर को ग्राफ़ दिखाने के लिए यह फ़ोन साथ ले जाएँ।')+'</p>'+phoneHtml()+'</div>';
  if(n==='down'){
    var h2 = '<div class="step good"><span class="eyebrow">'+t('Fever is down','बुख़ार उतर गया')+'</span><h2>'+t('Well done! Is the child active and playful?','शाबाश! क्या बच्चा चुस्त और खेल रहा है?')+'</h2><div class="pic">'+picSun()+'</div>'+
      '<div class="two"><button type="button" class="btn ghost" data-active="1"'+(S.active===1?' style="border-color:var(--good);background:var(--good-soft)"':'')+'>'+t('Yes, playing','हाँ, खेल रहा')+'</button><button type="button" class="btn ghost" data-active="0"'+(S.active===0?' style="border-color:var(--bad);background:var(--bad-soft)"':'')+'>'+t('No, still dull','नहीं, सुस्त है')+'</button></div>';
    if(S.active===1) h2 += '<div class="out good"><b>'+t('Good sign.','अच्छा संकेत।')+'</b> '+t('Give fluids and light food the child likes.','तरल और बच्चे की पसंद का हल्का खाना दें।')+'</div>';
    if(S.active===0) h2 += '<div class="out bad"><b>'+t('A child who stays dull or sleepy even without fever should see the doctor today.','बुख़ार न होने पर भी बच्चा सुस्त या नींद में रहे तो आज ही डॉक्टर को दिखाएँ।')+'</b>'+phoneHtml()+'</div>';
    h2 += '<div class="out warn"><b>'+t('Fever often comes back after 4–6 hours.','बुख़ार अक्सर 4–6 घंटे बाद फिर आता है।')+'</b> '+t('Then start again from step 1.','तब फिर से कदम 1 से शुरू करें।')+'</div>'+fevFact()+'</div>';
    return h2;
  }
  return '';
}

function todayLog(){
  var k = dkey(Date.now()), items = S.log.map(function(e,i){return {e:e,i:i};}).filter(function(x){return dkey(x.e.ts)===k;}).reverse();
  if(!items.length) return '<p class="muted">'+t('Nothing recorded today yet.','आज अभी कुछ नहीं लिखा।')+'</p>';
  return '<div>'+items.map(function(x){
    var e=x.e, tag = e.k==='t' ? '<span class="tag t">'+show(e.v)+'</span>' : e.k==='p' ? '<span class="tag p">P · '+t('Paracetamol','पैरासिटामोल')+'</span>' : e.k==='m' ? '<span class="tag m">M · '+t('Mefenamic','मेफ़ेनामिक')+'</span>' : '<span class="tag s">'+t('Sponging','स्पंजिंग')+'</span>';
    return '<div class="li"><time>'+hm(e.ts)+'</time><span>'+tag+'</span><button type="button" class="x" data-del="'+x.i+'" aria-label="'+t('Delete entry','हटाएँ')+'">×</button></div>';
  }).join('')+'</div>';
}

/* GRAPH tab */
function renderGraph(){
  var temps = S.log.filter(function(e){return e.k==='t';});
  var h = '<div class="card"><h2>'+t('Fever graph','बुख़ार का ग्राफ़')+'</h2>';
  if(temps.length < 2){
    h += '<p class="muted">'+t('Record at least 2 temperatures to see the graph. Record each time you check, and 1 hour after each medicine.','ग्राफ़ देखने के लिए कम से कम 2 बार बुख़ार लिखें। हर बार नापें तब लिखें, और हर दवा के 1 घंटे बाद।')+'</p></div>';
    document.getElementById('main').innerHTML = h + summaryHtml(); return;
  }
  var end = Math.max(Date.now(), temps[temps.length-1].ts), start = Math.max(temps[0].ts, end - 7*24*3600e3);
  var vis = S.log.filter(function(e){return e.ts>=start;}), tv = vis.filter(function(e){return e.k==='t';});
  var W=340, H=230, L=34, R=10, T=12, B=52, lane=H-B+14;
  var lo = Math.min(97, Math.floor(Math.min.apply(null, tv.map(function(e){return e.v;}))));
  var hi = Math.max(104, Math.ceil(Math.max.apply(null, tv.map(function(e){return e.v;}))));
  function x(ts){ return L + (ts-start)/(end-start||1)*(W-L-R); }
  function y(v){ return T + (hi-v)/(hi-lo)*(H-B-T); }
  var g = '';
  for(var v=lo; v<=hi; v++){ g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/>'+((hi-lo>6 && v%2)?'':'<text x="'+(L-5)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+(S.unit==='F'?v:((v-32)*5/9).toFixed(0))+'</text>'); }
  g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(FEVER)+'" y2="'+y(FEVER)+'" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(y(FEVER)-4)+'" text-anchor="end" font-size="10" font-weight="700" fill="var(--bad)">'+t('Fever','बुख़ार')+' '+show(FEVER)+'</text>';
  var d0 = new Date(start); d0.setHours(0,0,0,0);
  for(var d=d0.getTime(); d<=end; d+=24*3600e3){ if(d<start) continue; g += '<line x1="'+x(d)+'" x2="'+x(d)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line)" stroke-dasharray="2 3"/><text x="'+(x(d)+3)+'" y="'+(H-B+40)+'" font-size="10" fill="var(--muted)">'+dlabel(dkey(d))+'</text>'; }
  g += '<polyline points="'+tv.map(function(e){return x(e.ts).toFixed(1)+','+y(e.v).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--temp)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  tv.forEach(function(e){ var idx=S.log.indexOf(e); g += '<circle cx="'+x(e.ts)+'" cy="'+y(e.v)+'" r="4.5" fill="var(--temp)" stroke="var(--surface)" stroke-width="2"/><circle cx="'+x(e.ts)+'" cy="'+y(e.v)+'" r="14" fill="transparent" data-pt="'+idx+'" style="cursor:pointer" tabindex="0" role="button" aria-label="'+hm(e.ts)+' '+show(e.v)+'"/>'; });
  g += '<text x="'+(L-5)+'" y="'+(lane+4)+'" text-anchor="end" font-size="9" fill="var(--muted)">Rx</text>';
  vis.forEach(function(e){ if(e.k!=='p' && e.k!=='m') return; var cx=x(e.ts), cy=lane+(e.k==='m'?12:0), col=e.k==='p'?'var(--pcm)':'var(--mef)';
    g += '<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/><text x="'+cx+'" y="'+(cy+3)+'" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">'+(e.k==='p'?'P':'M')+'</text>'; });
  h += '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+t('Temperature over time','समय के साथ बुख़ार')+'">'+g+'</svg></div>'+
    '<div class="tip" id="tip">'+t('Tap a dot to see time and temperature','समय और बुख़ार देखने के लिए बिंदु पर टैप करें')+'</div>'+
    '<div class="legend"><span><span class="sw" style="background:var(--temp)"></span>'+t('Temperature','बुख़ार')+'</span><span><span class="sw" style="background:var(--pcm)">P</span>'+t('Paracetamol','पैरासिटामोल')+'</span><span><span class="sw" style="background:var(--mef)">M</span>'+t('Mefenamic acid','मेफ़ेनामिक एसिड')+'</span></div></div>';
  document.getElementById('main').innerHTML = h + summaryHtml();
}
function daySummary(){
  var days = {}, order = [], prevFever = false, prevTs = 0;
  S.log.forEach(function(e){
    var k = dkey(e.ts); if(!days[k]){ days[k] = {max:null, spikes:0, p:0, m:0, n:0}; order.push(k); }
    var d = days[k];
    if(e.k==='t'){ d.n++; if(d.max===null || e.v>d.max) d.max=e.v; var f = e.v>=FEVER; if(f && (!prevFever || e.ts-prevTs > 6*3600e3)) d.spikes++; prevFever = f; prevTs = e.ts; }
    if(e.k==='p') d.p++; if(e.k==='m') d.m++;
  });
  return order.map(function(k){ return Object.assign({k:k}, days[k]); });
}
function summaryHtml(){
  var ds = daySummary().filter(function(d){return d.n>0;});
  if(!ds.length) return '';
  var feverDays = ds.filter(function(d){return d.max>=FEVER;}), trend = '';
  if(ds.length >= 2){
    var a = ds[ds.length-1], b = ds[ds.length-2];
    var down = (a.max < b.max - 0.4) || (a.max<=b.max && a.spikes < b.spikes);
    var up = (a.max > b.max + 0.4) || (a.max>=b.max && a.spikes > b.spikes);
    if(a.max < FEVER) trend = '<div class="trend good">'+t('No fever on the last day recorded. Keep watching for 24 hours.','पिछले दिन बुख़ार नहीं रहा। 24 घंटे और नज़र रखें।')+'</div>';
    else if(down) trend = '<div class="trend good">'+t('Fever is coming down: lower peak or fewer spikes than the day before.','बुख़ार घट रहा है: पिछले दिन से कम ऊँचा या कम बार।')+'</div>';
    else if(up) trend = '<div class="trend bad">'+t('Fever is going up: higher peak or more spikes than the day before. Show the doctor.','बुख़ार बढ़ रहा है: पिछले दिन से ज़्यादा ऊँचा या ज़्यादा बार। डॉक्टर को दिखाएँ।')+'</div>';
    else trend = '<div class="trend warn">'+t('Fever is about the same as the day before.','बुख़ार पिछले दिन जैसा ही है।')+'</div>';
  }
  var longFever = feverDays.length >= 3 ? '<div class="trend bad">'+t('Fever on '+feverDays.length+' days. Fever lasting 3 days or more needs a doctor visit (blood tests may be needed).','बुख़ार '+feverDays.length+' दिन से। 3 दिन या ज़्यादा बुख़ार पर डॉक्टर को दिखाएँ (ख़ून की जाँच की ज़रूरत हो सकती है)।')+'</div>' : '';
  return '<div class="card"><h2>'+t('Day by day','दिन-ब-दिन')+'</h2>'+trend+longFever+
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>'+t('Day','दिन')+'</th><th>'+t('Highest','सबसे ज़्यादा')+'</th><th>'+t('Fever spikes','बुख़ार कितनी बार')+'</th><th>P</th><th>M</th></tr></thead><tbody>'+
    ds.map(function(d,i){ return '<tr><td>'+t('Day ','दिन ')+(i+1)+' <span class="muted">'+dlabel(d.k)+'</span></td><td style="font-weight:700;color:'+(d.max>=FEVER?'var(--bad)':'var(--good)')+'">'+show(d.max)+'</td><td>'+d.spikes+'</td><td>'+d.p+'</td><td>'+d.m+'</td></tr>'; }).join('')+
    '</tbody></table></div><p class="muted">'+t('Show this screen to the doctor at the visit.','डॉक्टर के पास जाएँ तो यह स्क्रीन दिखाएँ।')+'</p></div>';
}

  function ar(l){ return '<div class="arrow" aria-hidden="true">'+(l?'<span>'+l+'</span>':'')+'</div>'; }
  var flow = '<div class="card"><h2>'+t('The fever plan at a glance','एक नज़र में बुख़ार का प्लान')+'</h2><div class="flow">'+
    node('', '1. '+t('Check temperature','बुख़ार नापें'), t('Digital thermometer, armpit.','डिजिटल थर्मामीटर, बगल में।'))+ar()+
    node('dec', t('100.4°F (38°C) or more?','100.4°F (38°C) या ज़्यादा?'), t('No → no medicine, fluids and rest.','नहीं → दवा नहीं, तरल और आराम।'))+ar(t('Yes','हाँ'))+
    node('', '2. '+t('Do 3 things together','3 काम साथ में'), t('Loosen clothes · Paracetamol · Sponging (lukewarm, whole body, let dry, repeat)','कपड़े ढीले · पैरासिटामोल · स्पंजिंग (गुनगुना, पूरा शरीर, सूखने दें, दोहराएँ)'))+ar()+
    node('', '3. '+t('Wait 1 hour, check again','1 घंटा रुकें, फिर नापें'), '')+ar()+
    '<div class="split">'+node('ok', t('Fever down','बुख़ार उतरा'), t('Child should be active and playful. Fever may return in 4–6 h → start again.','बच्चा चुस्त और खेलने वाला हो। 4–6 घंटे में बुख़ार लौट सकता है → फिर शुरू करें।'))+node('dec', t('Still fever','अभी भी बुख़ार'), t('Is the child uncomfortable?','क्या बच्चा बेचैन है?'))+'</div>'+ar(t('Uncomfortable','बेचैन'))+
    '<div class="split">'+node('ok', t('Comfortable','आराम में'), t('No mefenamic. Keep sponging.','मेफ़ेनामिक नहीं। स्पंजिंग जारी।'))+node('', '4. '+t('Mefenamic acid','मेफ़ेनामिक एसिड'), t('Only if prescribed and safety questions are all “No”.','सिर्फ़ अगर लिखी हो और सुरक्षा सवाल सब “नहीं” हों।'))+'</div>'+ar()+
    node('', '5. '+t('Wait 1 hour, check again','1 घंटा रुकें, फिर नापें'), '')+ar(t('Still fever','अभी भी बुख़ार'))+
    node('er', t('Hospital emergency','अस्पताल इमरजेंसी'), '')+
    '</div><p class="muted">'+t('Paracetamol: 4–5 times a day, at least 5 hours apart (never more than 5 in 24 h). Mefenamic acid: only if really needed, max 3 in 24 h.','पैरासिटामोल: दिन में 4–5 बार, कम से कम 5 घंटे के अंतर पर (24 घंटे में 5 से ज़्यादा कभी नहीं)। मेफ़ेनामिक एसिड: सिर्फ़ सच में ज़रूरत पर, 24 घंटे में ज़्यादा से ज़्यादा 3।')+'</p></div>';
  var h = flow + fevFact() +
  '<div class="card" style="border:2px solid var(--bad)"><h2 style="color:var(--bad)">'+t('Go to the doctor / hospital immediately if','तुरंत डॉक्टर / अस्पताल जाएँ अगर')+'</h2><ul class="pts">'+
    [['Fits (convulsion), or the child is very drowsy or hard to wake','दौरा (झटके) आए, या बच्चा बहुत सुस्त हो / जगाना मुश्किल हो'],
     ['Fast or difficult breathing, chest pulling in','तेज़ या मुश्किल से साँस, छाती अंदर धँसना'],
     ['Purple or red spots that do not fade on pressing, bleeding from gums or nose, black stool','दबाने पर न मिटने वाले बैंगनी/लाल धब्बे, मसूड़ों या नाक से ख़ून, काली पॉटी'],
     ['Repeated vomiting, cannot drink, no urine for 6–8 hours','बार-बार उल्टी, कुछ पी न पाए, 6–8 घंटे से पेशाब नहीं'],
     ['Severe stomach pain, or cold, clammy hands and feet','पेट में तेज़ दर्द, या हाथ-पैर ठंडे और चिपचिपे'],
     ['Stiff neck, severe headache, or the child cries when touched','गर्दन अकड़ना, तेज़ सिरदर्द, या छूने पर बच्चा रोए'],
     ['Baby under 3 months with any fever','3 महीने से छोटे बच्चे को कोई भी बुख़ार'],
     ['Fever not coming down even after paracetamol and mefenamic acid','पैरासिटामोल और मेफ़ेनामिक एसिड के बाद भी बुख़ार न उतरे'],
     ['Child stays dull or sleepy even when the fever is down','बुख़ार उतरने पर भी बच्चा सुस्त या नींद में रहे'],
     ['Fever for 3 days or more','3 दिन या ज़्यादा बुख़ार']].map(function(x){return '<li><b>'+t(x[0],x[1])+'</b></li>';}).join('')+'</ul>'+phoneHtml()+'</div>'+
  '<div class="card"><h3>'+t('If a fit (convulsion) happens','अगर दौरा (झटके) आए')+'</h3><ul class="pts">'+
    '<li>'+t('Stay calm. Lay the child on one side on a flat surface.','घबराएँ नहीं। बच्चे को समतल जगह पर एक करवट लिटाएँ।')+'</li>'+
    '<li>'+t('Do not put anything in the mouth. Do not hold the child down. Do not give water or medicine by mouth.','मुँह में कुछ न डालें। बच्चे को ज़ोर से न पकड़ें। मुँह से पानी या दवा न दें।')+'</li>'+
    '<li>'+t('Note the time. Go to hospital after it stops, or at once if it lasts more than 5 minutes.','समय नोट करें। रुकने के बाद अस्पताल जाएँ; 5 मिनट से ज़्यादा चले तो तुरंत।')+'</li></ul></div>'+
  '<div class="card"><h3>'+t('Do','करें')+'</h3><ul class="pts">'+
    '<li>'+t('Plenty of fluids: water, ORS, nariyal pani, dal water, soup; breastfeed more often.','ख़ूब तरल: पानी, ORS, नारियल पानी, दाल का पानी, सूप; माँ का दूध बार-बार।')+'</li>'+
    '<li>'+t('Light food the child likes: khichdi, dalia, idli, fruit. Small amounts often.','पसंद का हल्का खाना: खिचड़ी, दलिया, इडली, फल। थोड़ा-थोड़ा बार-बार।')+'</li>'+
    '<li>'+t('Light cotton clothes; a fan is fine.','हल्के सूती कपड़े; पंखा चला सकते हैं।')+'</li>'+
    '<li>'+t('Measure medicine with the cup or syringe that came with it, not a kitchen spoon.','दवा उसी के साथ आए कप या सिरिंज से नापें, रसोई के चम्मच से नहीं।')+'</li></ul></div>'+
  '<div class="card"><h3>'+t('Do not','न करें')+'</h3><ul class="pts">'+
    '<li>'+t('Do not give mefenamic acid if the child is comfortable, even with fever.','बुख़ार हो पर बच्चा आराम में हो तो मेफ़ेनामिक एसिड न दें।')+'</li>'+
    '<li>'+t('Do not give aspirin, nimesulide or any medicine not prescribed. Do not start antibiotics on your own.','एस्पिरिन, निमेसुलाइड या बिना लिखी कोई दवा न दें। अपने आप एंटीबायोटिक शुरू न करें।')+'</li>'+
    '<li>'+t('No cold water, ice or alcohol sponging. A wet cloth on the forehead alone does not lower fever. No blankets.','ठंडा पानी, बर्फ़ या स्प्रिट से स्पंजिंग नहीं। सिर्फ़ माथे पर गीली पट्टी से बुख़ार नहीं उतरता। कंबल नहीं।')+'</li>'+
    '<li>'+t('Do not wake a sleeping, comfortable child only to give fever medicine.','आराम से सोते बच्चे को सिर्फ़ बुख़ार की दवा देने के लिए न जगाएँ।')+'</li></ul></div>';
  document.getElementById('main').innerHTML = h;
}

/* SETUP tab */
function renderSetup(msg){
  var c = S.child;
  document.getElementById('main').innerHTML = '<div class="card form"><h2>'+t('Setup from prescription','पर्चे से सेटअप')+'</h2>'+
    '<label for="cname">'+t('Child’s name','बच्चे का नाम')+'</label><input id="cname" type="text" value="'+esc(c.name)+'">'+
    '<label for="cage">'+t('Age','उम्र')+'</label><select id="cage">'+
      [['lt3m','Under 3 months','3 महीने से कम'],['lt6m','3–6 months','3–6 महीने'],['6m+','6 months or older','6 महीने या ज़्यादा']].map(function(o){return '<option value="'+o[0]+'"'+(c.age===o[0]?' selected':'')+'>'+t(o[1],o[2])+'</option>';}).join('')+'</select>'+
    '<label for="pstr">'+t('Paracetamol syrup strength (on the bottle)','पैरासिटामोल सिरप की ताक़त (बोतल पर लिखी)')+'</label><select id="pstr">'+
      ['120 mg/5 ml','250 mg/5 ml','100 mg/ml (drops)','Other / अन्य'].map(function(o){return '<option'+(c.pcmStr===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'+
    '<label for="pml">'+t('Paracetamol dose in ml (as written by the doctor)','पैरासिटामोल की खुराक ml में (जैसा डॉक्टर ने लिखा)')+'</label><input id="pml" type="number" inputmode="decimal" step="0.1" value="'+esc(c.pcmMl)+'">'+
    '<label class="tick"><input id="mok" type="checkbox"'+(c.mefOk?' checked':'')+'><span>'+t('Doctor has prescribed mefenamic acid for an uncomfortable child with fever','डॉक्टर ने बुख़ार में बेचैन बच्चे के लिए मेफ़ेनामिक एसिड लिखी है')+'</span></label>'+
    '<label for="mml">'+t('Mefenamic acid dose in ml (as written by the doctor)','मेफ़ेनामिक एसिड की खुराक ml में (जैसा डॉक्टर ने लिखा)')+'</label><input id="mml" type="number" inputmode="decimal" step="0.1" value="'+esc(c.mefMl)+'">'+
    '<label for="ph">'+t('Clinic phone number','क्लिनिक का फ़ोन नंबर')+'</label><input id="ph" type="tel" value="'+esc(c.phone)+'">'+
    '<label for="unit">'+t('Thermometer unit','थर्मामीटर की इकाई')+'</label><select id="unit"><option value="F"'+(S.unit==='F'?' selected':'')+'>°F</option><option value="C"'+(S.unit==='C'?' selected':'')+'>°C</option></select>'+
    '<button type="button" class="btn" id="saveSetup" style="margin-top:10px">'+t('Save','सेव करें')+'</button>'+(msg?'<p class="saved">'+msg+'</p>':'')+
    '<p class="muted">'+t('This guide never calculates doses. Use only the dose your doctor wrote.','यह गाइड खुराक ख़ुद नहीं बनाती। सिर्फ़ डॉक्टर की लिखी खुराक दें।')+'</p></div>'+
    '<div class="card"><h3>'+t('New illness','नई बीमारी')+'</h3><p class="muted">'+t('Clears the diary and graph, keeps your doses.','डायरी और ग्राफ़ साफ़ करें, खुराक रहेगी।')+'</p><div id="clr"><button type="button" class="btn ghost" id="clearAsk">'+t('Clear diary','डायरी साफ़ करें')+'</button></div></div>'+
    '<p class="muted" style="text-align:center">'+t('Everything is saved only on this phone.','सब कुछ सिर्फ़ इसी फ़ोन में सेव रहता है।')+'</p>';
}

/* shell */
var TABS = {now:['Now','अभी'], graph:['Graph','ग्राफ़'], care:['Care','देखभाल'], setup:['Setup','सेटअप']};
function render(){
  document.documentElement.lang = S.lang==='hi'?'hi':'en';
  document.getElementById('brandTitle').textContent = t('Fever Care','बुख़ार देखभाल') + (S.child.name ? ' · '+S.child.name : '');
  document.querySelectorAll('[data-l]').forEach(function(el){ var k=el.dataset.l; el.textContent = t(TABS[k][0], TABS[k][1]); });
  document.querySelectorAll('.seg button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===S.lang)); });
  document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)); });
  ({now:renderNow, graph:renderGraph, care:renderCare, setup:renderSetup})[S.tab]();
  save();
}
function addLog(k, v){ S.log.push({k:k, ts:Date.now(), v:v}); if(S.log.length>600) S.log = S.log.slice(-600); }
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box=document.createElement('div'); box.className='confetti'; var cols=['#eb6834','#2a78d6','#1baf7a','#f0b04a','#e87ba4'];
  for(var i=0;i<34;i++){ var s=document.createElement('span'); s.style.left=(Math.random()*100)+'%'; s.style.background=cols[i%cols.length]; s.style.animationDelay=(Math.random()*.3)+'s'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(function(){ box.remove(); }, 2200);
}

document.addEventListener('click', function(e){
  var b = e.target.closest('button, [data-pt]'); if(!b) return;
  var d = b.dataset;
  if(d.lang){ S.lang = d.lang; render(); return; }
  if(d.tab){ S.tab = d.tab; render(); window.scrollTo(0,0); return; }
  if(d.tabgo){ S.tab = d.tabgo; render(); return; }
  if(d.todo){
    if(d.todo==='pc'){ if(!S.todo.pc){ S.todo.pc = true; addLog('p'); S._scroll = true; } render(); return; }
    S.todo[d.todo] = !S.todo[d.todo];
    if(d.todo==='sp' && S.todo.sp && !(S.spongeStart && minsSince(S.spongeStart) < SPONGE_MIN)){ S.spongeStart = Date.now(); addLog('s'); }
    render(); return;
  }
  if(d.add){
    addLog(d.add);
    if(d.add==='p'){ S.todo.pc = true; S.comfort = undefined; S._scroll = true; }
    if(d.add==='m'){ S.checks = {}; S._scroll = true; }
    render(); return;
  }
  if(d.del !== undefined){ S.log.splice(+d.del, 1); render(); return; }
  if(d.chk !== undefined){ S.checks[d.chk] = +d.v; render(); return; }
  if(d.comfort !== undefined){ S.comfort = +d.comfort; render(); return; }
  if(d.active !== undefined){ S.active = +d.active; if(S.active===1) confetti(); render(); return; }
  if(d.pt !== undefined){ var en = S.log[+d.pt], tip=document.getElementById('tip'); if(tip && en) tip.textContent = dlabel(dkey(en.ts))+'  '+hm(en.ts)+'  ·  '+show(en.v); return; }
  if(b.id==='spStart'){ S.spongeStart = Date.now(); S.todo.sp = true; addLog('s'); render(); var sb=document.getElementById('spongeBox'); if(sb) sb.scrollIntoView({block:'center',behavior:'smooth'}); return; }
  if(b.id==='spStop'){ S.spongeStart = null; render(); return; }
  if(b.id==='saveSetup'){
    S.child = {name:document.getElementById('cname').value.trim(), age:document.getElementById('cage').value, pcmStr:document.getElementById('pstr').value, pcmMl:document.getElementById('pml').value, mefOk:document.getElementById('mok').checked, mefMl:document.getElementById('mml').value, phone:document.getElementById('ph').value.trim()};
    S.unit = document.getElementById('unit').value; render(); renderSetup(t('Saved ✓','सेव हो गया ✓')); return;
  }
  if(b.id==='clearAsk'){ document.getElementById('clr').innerHTML = '<p style="margin-bottom:8px">'+t('Sure? The diary and graph will be cleared.','पक्का? डायरी और ग्राफ़ साफ़ हो जाएँगे।')+'</p><div class="two"><button type="button" class="btn danger" id="clearYes">'+t('Yes, clear','हाँ, साफ़ करें')+'</button><button type="button" class="btn ghost" id="clearNo">'+t('No','नहीं')+'</button></div>'; return; }
  if(b.id==='clearYes'){ S.log=[]; S.checks={}; S.todo={}; S.comfort=undefined; S.active=undefined; S.spongeStart=null; render(); renderSetup(t('Diary cleared','डायरी साफ़ हो गई')); return; }
  if(b.id==='clearNo'){ renderSetup(); return; }
});
document.addEventListener('keydown', function(e){ if((e.key==='Enter'||e.key===' ') && e.target.dataset && e.target.dataset.pt!==undefined){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });
document.addEventListener('submit', function(e){
  if(e.target.id!=='tform') return; e.preventDefault();
  var inp = document.getElementById('tval'), raw = parseFloat(inp.value);
  if(isNaN(raw)) return;
  var f = toF(raw);
  if(f < 93 || f > 109){ inp.value=''; inp.placeholder=t('Check reading','रीडिंग जाँचें'); return; }
  var prev = last('t');
  addLog('t', Math.round(f*10)/10);
  S.checks = {}; S.comfort = undefined; S.active = undefined; S._scroll = true;
  if(f >= FEVER && (!prev || prev.v < FEVER || minsSince(prev.ts) > 5*60)) S.todo = {};
  render();
  if(prev && prev.v >= FEVER && f < FEVER) confetti();
});

setInterval(function(){
  if(S.tab!=='now') return;
  var sp = document.getElementById('spClock');
  if(sp && S.spongeStart){
    var el = Date.now()-S.spongeStart;
    if(el >= SPONGE_MIN*MIN){ S.spongeStart = null; save(); renderNow(); return; }
    sp.textContent = mmss(SPONGE_MIN*MIN-el);
    var cyc = Math.floor(el/1000) % 90, ph = document.getElementById('spPhase');
    if(ph) ph.textContent = cyc < 40 ? t('Wipe the whole body','पूरे शरीर को पोंछें') : t('Let the skin dry in the air','त्वचा को हवा में सूखने दें');
  }
}, 1000);
setInterval(function(){ if(S.tab==='now' && document.getElementById('ringBox') && !(document.activeElement && document.activeElement.id==='tval')) renderNow(); }, 30000);

render();
})();
</script>
