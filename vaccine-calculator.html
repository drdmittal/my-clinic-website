*{box-sizing:border-box}
body{margin:0;font-family:"Anek Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--indigo);color:#fff;padding:18px 16px}

.bar{display:flex;justify-content:flex-end;margin:6px 0 12px}
.lang{border:2px solid var(--indigo);background:#fff;color:var(--indigo);border-radius:10px;padding:6px 12px;font:700 14px "Anek Devanagari",sans-serif;cursor:pointer}

.panel input,.panel select{width:100%;font:600 16px "Anek Devanagari",sans-serif;padding:10px;border:2px solid #d9d6f2;border-radius:10px;background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:13px;color:var(--muted);margin-top:6px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.p-over{background:#fde6ee;color:#a8214d}
.p-now{background:#fff4dc;color:#7a4b00}
.p-up{background:#e6f0fd;color:#1e5fa8}
.p-given{background:#e7f6e9;color:#1f6b28}
h2.group{font-size:17px;margin:18px 0 8px;color:var(--indigo)}
.vax{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(42,37,128,.08);border-left:6px solid var(--teal)}
.vax.over{border-left-color:var(--pink)}
.vax.now{border-left-color:var(--turmeric)}
.vax.given{border-left-color:var(--green);opacity:.85}
.vax h3{margin:0 0 4px;font-size:16px}
.vax .due{font-size:15px;font-weight:700;color:var(--indigo)}
.vax .prot{font-size:14px;color:var(--muted)}
.vax .act{font-size:14px;margin-top:6px}
.vax label.tick{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:700;font-size:14px;cursor:pointer}
.vax label.tick input{width:20px;height:20px}
.vax input.date{font:600 14px "Anek Devanagari",sans-serif;padding:4px 6px;border:1px solid #d9d6f2;border-radius:6px}
.note{margin-top:20px;background:#f1efff;border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.urgent{margin-top:12px;background:#fff4dc;border-radius:12px;padding:12px 14px;font-size:14px}
footer{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}

      hpv: ["9 से 14 साल: HPV टीका, 2 खुराक (लड़कियों के लिए)", "सर्वाइकल कैंसर और उससे जुड़े कैंसर"],

// Each item: id, when (function of dob -> {from, to}), sexFilter (optional)
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const addYears = (d, n) => addMonths(d, 12 * n);

const ITEMS = [
  {id:"bcg",   when: d => ({from: d, to: null})},
  {id:"p6w",   when: d => ({from: addDays(d, 42), to: null})},
  {id:"p10w",  when: d => ({from: addDays(d, 70), to: null})},
  {id:"p14w",  when: d => ({from: addDays(d, 98), to: null})},
  {id:"flu1",  when: d => ({from: addMonths(d, 6), to: null})},
  {id:"flu2",  when: d => ({from: addDays(addMonths(d, 6), 28), to: null})},
  {id:"tcv1",  when: d => ({from: addMonths(d, 6), to: addMonths(d, 9)})},
  {id:"m9",    when: d => ({from: addMonths(d, 9), to: null})},
  {id:"m12",   when: d => ({from: addMonths(d, 12), to: null})},
  {id:"m15",   when: d => ({from: addMonths(d, 15), to: null})},
  {id:"b16",   when: d => ({from: addMonths(d, 16), to: addMonths(d, 18)})},
  {id:"men2",  when: d => ({from: addMonths(d, 24), to: null})},
  {id:"tcv2",  when: d => ({from: addYears(d, 3), to: addYears(d, 5)})},
  {id:"b4",    when: d => ({from: addYears(d, 4), to: addYears(d, 5)})},
  {id:"hpv",   when: d => ({from: addYears(d, 9), to: addYears(d, 14)}), girlsOnly: true},
  {id:"tdap",  when: d => ({from: addYears(d, 9), to: addYears(d, 14)})}
];

let lang = "en";
const KEY = "vaxcalc-v1";

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(state){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

function startOfToday(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
function fmt(d){ return d.toLocaleDateString(lang === "en" ? "en-IN" : "hi-IN", {day:"numeric", month:"short", year:"numeric"}); }

function status(item, dob, given, today){
  const w = item.when(dob);
  if (given) return {k:"given"};
  if (w.to) {
    if (today < w.from) return {k:"up", from: w.from, to: w.to};
    if (today <= w.to) return {k:"now", from: w.from, to: w.to};
    return {k:"over", from: w.from, to: w.to};
  }
  if (today < w.from) return {k:"up", from: w.from};
  const days = Math.floor((today - w.from) / 86400000);
  if (days <= 28) return {k:"now", from: w.from};
  return {k:"over", from: w.from};
}

function render(){
  const T = UI[lang];
  document.getElementById("clinicLine").textContent = T.clinic;
  document.getElementById("title").textContent = T.title;
  document.getElementById("subtitle").textContent = T.sub;
  document.getElementById("langBtn").textContent = lang === "en" ? "हिन्दी" : "English";
  document.documentElement.lang = lang === "en" ? "en" : "hi";
  document.getElementById("lblDob").textContent = T.dob;
  document.getElementById("lblSex").textContent = T.sex;
  document.getElementById("hintDob").textContent = T.hint;
  const sex = document.getElementById("sex");
  const cur = sex.value || "boy";
  sex.innerHTML = `<option value="boy">${T.boy}</option><option value="girl">${T.girl}</option>`;
  sex.value = cur;
  document.getElementById("catchup").innerHTML = T.catchup;
  document.getElementById("note").innerHTML = T.note;
  document.getElementById("foot1").textContent = T.foot;

  const dobVal = document.getElementById("dob").value;
  const summary = document.getElementById("summary");
  const list = document.getElementById("list");
  if (!dobVal) { summary.innerHTML = ""; list.innerHTML = `<div class="small">${T.enterDob}</div>`; return; }
  const [y,m,d] = dobVal.split("-").map(Number);
  const dob = new Date(y, m-1, d);
  const today = startOfToday();
  if (dob > today) { summary.innerHTML = ""; list.innerHTML = `<div class="small">${T.futureDob}</div>`; return; }

  const state = load();
  const given = state.given || {};
  const dates = state.dates || {};
  const groups = {over:[], now:[], up:[], given:[]};
  ITEMS.forEach(it => {
    if (it.girlsOnly && sex.value !== "girl") return;
    const s = status(it, dob, !!given[it.id], today);
    groups[s.k].push({it, s});
  });

  summary.innerHTML = [
    `<span class="pill p-over">${T.s_over}: ${groups.over.length}</span>`,
    `<span class="pill p-now">${T.s_now}: ${groups.now.length}</span>`,
    `<span class="pill p-up">${T.s_up}: ${groups.up.length}</span>`,
    `<span class="pill p-given">${T.s_given}: ${groups.given.length}</span>`
  ].join("");

  const cardFor = ({it, s}) => {
    const V = T.v[it.id];
    const cls = s.k === "over" ? "over" : s.k === "now" ? "now" : s.k === "given" ? "given" : "";
    let dueLine;
    if (s.k === "given") dueLine = `${T.given}: ${dates[it.id] ? fmt(new Date(dates[it.id])) : "—"}`;
    else if (s.to) dueLine = `${T.window}: ${fmt(s.from)} – ${fmt(s.to)}`;
    else dueLine = `${T.on}: ${fmt(s.from)}`;
    const act = s.k === "over" ? T.act_over : s.k === "now" ? T.act_now : s.k === "up" ? T.act_up : "";
    return `<div class="vax ${cls}">
      <h3>${V[0]}</h3>
      <div class="due">${dueLine}</div>
      <div class="prot">${T.protects}: ${V[1]}</div>
      ${act ? `<div class="act">${act}</div>` : ""}
      <label class="tick"><input type="checkbox" data-id="${it.id}" ${s.k === "given" ? "checked" : ""}> ${T.tick}</label>
      ${s.k === "given" || s.k === "up" ? "" : `<label class="small">${lang === "en" ? "Date given (optional)" : "लगवाने की तारीख (वैकल्पिक)"} <input class="date" type="date" data-date="${it.id}" value="${dates[it.id] || ""}"></label>`}
    </div>`;
  };

  const section = (k, title) => groups[k].length ? `<h2 class="group">${title}</h2>` + groups[k].map(cardFor).join("") : "";
  list.innerHTML = section("over", T.gr_over) + section("now", T.gr_now) + section("up", T.gr_up) + section("given", T.gr_given);
}

document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "en" ? "hi" : "en"; render(); });
document.getElementById("dob").addEventListener("change", render);
document.getElementById("sex").addEventListener("change", render);
document.getElementById("list").addEventListener("change", e => {
  const state = load();
  state.given = state.given || {};
  state.dates = state.dates || {};
  if (e.target.matches("input[type=checkbox][data-id]")) state.given[e.target.dataset.id] = e.target.checked;
  if (e.target.matches("input[data-date]")) state.dates[e.target.dataset.date] = e.target.value;
  save(state);
  render();
});
render();
</script>
</body>
</html>
