    night:[['First 2–3 weeks: newborns feed day and night. If the baby sleeps more than 3–4 hours, wake for a feed until birth weight is regained.','पहले 2–3 हफ़्ते: नवजात दिन-रात दूध पीता है। अगर 3–4 घंटे से ज़्यादा सोए तो जन्म का वज़न वापस आने तक जगाकर पिलाएँ।'],
           ['In the next few weeks the baby’s day and night settle: feeds about every 2–3 hours by day and sleeps longer at night.','अगले कुछ हफ़्तों में दिन और रात का पैटर्न बन जाता है: दिन में लगभग हर 2–3 घंटे दूध, रात में लंबी नींद।'],
           ['Once weight gain is good, there is no need to wake the baby at night. Feed when the baby wakes up hungry.','वज़न ठीक बढ़ने लगे तो रात में जगाकर पिलाने की ज़रूरत नहीं। बच्चा भूख से उठे तब पिलाएँ।'],
           ['Help the baby learn day and night: daytime feeds in light and normal noise; night feeds in dim light, quietly, without play.','दिन-रात का फ़र्क सिखाएँ: दिन में रोशनी और सामान्य आवाज़ में; रात में हल्की रोशनी में, चुपचाप, बिना खेले पिलाएँ।']],
    note:['Usually about every 2–3 hours by day and 1–2 feeds at night. If the last feed was 2 or more hours ago and the baby wakes, fusses and keeps sucking hands, feed. Turning the head or sucking movements soon after a feed are a normal reflex, not hunger: burp and cuddle instead of feeding again.','आमतौर पर दिन में लगभग हर 2–3 घंटे, रात में 1–2 बार। अगर पिछली बार दूध पिलाए 2 घंटे या ज़्यादा हो गए हों और बच्चा जागकर बेचैन हो, बार-बार हाथ चूसे, तो पिलाएँ। दूध पिलाने के थोड़ी देर बाद मुँह घुमाना या चूसने जैसी हरकत सामान्य रिफ़्लेक्स है, भूख नहीं: दोबारा पिलाने की बजाय डकार दिलाएँ और गोद में लें।']},
  formula:{h:['Breast milk or formula?','माँ का दूध या फ़ॉर्मूला?'], pts:[
      ['Breast milk is the complete food for the first 6 months. It protects against diarrhoea, pneumonia and ear infections, and lowers the risk of allergy, obesity and diabetes later.','पहले 6 महीने माँ का दूध पूरा आहार है। यह दस्त, निमोनिया और कान के इन्फ़ेक्शन से बचाता है, और आगे चलकर एलर्जी, मोटापे और डायबिटीज़ का ख़तरा कम करता है।'],
      ['It is always ready, clean, at the right temperature and free. It also protects the mother (less bleeding after delivery, lower breast and ovarian cancer risk).','यह हमेशा तैयार, साफ़, सही तापमान पर और मुफ़्त है। माँ को भी फ़ायदा: डिलीवरी के बाद कम खून बहना, स्तन और अंडाशय के कैंसर का ख़तरा कम।'],
      ['Formula is only for exceptional situations, on a doctor’s advice. Talk to your doctor before giving formula or switching from breast milk.','फ़ॉर्मूला सिर्फ़ ख़ास परिस्थितियों में, डॉक्टर की सलाह से। फ़ॉर्मूला देने या माँ का दूध बदलने से पहले डॉक्टर से बात करें।']],
    h2:['Why “one bottle of formula for convenience” is not a good idea','“सुविधा के लिए एक बार फ़ॉर्मूला” अच्छा क्यों नहीं'],
    pts2:[
      ['Less sucking at the breast means the body makes less milk. One bottle a day slowly becomes two, then three.','स्तन पर कम चूसने से दूध कम बनता है। रोज़ एक बोतल धीरे-धीरे दो, फिर तीन हो जाती है।'],
      ['Milk flows easily from a bottle, so many babies start refusing the breast.','बोतल से दूध आसानी से आता है, इसलिए कई बच्चे स्तन से पीना छोड़ने लगते हैं।'],
      ['Formula and bottles bring more diarrhoea and infections, and they cost money every month.','फ़ॉर्मूला और बोतल से दस्त और इन्फ़ेक्शन ज़्यादा होते हैं, और हर महीने ख़र्च होता है।'],
      ['Formula is actually less convenient: boil water, measure powder, mix, cool it, check the temperature, then feed, and wash and sterilise the bottle. The baby keeps crying while you prepare it, and on a cold winter night you will have to get up and do all of this.','फ़ॉर्मूला असल में कम सुविधाजनक है: पानी उबालो, पाउडर नापो, मिलाओ, ठंडा करो, तापमान जाँचो, फिर पिलाओ, और बोतल धोकर उबालो। तैयार करते समय बच्चा रोता रहता है, और सर्दी की रात में उठकर यह सब करना पड़ता है।'],
      ['Breast milk needs none of this: the baby is fed in a minute, even half asleep at night.','माँ के दूध में यह कुछ नहीं करना पड़ता: रात में आधी नींद में भी एक मिनट में बच्चा पी लेता है।']],
    note:['Going out or to a function? Feed just before leaving, carry a light dupatta or nursing cover, or express milk beforehand and store it as shown below. No formula is needed.','बाहर या किसी समारोह में जाना है? निकलने से ठीक पहले पिलाएँ, हल्का दुपट्टा या नर्सिंग कवर साथ रखें, या पहले से दूध निकालकर नीचे बताए तरीके से रख लें। फ़ॉर्मूला की ज़रूरत नहीं।']},
  extra:[
    {h:['Starting breastfeeding','स्तनपान की शुरुआत'], c:'pink', pts:[
      ['Put the baby to the breast within 1 hour of birth, also after caesarean.','जन्म के 1 घंटे के अंदर दूध पिलाना शुरू करें, सिज़ेरियन के बाद भी।'],
      ['The first thick yellow milk (colostrum) is the baby’s first vaccine. Give all of it; never throw it away.','पहला गाढ़ा पीला दूध (खीस) बच्चे का पहला टीका है। पूरा पिलाएँ, कभी फेंकें नहीं।'],
      ['Give nothing before breast milk: no honey, ghutti, janam ghutti, water or tea.','माँ के दूध से पहले कुछ न दें: शहद, घुट्टी, जनम घुट्टी, पानी या चाय नहीं।'],

    {h:['Good attachment: check these 4 signs','सही पकड़: ये 4 संकेत देखें'], c:'grape', pts:[
      ['Baby’s mouth is wide open.','बच्चे का मुँह पूरा खुला हो।'],
      ['Lower lip is turned outwards.','निचला होंठ बाहर की ओर मुड़ा हो।'],
      ['Chin touches the breast.','ठुड्डी स्तन को छू रही हो।'],
      ['More of the dark area (areola) is visible above the mouth than below.','काला हिस्सा (एरिओला) मुँह के ऊपर ज़्यादा और नीचे कम दिखे।'],
      ['Baby’s body is close, facing the mother, head and body in one line. Bring the baby to the breast, not the breast to the baby.','बच्चे का शरीर माँ से सटा हो, चेहरा माँ की ओर, सिर और शरीर एक सीध में। बच्चे को स्तन तक लाएँ, स्तन को बच्चे तक नहीं।'],
      ['Listen: you should hear swallowing (“gut-gut”) every 1–2 sucks once milk flows. A clicking or smacking sound (“puch-puch”) means air is leaking: take the baby off gently and attach again.','सुनें: दूध आने पर हर 1–2 चुस्की में निगलने की आवाज़ (“गट-गट”) आनी चाहिए। “पुच-पुच” जैसी चटकने की आवाज़ का मतलब है हवा जा रही है: बच्चे को धीरे से हटाकर दोबारा सही से लगाएँ।'],
      ['Look at the cheeks: full and rounded while sucking. Cheeks pulled in (dimples) mean the latch is shallow.','गाल देखें: चूसते समय भरे और गोल हों। गाल अंदर धँसें (गड्ढे पड़ें) तो पकड़ ऊपर-ऊपर है।'],
      ['Sucking pattern: quick short sucks at first, then slow deep sucks with pauses. Only quick sucks throughout means little milk is going in.','चूसने का तरीका: पहले तेज़ छोटी चुस्कियाँ, फिर धीमी गहरी चुस्कियाँ रुक-रुककर। पूरे समय सिर्फ़ तेज़ चुस्कियाँ हों तो दूध कम जा रहा है।'],
      ['Feeding should not hurt after the first few sucks. Pain means the latch needs correcting.','शुरू की कुछ चुस्कियों के बाद दर्द नहीं होना चाहिए। दर्द हो तो पकड़ ठीक करें।']]},
    {h:['How to feed','कैसे पिलाएँ'], c:'sky', pts:[
      ['Empty one breast fully before offering the other. The last milk (hind milk) is rich in fat and helps weight gain.','दूसरी तरफ़ देने से पहले एक स्तन पूरा खाली होने दें। आख़िरी दूध (हिंद मिल्क) में चिकनाई ज़्यादा होती है, इससे वज़न बढ़ता है।'],
      ['A feed usually lasts 10–30 minutes. Let the baby finish; do not take the baby off by the clock.','एक बार में आमतौर पर 10–30 मिनट लगते हैं। बच्चे को पूरा पीने दें, घड़ी देखकर न हटाएँ।'],
      ['Next feed: start with the breast you finished on last time.','अगली बार उस स्तन से शुरू करें जिस पर पिछली बार ख़त्म किया था।'],
      ['Burp the baby after each feed, holding upright for 5–10 minutes.','हर बार के बाद बच्चे को 5–10 मिनट सीधा पकड़कर डकार दिलाएँ।'],
      ['Positions: cradle, cross-cradle, football hold (good after caesarean), side-lying (stay awake).','तरीके: गोद में (क्रेडल), क्रॉस-क्रेडल, बगल में (फ़ुटबॉल, सिज़ेरियन के बाद अच्छा), करवट लेकर (जागते रहें)।']]},
    {h:['Is my baby getting enough milk?','क्या बच्चे को दूध काफ़ी मिल रहा है?'], c:'leaf', pts:[
      ['6 or more wet nappies in 24 hours (after day 5), with pale yellow urine.','24 घंटे में 6 या ज़्यादा गीली नैपी (5वें दिन के बाद), पेशाब हल्का पीला।'],
      ['Back to birth weight by 10–14 days. After that, gains about 150–200 g a week in the first 3 months.','10–14 दिन में जन्म का वज़न वापस। उसके बाद पहले 3 महीने हर हफ़्ते लगभग 150–200 ग्राम बढ़े।'],
      ['Baby is alert and settles after most feeds. You can hear swallowing during feeds.','बच्चा चुस्त है और ज़्यादातर बार दूध के बाद शांत हो जाता है। पीते समय निगलने की आवाज़ आती है।'],
      ['Crying, frequent feeding or soft breasts alone do NOT mean low milk.','सिर्फ़ रोना, बार-बार पीना या स्तन नरम होना कम दूध का सबूत नहीं है।'],
      ['Growth spurts at about 2–3 weeks, 6 weeks and 3 months: the baby feeds more often for 2–3 days. Keep feeding; supply catches up.','लगभग 2–3 हफ़्ते, 6 हफ़्ते और 3 महीने पर बच्चा 2–3 दिन ज़्यादा बार पीता है। पिलाते रहें, दूध अपने आप बढ़ेगा।']]},
    {h:['Cluster feeding: baby wants to feed again and again','क्लस्टर फ़ीडिंग: बच्चा बार-बार दूध माँगे'], c:'pink', pts:[
      ['Some evenings the baby feeds every 30–60 minutes for 2–4 hours. This is called cluster feeding and is normal, especially in the first weeks and during growth spurts.','कुछ शामों को बच्चा 2–4 घंटे तक हर 30–60 मिनट पर दूध माँगता है। इसे क्लस्टर फ़ीडिंग कहते हैं; यह सामान्य है, ख़ासकर शुरू के हफ़्तों में और तेज़ बढ़त के समय।'],
      ['It does NOT mean low milk. It increases your supply for the coming days.','इसका मतलब कम दूध नहीं है। इससे अगले दिनों के लिए दूध बढ़ता है।'],
      ['Check the attachment again at every feed (see the signs above): wide mouth, chin on breast, “gut-gut” swallowing, no “puch-puch” sound, rounded cheeks. A shallow latch makes feeds long and frequent.','हर बार पकड़ फिर से जाँचें (ऊपर के संकेत): मुँह पूरा खुला, ठुड्डी स्तन पर, “गट-गट” निगलना, “पुच-पुच” आवाज़ नहीं, गाल गोल। गलत पकड़ से बच्चा देर तक और बार-बार पीता है।'],
      ['Keep feeding on demand. Do not start formula or a bottle because of it.','भूख के हिसाब से पिलाते रहें। इस वजह से फ़ॉर्मूला या बोतल शुरू न करें।'],
      ['It usually settles in 2–3 days. Rest during the day, keep water nearby, and let family handle other work.','आमतौर पर 2–3 दिन में ठीक हो जाता है। दिन में आराम करें, पानी पास रखें, बाकी काम परिवार संभाले।'],
      ['See the doctor if the baby also has fewer wet nappies, poor weight gain, or seems unwell.','अगर साथ में गीली नैपी कम हों, वज़न न बढ़े या बच्चा बीमार लगे तो डॉक्टर को दिखाएँ।']]},
    {h:['Mother’s food and care','माँ का खाना और देखभाल'], c:'teal', pts:[
      ['Eat normal home food plus one extra meal a day (for example dal-roti or khichdi with curd).','घर का सामान्य खाना और दिन में एक बार अतिरिक्त खाना (जैसे दाल-रोटी या दही के साथ खिचड़ी)।'],
      ['Drink water whenever thirsty; keep a glass of water near you while feeding. About 3 litres of fluids a day.','प्यास लगे तब पानी पिएँ; पिलाते समय पास में पानी रखें। दिन में लगभग 3 लीटर।'],
      ['No food needs to be avoided routinely. Special foods (panjiri, gond laddoo) are optional, not needed for milk.','आमतौर पर कोई खाना बंद करने की ज़रूरत नहीं। पंजीरी, गोंद के लड्डू ज़रूरी नहीं हैं, दूध इनसे नहीं बढ़ता।'],
      ['Continue iron and calcium tablets for 6 months after delivery.','डिलीवरी के बाद 6 महीने आयरन और कैल्शियम की गोली जारी रखें।'],
      ['Most medicines are safe while breastfeeding. Ask your doctor before stopping breastfeeding for any medicine.','ज़्यादातर दवाइयाँ स्तनपान में सुरक्षित हैं। किसी दवा के लिए दूध बंद करने से पहले डॉक्टर से पूछें।'],
      ['Rest when the baby sleeps. Family can help with everything except the feed itself.','बच्चा सोए तब आराम करें। दूध पिलाने के अलावा बाकी काम में परिवार मदद करे।']]},
    {h:['Expressing and storing milk (work, travel, functions)','दूध निकालना और रखना (नौकरी, सफ़र, समारोह)'], c:'orange', pts:[
      ['Start expressing (by hand or pump) 2 weeks before rejoining work. Express as often as the baby would feed.','काम पर लौटने से 2 हफ़्ते पहले दूध निकालना (हाथ या पंप से) शुरू करें। उतनी बार निकालें जितनी बार बच्चा पीता।'],
      ['Store in a clean, covered steel or glass container: room temperature up to 4 hours, fridge up to 4 days, freezer up to 6 months.','साफ़, ढके स्टील या काँच के बर्तन में रखें: कमरे के तापमान पर 4 घंटे, फ्रिज में 4 दिन, फ़्रीज़र में 6 महीने।'],
      ['Warm by keeping the container in a bowl of warm water. Never boil or microwave. Do not refreeze.','बर्तन को गुनगुने पानी के कटोरे में रखकर गरम करें। उबालें या माइक्रोवेव न करें। दोबारा फ़्रीज़ न करें।'],

    {h:['Common problems','आम परेशानियाँ'], c:'red', pts:[
      ['Sore or cracked nipples: correct the latch, apply a few drops of your own milk after feeds and let it air-dry.','निपल में दर्द या दरार: पकड़ ठीक करें, दूध के बाद अपने दूध की कुछ बूँदें लगाकर हवा में सूखने दें।'],
      ['Hard, heavy breasts (engorgement): feed more often, warm compress before and cold compress after feeds, express a little to soften.','स्तन भारी और सख्त: बार-बार पिलाएँ, पिलाने से पहले गुनगुनी और बाद में ठंडी सिकाई करें, थोड़ा दूध निकालकर नरम करें।'],
      ['Painful lump: keep feeding from that side, massage gently towards the nipple.','दर्द वाली गाँठ: उसी तरफ़ से पिलाते रहें, निपल की ओर हल्की मालिश करें।'],
      ['Red, hot, painful area with fever: see a doctor. Usually you can and should continue breastfeeding.','लाल, गरम, दर्द वाला हिस्सा और बुख़ार: डॉक्टर को दिखाएँ। आमतौर पर स्तनपान जारी रखना चाहिए।'],

  ok:[['Exclusive breastfeeding for 6 months: breast milk has all the water the baby needs, even in summer.','6 महीने सिर्फ़ माँ का दूध: इसमें बच्चे की ज़रूरत का पूरा पानी है, गर्मी में भी।'],['Hold the baby skin-to-skin often.','बच्चे को बार-बार त्वचा से त्वचा लगाकर रखें।'],['Give vitamin D drops daily if your doctor has advised.','डॉक्टर ने कहा हो तो रोज़ विटामिन D की ड्रॉप दें।'],['If your doctor advises formula, measure it exactly as advised and give it with katori-spoon or paladai.','अगर डॉक्टर फ़ॉर्मूला की सलाह दें तो बताए नाप से बनाएँ और कटोरी-चम्मच या पलाड़ी से दें।']],
  no:[['No water, gripe water, ghutti, honey, glucose water or tea.','पानी, ग्राइप वॉटर, घुट्टी, शहद, ग्लूकोज़ पानी या चाय नहीं।'],['No bottle or pacifier, especially in the first month.','बोतल या चुसनी नहीं, ख़ासकर पहले महीने में।'],['No cow or buffalo milk. No formula without your doctor’s advice, not even “one feed for convenience”.','गाय/भैंस का दूध नहीं। डॉक्टर की सलाह के बिना फ़ॉर्मूला नहीं, “सुविधा के लिए एक बार” भी नहीं।'],['Don’t start any food before 6 months.','6 महीने से पहले कोई खाना शुरू न करें।']],
  doc:[['Fewer than 6 wet nappies a day after day 5.','5वें दिन के बाद रोज़ 6 से कम गीली नैपी।'],['Not back to birth weight by 2 weeks, or poor weight gain.','2 हफ़्ते तक जन्म का वज़न वापस नहीं, या वज़न ठीक से नहीं बढ़ रहा।'],['Yellow eyes or skin with poor feeding.','आँखें या त्वचा पीली और बच्चा ठीक से नहीं पी रहा।'],['Mother has breast pain with fever, or feeding is painful throughout.','माँ को स्तन में दर्द के साथ बुख़ार, या पूरे समय पिलाने में दर्द।']],
  er:[['Baby is very sleepy, floppy or not feeding at all.','बच्चा बहुत सुस्त, ढीला या बिल्कुल नहीं पी रहा।'],['Fever 100.4 °F (38 °C) or more in a baby under 3 months.','3 महीने से छोटे बच्चे को 100.4 °F (38 °C) या ज़्यादा बुख़ार।'],['Breathing difficulty, blue lips, or green or repeated forceful vomiting.','साँस में दिक्कत, नीले होंठ, या हरी या बार-बार ज़ोर से उल्टी।']]

  rules:[['Every milk feed counts as one meal (breast milk, formula or other milk).','हर बार का दूध एक “खाना” गिना जाता है (माँ का दूध, फ़ॉर्मूला या दूसरा दूध)।'],['Total 7 meals a day. As semisolids increase, milk feeds reduce.','दिन में कुल 7 खाने। ठोस बढ़ने पर दूध की बारी कम होती है।'],['Day: 2–3 hours between any two meals. Nothing in between.','दिन में दो खानों के बीच 2–3 घंटे। बीच में कुछ नहीं।'],['Night: 6–7 hours between meals. Don’t feed every time the baby wakes; try patting and sips of water first.','रात में 6–7 घंटे का अंतर। हर बार उठने पर न पिलाएँ; पहले थपकी और पानी के घूँट दें।'],['Thick, not watery: the food should stay on a tilted spoon. Dal water and soups are not enough.','गाढ़ा, पानी जैसा नहीं: झुकी चम्मच पर टिके। दाल का पानी या सूप काफ़ी नहीं।'],['Add 1 tsp ghee or oil to each semisolid meal.','हर ठोस खाने में 1 छोटी चम्मच घी या तेल डालें।']],

  foods:[{n:['Breakfast (never skip)','नाश्ता (कभी न छोड़ें)'],e:['Paratha with dahi, vegetable poha or upma, moong or besan chilla, dalia, idli-sambhar','दही के साथ पराठा, सब्ज़ी पोहा या उपमा, मूँग या बेसन चीला, दलिया, इडली-सांभर']},
         {n:['School tiffin','स्कूल टिफ़िन'],e:['Paneer or vegetable roll, stuffed paratha, vegetable sandwich, chana chaat, fruit','पनीर या सब्ज़ी रोल, भरवाँ पराठा, सब्ज़ी सैंडविच, चना चाट, फल']},
         {n:['Lunch and dinner','दोपहर और रात'],e:['Roti or rice + dal or rajma or chana + sabzi + salad + dahi','रोटी या चावल + दाल या राजमा या चना + सब्ज़ी + सलाद + दही']},
         {n:['Snacks','नाश्ते'],e:['Fruit, roasted chana or makhana, sprouts chaat, peanuts (after 4 years), homemade dhokla','फल, भुने चने या मखाने, अंकुरित चाट, मूँगफली (4 साल के बाद), घर का ढोकला']},
         {n:['Egg','अंडा'],e:['1 egg a day: boiled, omelette, egg roll','रोज़ 1 अंडा: उबला, ऑमलेट, एग रोल'],tag:'egg'},
         {n:['Chicken, fish, mutton','चिकन, मछली, मटन'],e:['2–3 times a week, home-cooked; grilled or curry rather than fried','हफ़्ते में 2–3 बार, घर का बना; तला हुआ नहीं, ग्रिल या करी'],tag:'nv'}],
  rules:[['Fixed meal and snack times. Nothing except water in between.','खाने और नाश्ते का तय समय। बीच में पानी के अलावा कुछ नहीं।'],['Parents decide what, when and where. The child decides how much.','क्या, कब और कहाँ — माता-पिता तय करें। कितना — बच्चा तय करे।'],['Iron foods daily: green leafy vegetables, dal, chana, rajma, ragi; plus egg or meat if eaten. Fruit after meals helps iron absorption.','रोज़ आयरन वाला खाना: हरी पत्तेदार सब्ज़ी, दाल, चना, राजमा, रागी; और अंडा या मांस अगर खाते हैं। खाने के बाद फल आयरन लगने में मदद करता है।'],['Teenagers: protein at every meal, calcium (dairy, ragi, til) daily; girls need extra iron after periods start.','किशोर: हर खाने में प्रोटीन, रोज़ कैल्शियम (दूध की चीज़ें, रागी, तिल); पीरियड शुरू होने के बाद लड़कियों को ज़्यादा आयरन चाहिए।']],
  ok:[['Eat at least one meal a day together as a family, without screens.','दिन में कम से कम एक बार परिवार साथ बैठकर, बिना स्क्रीन के खाए।'],['Keep fruit and roasted chana at home instead of packets.','घर में पैकेट की जगह फल और भुने चने रखें।'],['Involve children in choosing vegetables and simple cooking.','सब्ज़ी चुनने और आसान खाना बनाने में बच्चों को शामिल करें।'],['Sleep: 10–13 hours (2–5 y), 9–12 hours (6–12 y), 8–10 hours (teens).','नींद: 10–13 घंटे (2–5 साल), 9–12 घंटे (6–12 साल), 8–10 घंटे (किशोर)।']],
  no:[['No bottle at this age. If the child still uses one, stop it now using the 1–2 years steps.','इस उम्र में बोतल नहीं। अगर अब भी चलती है तो 1–2 साल वाले तरीके से अभी छुड़ाएँ।'],['Outside or junk food (pizza, burger, chips, noodles) at most once a week.','बाहर का या जंक फ़ूड (पिज़्ज़ा, बर्गर, चिप्स, नूडल्स) हफ़्ते में अधिक से अधिक एक बार।'],['No cold drinks, packet juice or energy drinks; plain water is the drink.','कोल्ड ड्रिंक, पैकेट जूस या एनर्जी ड्रिंक नहीं; पीने के लिए सादा पानी।'],['Sweets small and occasional, not daily. No food as a reward or punishment.','मिठाई कम और कभी-कभी, रोज़ नहीं। खाने को इनाम या सज़ा न बनाएँ।'],['Teenagers: no protein powder or supplements without a doctor’s advice; no crash diets.','किशोर: डॉक्टर की सलाह के बिना प्रोटीन पाउडर या सप्लीमेंट नहीं; अचानक डाइटिंग नहीं।']],
  doc:[['Not gaining height or weight for 6 months, or gaining weight very fast.','6 महीने से लंबाई या वज़न नहीं बढ़ा, या वज़न बहुत तेज़ी से बढ़ रहा है।'],['Pale, tired, poor concentration.','पीलापन, थकान, ध्यान न लगना।'],['Eats only a few foods, or gags on most textures.','सिर्फ़ गिनी-चुनी चीज़ें खाता है, या ज़्यादातर खाने पर उबकाई।'],['Teen: skipping meals, fear of gaining weight, vomiting after meals, or excessive exercise.','किशोर: खाना छोड़ना, वज़न बढ़ने का डर, खाने के बाद उल्टी, या बहुत ज़्यादा कसरत।']],
  er:[['Swelling of lips or face, or breathing difficulty after a food.','खाने के बाद होंठ या चेहरा सूजे, या साँस में दिक्कत।'],['Choking: cannot speak, cough or breathe.','गले में कुछ फँसा: बोल, खाँस या साँस न ले पाए।']]
};

/* ---------- state */
var st = {age:'m6', step:'s6', diet:'veg'};
try{ var sv = JSON.parse(localStorage.getItem('dietGuide')||'{}'); Object.assign(st, sv); }catch(e){}
try{ var qa = new URLSearchParams(location.search).get('age'); if(qa && ['m0','m6','y1','y2'].indexOf(qa)>=0) st.age = qa; }catch(e){}
try{ L = localStorage.getItem('preferredClinicLang')==='hi' ? 'hi' : 'en'; }catch(e){}
function save(){ try{ localStorage.setItem('dietGuide', JSON.stringify(st)); localStorage.setItem('preferredClinicLang', L); }catch(e){} }

function showItem(tag){ if(!tag) return true; if(tag==='egg') return st.diet!=='veg'; if(tag==='nv') return st.diet==='nv'; return true; }
function tagHtml(tag){ return tag ? '<span class="tag '+tag+'">'+t(UI[tag==='egg'?'eggTag':'nvTag'])+'</span>' : ''; }
function ul(list, cls){ return '<ul class="pts '+cls+'">'+list.map(function(x){ return '<li><span>'+esc(t(x))+'</span></li>'; }).join('')+'</ul>'; }
function sec(n, title, inner, c){ return '<section class="sec" style="--c:var(--'+(c||'indigo')+')"><h2><span class="n">'+n+'</span>'+esc(t(title))+'</h2>'+inner+'</section>'; }
function glance(g){ return '<div class="glance">'+g.map(function(x){ return '<div class="gl" style="--c:var(--'+x[3]+');--soft:var(--'+x[3]+'-soft)"><b>'+esc(x[0])+'</b><span>'+esc(L==='hi'?x[2]:x[1])+'</span></div>'; }).join('')+'</div>'; }
function timeline(items){
  return '<div class="tl">'+items.map(function(x){ var lab = x[2] ? t(x[2]) : x[1]==='M' ? t(UI.milk) : x[1]==='S' ? t(UI.semi) : t(UI.sleep); return '<div class="'+x[1]+'"><b>'+esc(x[0])+'</b><span>'+esc(lab)+'</span></div>'; }).join('')+'</div>'+
    '<div class="legend"><span><i style="background:var(--sky-soft);border-color:#2f8fe0"></i>'+esc(t(UI.legM))+'</span><span><i style="background:var(--orange-soft);border-color:#f08a1c"></i>'+esc(t(UI.legS))+'</span></div>';
}
function foods(list){ return '<div class="cards">'+list.filter(function(f){ return showItem(f.tag); }).map(function(f){ return '<div class="card"><b>'+esc(t(f.n))+tagHtml(f.tag)+'</b><p>'+esc(t(f.e))+'</p></div>'; }).join('')+'</div>'; }
function dodont(d){ return '<div class="two"><div class="box" style="--c:var(--leaf);--soft:var(--leaf-soft)"><h3>'+esc(t(UI.doDo))+'</h3>'+ul(d.ok,'ok')+'</div><div class="box" style="--c:var(--red);--soft:var(--red-soft)"><h3>'+esc(t(UI.doDont))+'</h3>'+ul(d.no,'no')+'</div></div>'; }
function doctor(d){ return '<div class="two"><div class="box" style="--c:var(--grape);--soft:var(--grape-soft)"><h3>'+esc(t(UI.seeDoc))+'</h3>'+ul(d.doc,'dot')+'</div><div class="box" style="--c:var(--red);--soft:var(--red-soft)"><h3>'+esc(t(UI.er))+'</h3>'+ul(d.er,'warn')+'</div></div>'; }
function groupsBlock(){
  return '<div class="fg">'+GROUPS.filter(function(g){ return showItem(g.tag); }).map(function(g){ return '<div style="--c:'+g.c+';--s:'+g.s+'"><b>'+esc(t(g.n))+tagHtml(g.tag)+'</b><p>'+esc(t(g.e))+'</p></div>'; }).join('')+'</div>';
}
function mealsTable(){
  var rows=[['s6','2','5',['10–15 ml → 50–60 ml','10–15 ml → 50–60 ml'],['Thick, smooth mash','गाढ़ा, मसला']],['s7','3','4',['60–125 ml','60–125 ml'],['Mashed with soft lumps','मसला, नरम टुकड़ों के साथ']],['s9','4','3',['about 125 ml','लगभग 125 ml'],['Finely chopped','बारीक कटा']]];
  return '<table><tr><th>'+esc(t(UI.lblAge))+'</th><th>'+esc(t(UI.semi))+'</th><th>'+esc(t(UI.milk))+'</th><th>'+esc(t(UI.how))+'</th></tr>'+rows.map(function(r){ var s=STEPS.filter(function(x){return x.id===r[0];})[0]; return '<tr'+(r[0]===st.step?' style="background:var(--orange-soft)"':'')+'><td><b>'+esc(t(s.l))+'</b></td><td><span class="chip S">'+r[1]+'</span></td><td><span class="chip M">'+r[2]+'</span></td><td>'+'<b>'+esc(t(r[3]))+'</b><br><small style="color:var(--muted)">'+esc(t(r[4]))+'</small></td></tr>'; }).join('')+'</table>';
}

function render(){
  document.documentElement.lang = L; document.documentElement.setAttribute('data-lang', L);
  document.getElementById('title').textContent = t(UI.title);
  document.getElementById('intro').textContent = t(UI.intro);
  document.getElementById('sub').textContent = t(UI.sub);
  document.getElementById('lblAge').textContent = t(UI.lblAge);
  document.getElementById('print').textContent = t(UI.print);
  document.getElementById('pfText').textContent = t(UI.pfoot);
  var ag = AGES.filter(function(x){return x.id===st.age;})[0], stp = STEPS.filter(function(x){return x.id===st.step;})[0];
  document.getElementById('printAge').textContent = (L==='hi'?'उम्र: ':'Age: ')+(st.age==='m6'? t(stp.l) : t(ag.name))+(st.age==='m0'?'':' · '+t(UI[st.diet]));
  document.querySelectorAll('.langs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===L)); });
  document.getElementById('ages').innerHTML = AGES.map(function(a){ return '<button type="button" class="age" data-age="'+a.id+'" aria-pressed="'+(a.id===st.age)+'" style="--c:var(--'+a.c+');--c-soft:var(--'+a.c+'-soft)"><b>'+esc(t(a.name))+'</b><small>'+esc(t(a.sub))+'</small></button>'; }).join('');
  var stepsEl = document.getElementById('steps');
  stepsEl.hidden = st.age!=='m6';
  stepsEl.innerHTML = STEPS.map(function(s){ return '<button type="button" data-step="'+s.id+'" aria-pressed="'+(s.id===st.step)+'">'+esc(t(s.l))+'</button>'; }).join('');
  var dietEl = document.getElementById('diet');
  dietEl.hidden = st.age==='m0';
  dietEl.innerHTML = ['veg','egg','nv'].map(function(d){ return '<button type="button" data-diet="'+d+'" aria-pressed="'+(d===st.diet)+'">'+esc(t(UI[d]))+'</button>'; }).join('');

  var o = '', n = 1, a = AGES.filter(function(x){return x.id===st.age;})[0];
  if(st.age==='m0'){
    var d = C.m0;
    o += sec(n++, UI.glance, glance(d.glance), a.c);
    o += sec(n++, ['When to feed','कब पिलाएँ'], ul([d.day.note].concat(d.day.night),'dot'), 'sky');
    o += sec(n++, d.formula.h, ul(d.formula.pts,'dot')+'<h3>'+esc(t(d.formula.h2))+'</h3>'+ul(d.formula.pts2,'no')+'<p class="note">'+esc(t(d.formula.note))+'</p>', 'grape');
    d.extra.forEach(function(x){ o += sec(n++, x.h, ul(x.pts,'dot'), x.c); });
    o += sec(n++, UI.dont, dodont(d), 'leaf');
    o += sec(n++, UI.doc, doctor(d), 'red');
  } else if(st.age==='m6'){
    var d = C.m6, s = d.steps[st.step];
    o += sec(n++, UI.glance, glance(s.glance)+'<div class="note">'+ul(d.rules,'dot')+'</div>', a.c);
    o += sec(n++, UI.day, timeline(SCHED[st.step])+'<p class="note">'+esc(t(UI.shift))+'</p>', 'sky');
    o += sec(n++, UI.what, foods(s.foods)+'<h3>'+esc(t(UI.groups))+'</h3>'+groupsBlock()+'<p class="note">'+esc(t(UI.jain))+'</p>', 'teal');
    o += sec(n++, UI.how, mealsTable()+'<p class="note" style="background:var(--leaf-soft)">'+esc(t(UI.appetite))+'</p><p class="note">'+esc(t(UI.katori))+'</p><a class="pdfdl noprint" href="/parent-tools/complementary-feeding-guide.pdf" download>'+esc(t(UI.pdf))+'</a>', 'orange');
    o += sec(n++, d.milkHabit.h, ul(d.milkHabit.pts,'dot'), 'grape');
    o += sec(n++, UI.dont, dodont(d)+'<h3>'+esc(L==='hi'?'गले में फँसने से बचाव':'Prevent choking')+'</h3>'+ul(CHOKING,'warn'), 'leaf');
    o += sec(n++, UI.doc, doctor(d), 'red');
  } else if(st.age==='y1'){
    var d = C.y1;
    o += sec(n++, UI.glance, glance(d.glance)+'<div class="note">'+ul(d.rules,'dot')+'</div>', a.c);
    o += sec(n++, UI.day, timeline(SCHED.y1)+'<p class="note">'+esc(t(UI.shift))+'</p>', 'sky');
    o += sec(n++, UI.what, foods(d.foods)+'<h3>'+esc(t(UI.groups))+'</h3>'+groupsBlock()+'<p class="note">'+esc(t(UI.jain))+'</p>', 'teal');
    o += sec(n++, UI.how, '<p>'+esc(L==='hi'?'हर खाने में 150–250 ml (¾ से 1 कटोरी)। नाश्ते में ½ कटोरी या 1 फल।':'150–250 ml per meal (¾ to 1 katori). Snack: ½ katori or 1 fruit.')+'</p><p class="note" style="background:var(--leaf-soft)">'+esc(t(UI.appetite))+'</p><p class="note">'+esc(t(UI.katori))+'</p><a class="pdfdl noprint" href="/parent-tools/complementary-feeding-guide.pdf" download>'+esc(t(UI.pdf))+'</a>', 'orange');
    o += sec(n++, d.milkHabit.h, ul(d.milkHabit.pts,'dot'), 'grape');
    o += sec(n++, UI.dont, dodont(d)+'<h3>'+esc(L==='hi'?'गले में फँसने से बचाव':'Prevent choking')+'</h3>'+ul(CHOKING,'warn'), 'leaf');
    o += sec(n++, UI.doc, doctor(d), 'red');
  } else {
    var d = C.y2;
    o += sec(n++, UI.glance, glance(d.glance)+'<div class="plate" style="margin-top:12px"><div style="--c:var(--leaf);--s:var(--leaf-soft)"><b>½</b><span>'+esc(L==='hi'?'सब्ज़ी + फल':'Vegetables + fruit')+'</span></div><div style="--c:#b07a10;--s:var(--sun-soft)"><b>¼</b><span>'+esc(L==='hi'?'रोटी / चावल':'Roti / rice')+'</span></div><div style="--c:var(--pink);--s:var(--pink-soft)"><b>¼</b><span>'+esc(L==='hi'?'दाल / पनीर / अंडा / मांस':'Dal / paneer / egg / meat')+'</span></div></div><div class="note">'+ul(d.rules,'dot')+'</div>', a.c);
    o += sec(n++, UI.day, timeline(SCHED.y2)+'<p class="note">'+esc(t(UI.shift))+'</p>', 'sky');
    o += sec(n++, UI.what, foods(d.foods)+'<h3>'+esc(t(UI.groups))+'</h3>'+groupsBlock().replace(/<div style="--c:#8b4fd6[\s\S]*?<\/div>/,'')+'<p class="note">'+esc(t(UI.jain))+'</p>', 'teal');
    o += sec(n++, ['Healthy recipes to make at home','घर पर बनाने वाली सेहतमंद रेसिपी'], '<div class="cards">'+d.recipes.filter(function(r){ return showItem(r.tag); }).map(function(r){ return '<div class="card"><b>'+esc(t(r.n))+tagHtml(r.tag)+'</b><p><b style="display:inline;font-size:15px">'+esc(L==='hi'?'सामग्री: ':'You need: ')+'</b>'+esc(t(r.i))+'</p><p style="margin-top:6px">'+esc(t(r.s))+'</p></div>'; }).join('')+'</div>', 'pink');
    o += sec(n++, UI.how, '<table><tr>'+d.table.head.map(function(h){ return '<th>'+esc(t(h))+'</th>'; }).join('')+'</tr>'+d.table.rows.map(function(r){ return '<tr>'+r.map(function(c,i){ return i? '<td>'+esc(t(c))+'</td>' : '<td><b>'+esc(t(c))+'</b></td>'; }).join('')+'</tr>'; }).join('')+'</table><p class="note" style="background:var(--leaf-soft)">'+esc(t(UI.appetite))+'</p><p class="note">'+esc(t(d.table.note))+'</p>', 'orange');
    o += sec(n++, UI.dont, dodont(d), 'leaf');
    o += sec(n++, UI.doc, doctor(d), 'red');
  }
  o += '<p class="foot">'+esc(t(UI.foot))+'</p>';
  document.getElementById('out').innerHTML = o;
}

document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang){ L = b.dataset.lang; save(); render(); return; }
  if(b.dataset.age){ st.age = b.dataset.age; save(); render(); document.getElementById('out').scrollIntoView({behavior:'smooth', block:'start'}); if(typeof gtag==='function') gtag('event','diet_age',{age:st.age}); return; }
  if(b.dataset.step){ st.step = b.dataset.step; save(); render(); return; }
  if(b.dataset.diet){ st.diet = b.dataset.diet; save(); render(); return; }
  if(b.id==='print'){ window.print(); return; }
});
render();
})();
</script>
</body>
</html>
