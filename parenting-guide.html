  hi:{t:"खाने के इनाम में मिठाई या चॉकलेट", s:"खाना खाना हमारा रोज़ का काम है। मिठाई कभी-कभी की चीज़ है, खाने का इनाम नहीं।", d:"खाने या अच्छे व्यवहार के बदले मिठाई, चॉकलेट या फोन न दें।", e:"इनाम देने से बच्चा भूख की बजाय इनाम के पीछे भागने लगता है।", b:"अच्छे व्यवहार पर स्टिकर, पार्क की सैर या पसंदीदा गाना जैसे इनाम दें। मिठाई कभी-कभार की रखें।", x:""}},
 {a:0,g:1,en:{t:"Bedtime battle", s:"It is time to sleep. One book, then lights off. I will be here.", d:"Do not change the routine every night, and do not give 'one more story' again and again.", e:"Use the same order every night. Most toddlers settle within one to two weeks.", b:"Keep the same order every night: bath, dinner, one book, bed. Give a 5-minute warning before the routine ends, and praise the calm bedtime itself.", x:""},
  hi:{t:"सोने के समय का झगड़ा", s:"सोने का समय है। एक किताब, फिर लाइट बंद। मैं यहीं हूँ।", d:"रोज़ नया नियम न बनाएँ। 'बस एक और कहानी' बार-बार न मानें।", e:"हर रात एक ही क्रम रखें। एक-दो हफ़्ते में ज़्यादातर बच्चे सीख जाते हैं।", b:"रोज़ एक ही क्रम रखें: नहाना, खाना, एक किताब, फिर बिस्तर। रूटीन खत्म होने से 5 मिनट पहले बताएँ, और शांत सोने की तारीफ़ करें।", x:""}},
 {a:0,g:1,en:{t:"Waking at night and calling for you", s:"It is night. Let's go back to bed. I love you. Good night.", d:"Do not start TV or play at night. Avoid habits you will later find hard to stop.", e:"A night light, the same bedtime, and a calm room help. Short, boring responses work best.", b:"Check first that he is not hungry, too hot, or uncomfortable. Keep night visits brief and quiet, give the same response each time, and praise good sleep in the morning.", x:""},
  hi:{t:"रात में बार-बार जागना और बुलाना", s:"रात है। चलो सोते हैं। मैं तुमसे प्यार करता हूँ। शुभ रात्रि।", d:"रात में टीवी या खेल शुरू न करें। ऐसी आदत न डालें जो बाद में छुड़ाना मुश्किल हो।", e:"नाइट लाइट, सोने का एक ही समय और शांत कमरा मदद करते हैं। छोटे और सीधे जवाब सबसे अच्छे रहते हैं।", b:"पहले देखें कि बच्चा भूखा, ज़्यादा गर्म या परेशान तो नहीं। रात में छोटी, शांत और एक जैसी प्रतिक्रिया दें। सुबह अच्छी नींद की तारीफ़ करें।", x:""}},
 {a:0,g:1,en:{t:"Demanding phone or TV all day", s:"The phone is for later. Let's look at the window, or build a tower with blocks.", d:"Do not give the phone to stop crying, to feed, or to keep the child quiet.", e:"AAP advice: no screens under 18 months except video calls; 18 to 24 months only with a parent; 2 to 5 years about 1 hour a day of good programmes.", b:"Set screen times in advance and use a visible timer. Offer an activity you do together, like drawing or a song. Keep your own phone away at meals so he sees the example.", x:""},
  hi:{t:"दिन भर फोन या टीवी की ज़िद", s:"फोन बाद में। अभी खिलौने से टावर बनाओ, या खिड़की से बाहर देखो।", d:"रोना बंद करने, खाना खिलाने या चुप कराने के लिए फोन न दें।", e:"AAP की सलाह: 18 महीने तक स्क्रीन नहीं (सिर्फ़ वीडियो कॉल)। 18 से 24 महीने में माता-पिता के साथ अच्छा कंटेंट। 2 से 5 साल में रोज़ लगभग 1 घंटा।", b:"स्क्रीन का समय पहले तय करें और दिखने वाला टाइमर रखें। साथ मिलकर कोई खेल दें, जैसे चित्र बनाना या गाना। खाने के समय अपना फोन भी दूर रखें।", x:""}},
 {a:0,g:1,en:{t:"Toilet training", s:"Let's sit on the potty for a short time. Well done!", d:"Do not scold or punish accidents. Do not start until the child shows readiness.", e:"Most children are ready around 2 to 3 years. Accidents are part of learning.", b:"Use a potty book or show with a doll. Keep the potty where it is easy to reach, dress him in easy clothes, and praise effort, not only success.", x:"Pain while passing stool, blood in stool, or holding stool for many days."},
  hi:{t:"टॉयलेट ट्रेनिंग", s:"चलो, थोड़ी देर पॉटी पर बैठें। शाबाश!", d:"गलती पर डाँटें या सज़ा न दें। बच्चा तैयार न हो तो शुरू न करें।", e:"ज़्यादातर बच्चे लगभग 2 से 3 साल में तैयार होते हैं। गलतियाँ सीखने का हिस्सा हैं।", b:"पॉटी की कहानी की किताब या गुड़िया से दिखाएँ। पॉटी आसानी से पहुँचने वाली जगह पर रखें, आसान कपड़े पहनाएँ। सिर्फ़ सफलता नहीं, कोशिश की भी तारीफ़ करें।", x:"मल त्यागते समय दर्द, मल में खून, या कई दिन तक मल रोकना।"}},
 {a:0,g:1,en:{t:"Crying when parent leaves for crèche or school", s:"I am going now. I will pick you up after lunch. Bye, see you!", d:"Do not sneak away. Do not keep coming back to the child.", e:"Crying at the door can last several days or weeks. It usually settles soon after the parent leaves.", b:"Practise short separations at home, like leaving the room for a minute. Send a comfort object from home, and use the same goodbye words every day.", x:""},
  hi:{t:"क्रेच या स्कूल में छोड़ते समय रोना", s:"बाय! खाने के बाद लेने आएँगे। मिलते हैं।", d:"चुपके से न जाएँ। बार-बार लौटकर वापस न आएँ।", e:"दरवाज़े पर रोना कुछ दिनों या हफ़्तों तक चल सकता है। अक्सर माता-पिता के जाने के बाद बच्चा संभल जाता है।", b:"घर पर छोटी देर के लिए कमरे से बाहर जाने का अभ्यास करें। घर से कोई पसंदीदा चीज़ साथ दें। हर दिन एक ही विदाई के शब्द बोलें।", x:""}},
 {a:0,g:2,en:{t:"Tantrum in a shop or market", s:"Shopping is over for today. Hold my hand, we are going home.", d:"Do not buy the thing to stop the crying. Do not argue in front of people.", e:"Before going out, say 'We will buy one thing today' and give a simple choice. If needed, carry the child calmly.", b:"Plan a short trip after a nap and a meal. Say the rule before you enter, and praise him straight away when he waits well.", x:""},
  hi:{t:"बाज़ार या दुकान में ज़िद और रोना", s:"आज बाज़ार खत्म। मेरा हाथ पकड़ो, घर चलते हैं।", d:"रोना रोकने के लिए चीज़ न खरीदें। सबके सामने बहस न करें।", e:"बाहर जाने से पहले बताएँ: 'आज एक चीज़ मिलेगी।' ज़रूरत हो तो बच्चे को शांति से गोद में उठाएँ।", b:"नींद और खाने के बाद, छोटे समय के लिए जाएँ। अंदर जाने से पहले नियम बताएँ। अच्छे से इंतज़ार करने पर तुरंत तारीफ़ करें।", x:""}},
 {a:0,g:2,en:{t:"Relatives say 'just give it, he will stop'", s:"Thank you. At home we keep one rule, and he is learning it well.", d:"Do not break the rule just to keep relatives happy.", e:"Parents agree on one rule first, then tell relatives calmly and kindly.", b:"Agree on the rule as a couple first. Keep one short sentence ready for relatives, thank them for their love, and ask for their help with the rule.", x:""},
  hi:{t:"रिश्तेदार कहें 'दे दो, चुप हो जाएगा'", s:"धन्यवाद। घर पर हम एक ही नियम रखते हैं। वह धीरे-धीरे समझ रहा है।", d:"रिश्तेदारों को खुश करने के लिए नियम न तोड़ें।", e:"माता-पिता पहले एक नियम तय करें। फिर रिश्तेदारों को शांत और प्यार भरी भाषा में बताएँ।", b:"नियम पर पति-पत्नी पहले एकमत हों। रिश्तेदारों के लिए एक छोटा वाक्य पहले से तय रखें। उनके प्यार का धन्यवाद करें और नियम में साथ माँगें।", x:""}},
 {a:0,g:2,en:{t:"Grandparents follow different rules", s:"We want one rule at home. You can play with him and give him love, and please help us keep the same food rule.", d:"Do not blame grandparents or parents in front of the child. Do not argue in front of him.", e:"When all adults agree, a child learns faster that the rule is the same everywhere.", b:"Hold a short family talk, away from the child, about the 2 or 3 main rules. Let grandparents keep their warmth through stories, play and walks, and give them a clear role in the agreed rules.", x:""},
  hi:{t:"दादी-नानी अलग नियम चलाएँ", s:"हम घर पर एक नियम रखना चाहते हैं। आप उसके साथ खेलिए, प्यार दीजिए, और खाने के नियम में हमारा साथ दीजिए।", d:"बच्चे के सामने दादी-नानी या माता-पिता को गलत न ठहराएँ। बहस न करें।", e:"सब बड़े एक नियम पर सहमत हों तो बच्चा जल्दी समझता है कि नियम हर जगह एक ही है।", b:"बच्चे से दूर बैठकर 2-3 मुख्य नियमों पर परिवार में बात करें। दादी-नानी का प्यार बना रहे: कहानी, खेल, सैर। उन्हें तय नियमों में एक भूमिका दें।", x:""}},
 {a:0,g:2,en:{t:"Parents argue in front of the child", s:"We will talk about this later. The rule for today is this one.", d:"Do not argue or contradict each other in front of the child. Do not put the child in the middle.", e:"Toddlers feel confused and unsafe when adults disagree openly. Talk privately, then decide together.", b:"Pause and say 'We need to talk, let's go to the other room.' Later, agree on the rule together, then tell the child that you are on the same side.", x:""},
  hi:{t:"माता-पिता बच्चे के सामने झगड़ते हैं", s:"इस पर बाद में बात करेंगे। आज का नियम यही है।", d:"बच्चे के सामने एक-दूसरे को काटें नहीं। बच्चे को बीच में न डालें।", e:"बड़ों का खुला झगड़ा देखकर छोटे बच्चे उलझन और डर महसूस करते हैं। अकेले में बात करें, फिर साथ में फ़ैसला लें।", b:"बहस रोकें और कहें 'हमें बात करनी है, दूसरे कमरे में चलते हैं'। बाद में मिलकर नियम तय करें और बच्चे को बताएँ कि आप दोनों एक साथ हैं।", x:""}},
 {a:0,g:2,en:{t:"Throwing food on the floor", s:"Food stays on the plate. Meal is over. We eat again at the next meal.", d:"Do not make a big fuss or give fresh food straight away.", e:"Keep the meal short. Calm, same response every time works best.", b:"Keep meals to about 20 to 30 minutes and serve smaller portions. Give a small job, like carrying his own bowl, and stay calm without chasing food around the room.", x:""},
  hi:{t:"खाना ज़मीन पर फेंकना", s:"खाना प्लेट में रहता है। खाना खत्म। अगला खाना अगले समय पर मिलेगा।", d:"ज़्यादा हंगामा न करें और तुरंत दूसरा खाना न दें।", e:"खाने का समय छोटा रखें। हर बार एक ही शांत जवाब सबसे अच्छा काम करता है।", b:"छोटी मात्रा दें, खाना 20 से 30 मिनट में खत्म करें। छोटा काम दें, जैसे अपनी कटोरी उठाना। शांत रहें और खाने के पीछे-पीछे न भागें।", x:""}},
 {a:0,g:2,en:{t:"Screams during hair wash or nail cutting", s:"I know it feels scary. We will do one small part, then a hug.", d:"Do not force it all at once. Do not threaten with a doctor or police.", e:"Tell the child in advance, do small parts, and use a comfort object. Fear reduces over several sessions.", b:"Keep a fixed time each day. Let the child hold the comb or the nail clipper, show the steps on a doll or your own hand, and praise each small step.", x:""},
  hi:{t:"बाल धोते या नाखून काटते समय डर और रोना", s:"डर लग रहा है, मैं जानता हूँ। एक छोटा हिस्सा करेंगे, फिर झप्पी।", d:"एक साथ ज़बरदस्ती न करें। डॉक्टर या पुलिस का डर न दिखाएँ।", e:"पहले से बताएँ, छोटे-छोटे हिस्से करें, और अपना पसंदीदा खिलौना साथ रखें। डर कुछ बार में कम होता है।", b:"रोज़ एक तय समय रखें, बच्चे को कंघी या नेल कटर पकड़ने दें। पहले गुड़िया या अपने हाथ पर दिखाएँ। हर छोटे कदम की तारीफ़ करें।", x:""}},
 {a:0,g:2,en:{t:"Afraid of the dark or a new room", s:"You are safe. I am here. Let's turn on the night light.", d:"Do not frighten with stories like 'a ghost will come'. Do not laugh at the fear.", e:"Practise the new room in daytime first. Fear usually reduces over a few weeks.", b:"Show the room in daylight, including the bed and the night light. Give a comfort object, read a short story about a brave child, and praise each night he manages.", x:""},
  hi:{t:"अंधेरे या नए कमरे से डर", s:"तुम सुरक्षित हो। मैं यहीं हूँ। नाइट लाइट जला देते हैं।", d:"'भूत आएगा' जैसी डरावनी बातें न करें। डर का मज़ाक न उड़ाएँ।", e:"नए कमरे में पहले दिन में कुछ देर साथ जाएँ। डर कुछ हफ़्तों में धीरे-धीरे कम होता है।", b:"दिन में कमरा दिखाएँ: बिस्तर और नाइट लाइट। कोई पसंदीदा चीज़ दें। बहादुर बच्चों की छोटी कहानी पढ़ें और हर रात की हिम्मत की तारीफ़ करें।", x:""}},
 {a:0,g:2,en:{t:"Hitting the parent when angry", s:"No hitting. I will hold your hands. Let's take one deep breath together.", d:"Do not hit back, shout, or threaten. Keep your voice low.", e:"Hold the hands gently, keep the limit, and wait for the child to calm. Then give a hug and name the feeling.", b:"Name the feeling: 'You are very angry.' Offer a safe way out, such as stamping feet, hitting a cushion, or squeezing a ball. Teach the words for anger later, in a calm time.", x:""},
  hi:{t:"गुस्से में माता-पिता को मारना", s:"मारना नहीं। हम हाथ थामते हैं। चलो, एक गहरी साँस लेते हैं।", d:"पलटकर न मारें। चिल्लाएँ या डराएँ नहीं।", e:"हाथ प्यार से पकड़ें, सीमा बनाए रखें, और बच्चे के शांत होने का इंतज़ार करें। फिर गले लगाएँ और भावना का नाम बताएँ।", b:"भावना का नाम लें: 'तुम बहुत गुस्से में हो।' सुरक्षित विकल्प दें: पैर पटकना, तकिया मारना, या गेंद दबाना। बाद में शांत समय में गुस्से के शब्द सिखाएँ।", x:""}},
 {a:0,g:2,en:{t:"Parent loses temper and shouts", s:"I made a mistake. I should not have shouted. Next time, we will talk calmly.", d:"Do not hide the mistake or blame the child.", e:"A child learns that mistakes can be repaired when parents say sorry. Talk again later in a calm moment.", b:"Repair the moment soon, while the child is still close. Use the same words: 'I shouted, I am sorry.' Then do one calm thing together, like a story or a hug.", x:""},
  hi:{t:"माता-पिता का गुस्सा और चिल्लाना", s:"मुझसे गलती हुई। मुझे चिल्लाना नहीं चाहिए था। अगली बार हम शांति से बात करेंगे।", d:"गलती न छिपाएँ, न बच्चे को दोष दें।", e:"माफ़ी माँगना देखकर बच्चा सीखता है कि गलती सुधारी जा सकती है। बाद में शांत समय में फिर बात करें।", b:"जल्दी ही उसी समय सुधारें, बच्चा पास हो तो। वही शब्द दोहराएँ: 'मैं चिल्लाया, मुझे अफ़सोस है।' फिर साथ में कोई शांत काम करें, जैसे कहानी या झप्पी।", x:""}},

 // 3–6 years
 {a:1,g:1,en:{t:"Refuses to share toys at play group", s:"Sharing means you take a turn and your friend takes a turn. Let's use the timer.", d:"Do not force the child to give his favourite toy. Do not shame him in front of others.", e:"Sharing is learnt over many months. Young children often do not share until they feel secure.", b:"Keep one special toy that the child does not have to share. Use a timer for turns, and praise sharing when it happens.", x:""},
  hi:{t:"खेल के समय खिलौना बाँटने से मना करना", s:"बाँटने का मतलब है बारी-बारी से खेलना। चलो, टाइमर लगाते हैं।", d:"पसंदीदा खिलौना देने के लिए ज़बरदस्ती न करें। दूसरों के सामने शर्मिंदा न करें।", e:"बाँटना कुछ महीनों में सीखा जाता है। छोटे बच्चे अक्सर तब बाँटते हैं जब उन्हें सुरक्षित महसूस हो।", b:"एक खास खिलौना अलग रखें जिसे बाँटना ज़रूरी न हो। बारी के लिए टाइमर रखें और बाँटने पर तारीफ़ करें।", x:""}},
 {a:1,g:1,en:{t:"Lies about what happened", s:"I know it is hard to say. You will not be in trouble for telling me the truth.", d:"Do not punish the truth harshly. Do not trap the child with questions.", e:"Lying at this age is often a way to avoid fear, not a sign of bad character.", b:"Say what you saw calmly: 'I saw the cup broken.' Praise honesty and talk about what to do next time.", x:""},
  hi:{t:"जो हुआ उसके बारे में झूठ बोलना", s:"बताना मुश्किल होता है, मैं समझता/समझती हूँ। सच बताने पर तुम्हें डाँट नहीं पड़ेगी।", d:"सच को कठोर सज़ा न दें। सवालों से बच्चे को फँसाएँ नहीं।", e:"इस उम्र में झूठ अक्सर डर से बचने का तरीका होता है, बुरे चरित्र की निशानी नहीं।", b:"शांति से बताएँ जो आपने देखा: 'मैंने कप टूटा देखा।' सच बोलने की तारीफ़ करें और अगली बार क्या करना है, यह बताएँ।", x:""}},
 {a:1,g:1,en:{t:"Wants the tablet at every meal", s:"Tablet time is after dinner for 15 minutes. At meals we talk and eat together.", d:"Do not use the tablet to get the child to eat. Do not change the rule each day.", e:"Screens during meals reduce eating and talking. A fixed rule, repeated calmly, works best.", b:"Set one screen rule for the whole family. Start meals with a short family game, like telling what was good about the day.", x:""},
  hi:{t:"हर खाने पर टैबलेट चाहिए", s:"टैबलेट खाने के बाद 15 मिनट के लिए। खाते समय हम बात करते हैं और साथ खाते हैं।", d:"खाना खिलाने के लिए टैबलेट का इस्तेमाल न करें। हर दिन नियम न बदलें।", e:"खाने के समय स्क्रीन से खाना और बातचीत दोनों कम होते हैं। एक तय नियम, शांति से दोहराया जाए, तो सबसे अच्छा काम करता है।", b:"पूरे परिवार के लिए एक स्क्रीन नियम रखें। खाने की शुरुआत दिन की अच्छी बात बताने के खेल से करें।", x:""}},
 {a:1,g:2,en:{t:"Will not wear the clothes you pick", s:"Today you can choose between these two shirts. Both are good for school.", d:"Do not argue for a long time, and do not force him in front of others.", e:"Clothing fights are common. Two options within your limits give a sense of control.", b:"Lay out two options the night before. Use a sticker chart for dressing on time, and praise each step done alone.", x:""},
  hi:{t:"जो कपड़े आप चुनें, वे न पहनना", s:"आज इन दो कमीज़ों में से चुनो। दोनों स्कूल के लिए अच्छी हैं।", d:"लंबी बहस न करें, और दूसरों के सामने ज़बरदस्ती न करें।", e:"कपड़ों पर झगड़ा आम है। आपकी सीमा के अंदर दो विकल्प देने से बच्चे को नियंत्रण का एहसास होता है।", b:"रात को ही दो विकल्प रख दें। समय पर तैयार होने के लिए स्टिकर चार्ट बनाएँ, और खुद किए हर कदम की तारीफ़ करें।", x:""}},
 {a:1,g:2,en:{t:"Hits a friend who takes his toy", s:"No hitting. Your friend is sad. Let's say sorry and ask for the toy with words.", d:"Do not hit back or shout. Do not call him 'bad' or 'naughty'.", e:"At this age, children hit when they cannot yet use words for their feelings.", b:"Help him say 'Can I have it, please?' or 'Stop, I am playing.' Praise the words, and do not force a hug.", x:""},
  hi:{t:"दोस्त से खिलौना छीनने पर उसे मारना", s:"मारना नहीं। तुम्हारा दोस्त उदास है। सॉरी बोलो और शब्दों से खिलौना माँगो।", d:"पलटकर न मारें और न चिल्लाएँ। उसे 'गंदा' या 'शैतान' न कहें।", e:"इस उम्र में बच्चे मारते हैं, क्योंकि उन्हें भावनाओं के लिए शब्द अभी नहीं आते।", b:"शब्द सिखाएँ: 'क्या मुझे दे सकते हो, प्लीज़?' या 'रुको, मैं खेल रहा हूँ।' शब्दों की तारीफ़ करें, और गले मिलने के लिए ज़ोर न दें।", x:""}},
 {a:1,g:2,en:{t:"Scared of the doctor or injections", s:"The doctor will look at your ears and throat. It may pinch a little. I will hold your hand.", d:"Do not say 'the doctor will give an injection if you are naughty'. Do not lie about pain.", e:"Fear at clinic visits is common. Honest, short explanations help.", b:"Tell the truth in short words before the visit. Let the child hold a toy or a doll, and praise bravery after the visit, not during.", x:""},
  hi:{t:"डॉक्टर या इंजेक्शन से डरना", s:"डॉक्टर कान और गला देखेंगे। थोड़ा चुभ सकता है। मैं तुम्हारा हाथ पकड़े रहूँगा/रहूँगी।", d:"'शैतानी की तो इंजेक्शन लगेगा' ऐसा न कहें। दर्द के बारे में झूठ न बोलें।", e:"क्लिनिक जाने पर डर आम है। सच्ची और छोटी बातें मदद करती हैं।", b:"जाने से पहले छोटे शब्दों में सच बताएँ। बच्चे को खिलौना या गुड़िया पकड़ने दें, और बहादुरी की तारीफ़ जाने के बाद करें, उस समय नहीं।", x:""}},
 {a:1,g:2,en:{t:"Repeats a bad word he heard", s:"That word is not for us. We say kind words. What would you like to say instead?", d:"Do not laugh or repeat it again for fun. Do not shout at the child.", e:"Children copy words they hear, often without understanding them.", b:"Give a better word to use, and praise him when he says it. Watch what the family says around him, because he copies adults most.", x:""},
  hi:{t:"सुना हुआ गंदा शब्द बोलना", s:"यह शब्द हमारे लिए नहीं है। हम अच्छे शब्द बोलते हैं। इसकी जगह क्या बोलोगे?", d:"हँसें नहीं, और मज़े के लिए दोबारा बोलने न दें। बच्चे पर चिल्लाएँ नहीं।", e:"बच्चे सुने हुए शब्द कॉपी करते हैं, अक्सर उनका मतलब समझे बिना।", b:"उसे बोलने के लिए एक अच्छा शब्द दें, और बोलने पर तारीफ़ करें। घर में बड़े क्या बोलते हैं, इस पर ध्यान दें, क्योंकि बच्चा बड़ों को सबसे ज़्यादा कॉपी करता है।", x:""}},
 {a:1,g:1,en:{t:"Refuses to sleep in his own bed", s:"Your bed is ready. Let's read here, and then you can sleep here with your teddy.", d:"Do not start a new habit that you will later want to stop. Do not shout at night.", e:"Many children want company at night for a while. A clear plan helps them move back to their own bed.", b:"Make the bed a comfortable place, and agree on a plan: a few nights with a parent sitting nearby, then less each week.", x:""},
  hi:{t:"अपने बिस्तर पर न सोना", s:"तुम्हारा बिस्तर तैयार है। यहाँ पढ़ते हैं, फिर तुम अपने भालू के साथ अपने बिस्तर पर सोना।", d:"ऐसी नई आदत न डालें जो बाद में छुड़ानी पड़े। रात में चिल्लाएँ नहीं।", e:"कई बच्चे कुछ समय तक रात में साथ चाहते हैं। एक साफ़ योजना उन्हें अपने बिस्तर पर लौटने में मदद करती है।", b:"बिस्तर को आरामदायक बनाएँ, और एक योजना तय करें: कुछ रातें माता-पिता पास बैठें, फिर हर हफ़्ते थोड़ा कम।", x:""}},

 // 6–12 years
 {a:2,g:1,en:{t:"Homework fights every evening", s:"Let's do the first two sums together, then you do the rest. I will check at the end.", d:"Do not sit and scold for hours or compare with other children.", e:"Homework battles are common at this age. A set time and a short break help.", b:"Fix a daily homework time, in a place without the phone. Work in 20-minute blocks with breaks. Praise effort, not only marks.", x:""},
  hi:{t:"हर शाम होमवर्क पर झगड़ा", s:"पहले दो सवाल साथ में करते हैं, फिर बाकी तुम करना। अंत में मैं देख लूँगा/लूँगी।", d:"घंटों डाँटते न रहें, और दूसरे बच्चों से तुलना न करें।", e:"इस उम्र में होमवर्क पर झगड़ा आम है। एक तय समय और छोटा ब्रेक मदद करता है।", b:"रोज़ एक तय समय और एक ऐसी जगह रखें जहाँ फोन न हो। 20 मिनट का काम, फिर ब्रेक। मेहनत की तारीफ़ करें, सिर्फ़ नंबर की नहीं।", x:""}},
 {a:2,g:2,en:{t:"Lies about homework or test marks", s:"Thank you for telling me the truth. Let's see how we can fix this together.", d:"Do not shout or take away everything. Do not make the child lie again to avoid punishment.", e:"Children lie to avoid fear. Calm reactions make truth-telling easier.", b:"Ask what made him afraid to tell you. Agree on one fair consequence and one plan for next time.", x:""},
  hi:{t:"होमवर्क या टेस्ट के नंबर पर झूठ बोलना", s:"सच बताने के लिए धन्यवाद। आओ मिलकर देखें कि इसे कैसे ठीक करें।", d:"चिल्लाएँ नहीं और सब कुछ छीनें नहीं। सज़ा से बचने के लिए बच्चे को दोबारा झूठ बोलने पर मजबूर न करें।", e:"बच्चे डर से बचने के लिए झूठ बोलते हैं। शांत प्रतिक्रिया से सच बोलना आसान होता है।", b:"पूछें कि उसे सच बताने में डर क्यों लगा। एक उचित नतीजा और अगली बार के लिए एक योजना तय करें।", x:""}},
 {a:2,g:1,en:{t:"Gaming and phone time without limits", s:"Gaming ends at 8 pm. Let's set the timer now so no one is surprised.", d:"Do not take the phone away suddenly as a surprise punishment. Do not use screens to keep the child calm.", e:"Sudden removal causes anger. A planned timer reduces fights. At this age, screen limits are the parents' job.", b:"Make a family screen plan together. Keep phones out of bedrooms at night. Offer offline activities like cycling, art or a sport.", x:""},
  hi:{t:"गेम और फोन का असीमित समय", s:"गेम रात 8 बजे खत्म। अभी टाइमर लगा देते हैं, ताकि किसी को अचानक झटका न लगे।", d:"अचानक फोन छीनकर सज़ा न दें। बच्चे को शांत रखने के लिए स्क्रीन का इस्तेमाल न करें।", e:"अचानक फोन छीनने से गुस्सा आता है। पहले से तय टाइमर से झगड़े कम होते हैं। इस उम्र में स्क्रीन की सीमा तय करना माता-पिता का काम है।", b:"परिवार की स्क्रीन योजना मिलकर बनाएँ। रात में फोन बेडरूम से बाहर रखें। साइकिल, कला या खेल जैसी बाहर की गतिविधियाँ दें।", x:""}},
 {a:2,g:2,en:{t:"Friends leave him out", s:"It hurts when friends leave you out. Tell me what happened.", d:"Do not say 'they are bad friends' before listening. Do not force friendships.", e:"Friendship changes are common. Listening first builds trust.", b:"Listen fully, ask what he felt, then help him think of one step: talk to a friend, or join a group he likes.", x:""},
  hi:{t:"दोस्त उसे साथ नहीं रखते", s:"जब दोस्त साथ न रखें तो बुरा लगता है। बताओ क्या हुआ।", d:"सुने बिना 'वे बुरे दोस्त हैं' न कहें। दोस्ती ज़बरदस्ती न करवाएँ।", e:"दोस्ती बदलना आम है। पहले सुनने से भरोसा बनता है।", b:"पूरी बात सुनें, पूछें उसे कैसा लगा, फिर एक कदम सोचने में मदद करें: दोस्त से बात करना, या उस ग्रुप में जाना जो उसे पसंद है।", x:""}},
 {a:2,g:2,en:{t:"Child is being bullied at school", s:"You did not deserve that. I am glad you told me. We will talk to the teacher together.", d:"Do not tell the child to 'ignore it and fight back' alone. Do not blame the child.", e:"Bullying affects sleep, appetite and school. Schools should act with parents.", b:"Write down dates and what happened. Meet the class teacher or school counsellor calmly. Teach safe ways to walk away and to tell an adult at once.", x:"Refusing school, stomach aches before school, sleep loss, or talk of self-harm: see a doctor."},
  hi:{t:"स्कूल में बच्चे को धमकाया जा रहा है", s:"तुम्हारे साथ ऐसा नहीं होना चाहिए था। अच्छा किया जो बताया। हम मिलकर टीचर से बात करेंगे।", d:"बच्चे को अकेले 'ध्यान न दो या लड़ो' न कहें। बच्चे को दोष न दें।", e:"धमकाने से नींद, भूख और पढ़ाई पर असर पड़ता है। स्कूल को माता-पिता के साथ मिलकर कदम उठाने चाहिए।", b:"तारीखें और क्या हुआ, लिखकर रखें। शांति से क्लास टीचर या स्कूल काउंसलर से मिलें। सुरक्षित तरीके से वहाँ से हटना और तुरंत किसी बड़े को बताना सिखाएँ।", x:"स्कूल जाने से मना करना, स्कूल से पहले पेट दर्द, नींद में कमी, या खुद को नुकसान पहुँचाने की बात: डॉक्टर को दिखाएँ।"}},
 {a:2,g:2,en:{t:"Child bullies others", s:"What you did hurt him. Tell me why you did it. How can you make it right?", d:"Do not label the child as bad. Do not use shame or hitting.", e:"Children who bully often need help too, such as with anger, feelings or pressure.", b:"Ask the child to apologise in person and talk about feelings. Check who influences him. Talk to the school together.", x:""},
  hi:{t:"बच्चा दूसरों को धमकाता है", s:"तुमने जो किया उससे उसे दुख हुआ। बताओ तुमने ऐसा क्यों किया? इसे ठीक कैसे करोगे?", d:"बच्चे को 'बुरा' का ठप्पा न लगाएँ। शर्म या मार का इस्तेमाल न करें।", e:"धमकाने वाले बच्चों को भी मदद चाहिए, जैसे गुस्सा, भावनाएँ या दबाव संभालने में।", b:"बच्चे से सामने जाकर माफ़ी माँगने को कहें और भावनाओं पर बात करें। देखें कि उस पर कौन असर डाल रहा है। स्कूल के साथ मिलकर बात करें।", x:""}},
 {a:2,g:1,en:{t:"Sleep is short on school days", s:"Phones go to the charging place at 9 pm. Let's read together for 10 minutes.", d:"Do not let the TV run as a habit at night. Do not give tea, coffee or energy drinks.", e:"Children aged 6 to 12 need about 9 to 12 hours of sleep. Tiredness shows up as anger and poor focus.", b:"Keep a fixed bedtime and wake time, even at weekends. Dim the lights an hour before bed.", x:"Snoring, gasping in sleep, or daytime sleepiness despite enough sleep: see a doctor."},
  hi:{t:"स्कूल के दिनों में नींद कम", s:"रात 9 बजे फोन चार्जिंग की जगह पर। चलो, 10 मिनट साथ में पढ़ते हैं।", d:"रात में टीवी को आदत न बनने दें। चाय, कॉफ़ी या एनर्जी ड्रिंक न दें।", e:"6 से 12 साल के बच्चों को लगभग 9 से 12 घंटे की नींद चाहिए। थकान गुस्से और ध्यान की कमी में दिखती है।", b:"छुट्टी में भी सोने और जागने का समय एक ही रखें। सोने से एक घंटा पहले रोशनी धीमी करें।", x:"नींद में खर्राटे या साँस रुकना, या पर्याप्त नींद के बाद भी दिन में नींद आना: डॉक्टर को दिखाएँ।"}},
 {a:2,g:2,en:{t:"Stealing small things", s:"Taking what is not yours is not okay. Let's return it together and say sorry.", d:"Do not call the child a thief. Do not hide the problem.", e:"Young children may take things without understanding ownership. Repair teaches values.", b:"Go back with the child to return or pay back the item. Praise the honest return. Look for the reason: need, peer pressure, or wanting attention.", x:""},
  hi:{t:"छोटी-छोटी चीज़ें चुराना", s:"जो तुम्हारा नहीं है, उसे लेना ठीक नहीं। चलो, मिलकर लौटाते हैं और सॉरी बोलते हैं।", d:"बच्चे को 'चोर' न कहें। समस्या को छिपाएँ नहीं।", e:"छोटे बच्चे मालिकाना हक समझे बिना चीज़ें ले सकते हैं। सुधारने से मूल्य सिखाए जाते हैं।", b:"बच्चे के साथ जाकर चीज़ लौटाएँ या पैसे दें। ईमानदारी से लौटाने की तारीफ़ करें। कारण ढूँढें: ज़रूरत, दोस्तों का दबाव, या ध्यान पाने की चाह।", x:""}},
 {a:2,g:2,en:{t:"Stress about marks and comparison", s:"Your marks do not decide your worth. Let's plan for the next test.", d:"Do not compare with cousins or friends. Do not threaten about the future.", e:"Pressure can cause stomach ache, headache or sleeplessness. Break study into small steps.", b:"Make a weekly plan with small goals. Praise effort and learning. Spend time on play and family every day.", x:"Frequent stomach aches or headaches before school, or refusing to go to school: see a doctor."},
  hi:{t:"नंबरों का तनाव और तुलना", s:"तुम्हारे नंबर तुम्हारी कीमत तय नहीं करते। चलो, अगले टेस्ट की योजना बनाते हैं।", d:"चचेरे भाई-बहनों या दोस्तों से तुलना न करें। भविष्य का डर दिखाकर धमकाएँ नहीं।", e:"दबाव से पेट दर्द, सिरदर्द या नींद न आना हो सकता है। पढ़ाई को छोटे-छोटे हिस्सों में बाँटें।", b:"छोटे लक्ष्यों वाली साप्ताहिक योजना बनाएँ। मेहनत और सीखने की तारीफ़ करें। रोज़ खेल और परिवार के लिए समय रखें।", x:"स्कूल से पहले बार-बार पेट दर्द या सिरदर्द, या स्कूल जाने से मना करना: डॉक्टर को दिखाएँ।"}},
 {a:2,g:1,en:{t:"Younger sibling and older sibling comparison", s:"You are unique. Let's celebrate what you did well today.", d:"Do not compare children in front of others or within the family.", e:"Constant comparison damages confidence and creates rivalry between siblings.", b:"Praise specific effort: 'You kept trying with the maths.' Give each child separate time alone with you each week.", x:""},
  hi:{t:"भाई-बहनों की आपस में तुलना", s:"तुम अनोखे हो। आज तुमने जो अच्छा किया, उसका जश्न मनाते हैं।", d:"बच्चों की तुलना दूसरों के सामने या परिवार में न करें।", e:"लगातार तुलना आत्मविश्वास कम करती है और भाई-बहनों में होड़ पैदा करती है।", b:"खास मेहनत की तारीफ़ करें: 'तुमने गणित में कोशिश जारी रखी।' हर हफ़्ते हर बच्चे के साथ अलग, अकेले समय बिताएँ।", x:""}},

 // 13–18 years
 {a:3,g:1,en:{t:"Phone and social media at night", s:"I know the phone matters to you. Let's agree on phone-free time at night, and I will keep my phone away too.", d:"Do not take the phone away without warning. Do not secretly check every message.", e:"Late-night phone use reduces sleep and mood. Agreed rules work better than secret controls.", b:"Agree on rules together: phones charge outside the bedroom at night. Talk about what he sees online, and about privacy and safety.", x:""},
  hi:{t:"रात में फोन और सोशल मीडिया", s:"मैं समझता/समझती हूँ कि फोन तुम्हारे लिए ज़रूरी है। चलो, रात में फोन-मुक्त समय तय करते हैं, और मैं भी अपना फोन दूर रखूँगा/रखूँगी।", d:"बिना बताए फोन न छीनें। हर संदेश चुपके से न देखें।", e:"देर रात फोन चलाने से नींद और मूड पर असर होता है। मिलकर तय किए नियम छिपी निगरानी से बेहतर काम करते हैं।", b:"मिलकर नियम बनाएँ: रात में फोन बेडरूम के बाहर चार्ज हो। बात करें कि वह ऑनलाइन क्या देखता है, और प्राइवेसी और सुरक्षा के बारे में।", x:""}},
 {a:3,g:2,en:{t:"Exam stress and worry", s:"You are working hard. It is okay to feel stressed. What part feels hardest?", d:"Do not tell him his future depends on one exam. Do not compare with other students.", e:"Stress can cause sleep loss, appetite change, and irritability. It eases when the plan feels clear.", b:"Make a realistic timetable with breaks and sleep. Praise effort. If worry is constant or sleep is badly affected, see a doctor.", x:"Constant worry, panic attacks, not eating or sleeping for days: see a doctor."},
  hi:{t:"परीक्षा का तनाव और चिंता", s:"तुम बहुत मेहनत कर रहे/रही हो। तनाव महसूस होना ठीक है। सबसे मुश्किल कौन सा हिस्सा लगता है?", d:"यह न कहें कि उसका भविष्य एक परीक्षा पर टिका है। दूसरे छात्रों से तुलना न करें।", e:"तनाव से नींद, भूख और चिड़चिड़ापन बदल सकते हैं। योजना साफ़ होने पर तनाव कम होता है।", b:"ब्रेक और नींद के साथ एक सच्ची समय-सारणी बनाएँ। मेहनत की तारीफ़ करें। अगर चिंता लगातार हो या नींद बहुत प्रभावित हो, तो डॉक्टर को दिखाएँ।", x:"लगातार चिंता, घबराहट के दौरे, या कई दिन तक न खाना या न सोना: डॉक्टर को दिखाएँ।"}},
 {a:3,g:2,en:{t:"Sudden withdrawal or low mood", s:"I have noticed you seem sad lately. You can tell me, and I am here to listen.", d:"Do not dismiss feelings with 'you are just moody' or 'stop being dramatic'. Do not secretly read private messages.", e:"Mood changes are common in adolescence. Long-lasting sadness, loss of interest, or sleep change needs care.", b:"Listen without fixing right away. Ask direct questions about safety. Keep daily routines, such as meals together, and involve a doctor or counsellor early.", x:"Talk of death, self-harm, giving things away, or extreme hopelessness: contact a doctor urgently. In immediate danger call 112. Tele-MANAS helpline 14416 is free and available 24 hours."},
  hi:{t:"अचानक अकेले रहना या मन उदास रहना", s:"मैंने देखा है कि तुम आजकल उदास लगते/लगती हो। तुम मुझे बता सकते/सकती हो, मैं सुनने के लिए यहाँ हूँ।", d:"'तुम बस मूडी हो' या 'ड्रामा मत करो' कहकर भावनाओं को न टालें। चुपके से निजी संदेश न पढ़ें।", e:"किशोरावस्था में मूड बदलना आम है। लंबे समय तक उदासी, रुचि खत्म होना, या नींद में बदलाव पर ध्यान देने की ज़रूरत है।", b:"तुरंत हल बताने की बजाय ध्यान से सुनें। सुरक्षा के बारे में सीधे सवाल पूछें। रोज़ की आदतें बनाए रखें, जैसे साथ में खाना, और डॉक्टर या काउंसलर को जल्दी शामिल करें।", x:"मरने की बात, खुद को नुकसान पहुँचाने की बात, चीज़ें बाँटना, या बहुत ज़्यादा निराशा: तुरंत डॉक्टर से संपर्क करें। तुरंत खतरा हो तो 112 पर कॉल करें। Tele-MANAS हेल्पलाइन 14416 मुफ़्त है और 24 घंटे उपलब्ध है।"}},
 {a:3,g:2,en:{t:"Peer pressure to smoke, drink or try drugs", s:"I want you to be safe. If friends push you, you can say no or leave. You can always call me, without fear.", d:"Do not threaten or shame. Do not panic and punish before talking.", e:"Many teens experiment. Early support reduces harm.", b:"Ask calmly who, where and what. Agree on a safe code word for calling home. If use is found, seek medical or counselling help, not only punishment.", x:"Unconsciousness, trouble breathing, fits, or confusion after any substance: call 112 immediately."},
  hi:{t:"सिगरेट, शराब या नशे का दबाव", s:"मैं चाहता/चाहती हूँ कि तुम सुरक्षित रहो। दोस्त दबाव डालें तो तुम मना कर सकते/सकती हो या वहाँ से निकल सकते/सकती हो। तुम मुझे डर के बिना कभी भी बता सकते/सकती हो।", d:"धमकाएँ या शर्मिंदा न करें। बात किए बिना घबराकर सज़ा न दें।", e:"कई किशोर प्रयोग करते हैं। जल्दी मदद से नुकसान कम होता है।", b:"शांति से पूछें कौन, कहाँ और क्या। घर फ़ोन करने के लिए एक सुरक्षित कोड शब्द तय करें। नशा पता चले तो सिर्फ़ सज़ा नहीं, डॉक्टर या काउंसलिंग की मदद लें।", x:"किसी भी नशे के बाद बेहोशी, साँस लेने में दिक्कत, दौरा, या भ्रम: तुरंत 112 पर कॉल करें।"}},
 {a:3,g:2,en:{t:"Body image, eating and weight worry", s:"Your body is changing, and that is common. Let's talk about how you feel about it.", d:"Do not comment on weight or looks in a negative way. Do not start diets for him.", e:"Body changes can cause worry and comparison online. Focus on health and strength.", b:"Praise what the body can do: running, dancing, climbing. Keep family meals regular and calm. Avoid weight talk at home.", x:"Skipping meals, vomiting after eating, sudden weight loss, or dizziness: see a doctor."},
  hi:{t:"शरीर की छवि, खाने और वज़न की चिंता", s:"तुम्हारा शरीर बदल रहा है, और यह आम बात है। बताओ तुम्हें इसके बारे में कैसा लगता है।", d:"वज़न या रूप पर नकारात्मक टिप्पणी न करें। उसके लिए डाइट शुरू न करें।", e:"शरीर बदलने से चिंता और ऑनलाइन तुलना हो सकती है। सेहत और ताकत पर ध्यान दें।", b:"शरीर जो कर सकता है उसकी तारीफ़ करें: दौड़ना, नाचना, चढ़ना। घर पर खाना नियमित और शांत रखें। घर पर वज़न की बात न करें।", x:"खाना छोड़ना, खाने के बाद उल्टी, अचानक वज़न घटना, या चक्कर आना: डॉक्टर को दिखाएँ।"}},
 {a:3,g:2,en:{t:"Online safety and sharing photos", s:"Please never share private photos, even with people you trust. If someone asks you to send them, tell me right away.", d:"Do not shame the child if something goes wrong. He may stop telling you.", e:"Teens may be pressured into sharing images. Early conversation prevents harm.", b:"Keep devices in shared areas for younger teens. Talk about blocking and reporting. If sexual content or threats appear, save the evidence and report it. The National Cyber Crime Helpline is 1930.", x:"Threats, blackmail, or someone asking for money or images: report to police and 1930 at once."},
  hi:{t:"ऑनलाइन सुरक्षा और फोटो शेयर करना", s:"कृपया अपनी निजी फोटो कभी न भेजें, भरोसे वाले लोगों को भी नहीं। अगर कोई उन्हें माँगे तो तुरंत बताना।", d:"कुछ गलत हो जाए तो बच्चे को शर्मिंदा न करें। वह बताना बंद कर सकता है।", e:"किशोरों पर फोटो भेजने का दबाव आ सकता है। जल्दी बातचीत नुकसान रोकती है।", b:"छोटे किशोरों के फोन साझा जगह पर रखें। ब्लॉक और रिपोर्ट करना सिखाएँ। अगर यौन सामग्री या धमकी आए, तो सबूत सहेजें और रिपोर्ट करें। राष्ट्रीय साइबर अपराध हेल्पलाइन 1930 है।", x:"धमकी, ब्लैकमेल, या कोई पैसे या फोटो माँगे: तुरंत पुलिस और 1930 पर रिपोर्ट करें।"}},
 {a:3,g:1,en:{t:"Arguments about clothes and style", s:"You can choose your style within what is respectful and safe for school. Let's agree on the basics.", d:"Do not mock clothes or hairstyles in front of friends.", e:"Identity and style matter to teens. Firm school rules work best when they are explained.", b:"Agree on the school basics together, then leave the rest to him. Explain the reason for each school rule.", x:""},
  hi:{t:"कपड़ों और स्टाइल पर बहस", s:"स्कूल के लिए जो सम्मानजनक और सुरक्षित हो, उसमें तुम अपनी स्टाइल चुन सकते/सकती हो। बुनियादी नियम मिलकर तय करते हैं।", d:"दोस्तों के सामने कपड़ों या बालों का मज़ाक न उड़ाएँ।", e:"किशोरों के लिए पहचान और स्टाइल मायने रखते हैं। स्कूल के नियम समझाए जाएँ तो सबसे अच्छा काम करते हैं।", b:"स्कूल के बुनियादी नियम मिलकर तय करें, बाकी उसी पर छोड़ें। हर स्कूल नियम का कारण समझाएँ।", x:""}},
 {a:3,g:2,en:{t:"Hiding where he goes", s:"I need to know where you are, for your safety. Let's agree on a message when you reach.", d:"Do not go through the phone secretly. Do not punish the truth.", e:"Teens want privacy and trust. Sharing location and a simple check-in keeps both.", b:"Agree on a simple check-in message and a time to be home. Say what you will do if the plan changes, and keep your word too.", x:""},
  hi:{t:"कहाँ जा रहा है, यह छिपाना", s:"तुम्हारी सुरक्षा के लिए मुझे पता होना चाहिए कि तुम कहाँ हो। पहुँचने पर एक संदेश भेजना, यह तय करते हैं।", d:"चुपके से फोन न देखें। सच बोलने पर सज़ा न दें।", e:"किशोर निजता और भरोसा चाहते हैं। लोकेशन शेयर करना और एक सरल संदेश दोनों बनाए रखते हैं।", b:"एक सरल चेक-इन संदेश और घर लौटने का समय तय करें। योजना बदले तो क्या होगा, यह बताएँ, और अपनी बात भी निभाएँ।", x:""}},
 {a:3,g:2,en:{t:"Arguing loudly with parents", s:"I hear that you disagree. Let's listen to each other and then decide.", d:"Do not end the discussion by shouting or saying 'because I said so'.", e:"Teens need to be heard. Reasons and limits together build respect.", b:"Agree on a time to talk when both are calm. Let him state his view fully, then explain your decision and the reason for it.", x:""},
  hi:{t:"माता-पिता से ज़ोर से बहस करना", s:"मैं समझ रहा/रही हूँ कि तुम असहमत हो। चलो, एक-दूसरे की सुनते हैं, फिर फ़ैसला करते हैं।", d:"चिल्लाकर या 'क्योंकि मैंने कहा' कहकर बात खत्म न करें।", e:"किशोरों को सुने जाने की ज़रूरत होती है। कारण और सीमाएँ मिलकर सम्मान बनाती हैं।", b:"ऐसा समय तय करें जब दोनों शांत हों। उसे अपनी बात पूरी कहने दें, फिर अपना फ़ैसला और उसका कारण समझाएँ।", x:""}},
 {a:3,g:1,en:{t:"Pocket money and spending", s:"Let's make a monthly budget: fixed expenses, savings, and fun money.", d:"Do not give unlimited money or take all control away.", e:"Money habits built now carry into adulthood.", b:"Let him manage a fixed monthly amount for his own expenses. Review it together once a month, and let small mistakes teach him.", x:""},
  hi:{t:"जेब खर्च और पैसे का इस्तेमाल", s:"चलो, एक मासिक बजट बनाते हैं: तय खर्च, बचत, और मौज-मस्ती के लिए पैसे।", d:"असीमित पैसे न दें, और सारा नियंत्रण न छीनें।", e:"आज बनी पैसों की आदतें बड़े होने तक साथ रहती हैं।", b:"अपने खर्च के लिए एक तय मासिक राशि उसे खुद संभालने दें। महीने में एक बार मिलकर समीक्षा करें, और छोटी गलतियों से सीखने दें।", x:""}}
];

  hi:{t:"परिवार के काम में मदद करना", how:"बेटे और बेटी दोनों को हर हफ़्ते एक पारिवारिक काम दें, जैसे झाड़ू लगाना, कपड़े तह करना, या पौधों में पानी देना। काम की तारीफ़ करें, और हर महीने काम बदलें।", dont:"बेटियों को सिर्फ़ 'लड़कियों वाले' और बेटों को सिर्फ़ 'लड़कों वाले' काम न दें।"}},
 {a:2,c:"kindness", en:{t:"Fair play and sharing", how:"Talk about how a good player shares the ball and includes others. Praise fair play after the game, even when his team loses.", dont:"Do not praise winning above everything else."},
  hi:{t:"न्यायपूर्ण खेल और बाँटना", how:"बताएँ कि अच्छा खिलाड़ी गेंद बाँटता है और सबको शामिल करता है। खेल के बाद, हार पर भी, न्यायपूर्ण खेल की तारीफ़ करें।", dont:"जीतने को हर चीज़ से ऊपर न रखें।"}},
 {a:2,c:"kindness", en:{t:"Respecting people who are different", how:"Talk about families who look, speak, eat or pray differently. Ask: how would you feel if someone laughed at you for it?", dont:"Do not mock people for their looks, language, faith, colour, or family type."},
  hi:{t:"अलग दिखने या अलग रहने वाले लोगों का आदर", how:"बात करें कि कुछ परिवार अलग दिखते, बोलते, खाते या पूजा करते हैं। पूछें: अगर कोई तुम्हारी ऐसी बात पर हँसे तो कैसा लगेगा?", dont:"किसी के रूप, भाषा, आस्था, रंग या परिवार के ढाँचे का मज़ाक न उड़ाएँ।"}},
 {a:2,c:"respect", en:{t:"Respecting privacy", how:"Teach him to knock before entering a room, and not to read others' letters or messages. Ask him to respect your privacy too.", dont:"Do not read his messages secretly to 'check', and do not share his private things with others."},
  hi:{t:"निजता का आदर", how:"सिखाएँ कि कमरे में जाने से पहले दरवाज़ा खटखटाएँ, और दूसरों की चिट्ठी या संदेश न पढ़ें। यह भी बताएँ कि अपनी निजता का आदर वह खुद भी माँग सकता है।", dont:"'जाँच करने' के लिए चुपके से उसके संदेश न पढ़ें, और उसकी निजी बातें दूसरों को न बताएँ।"}},
 {a:2,c:"kindness", en:{t:"Earning and saving for a small goal", how:"Let him do one paid helpful job, like washing a car or helping a shop, if safe. Help him save for one small goal and celebrate when he reaches it.", dont:"Do not let him work in unsafe or exploitative jobs. Do not make him give up school for work."},
  hi:{t:"छोटे लक्ष्य के लिए कमाना और बचाना", how:"अगर सुरक्षित हो, तो एक छोटा काम करके कमाने दें, जैसे गाड़ी धोना या दुकान में मदद करना। एक छोटे लक्ष्य के लिए बचत में मदद करें और पूरा होने पर खुशी मनाएँ।", dont:"उसे असुरक्षित या शोषण वाले काम न करने दें। काम के लिए स्कूल न छुड़वाएँ।"}},

 // 13–18
 {a:3,c:"money", en:{t:"A monthly budget", how:"Ask him to write income, needs, savings and fun money for one month. Let him track his spending for four weeks, then review it together.", dont:"Do not step in to rescue every shortfall. Let small mistakes teach him."},
  hi:{t:"मासिक बजट", how:"उसे एक महीने की आय, ज़रूरतें, बचत और मौज-मस्ती का पैसा लिखने को कहें। चार हफ़्ते खर्च का हिसाब रखने दें, फिर मिलकर समीक्षा करें।", dont:"हर कमी को पूरा करने के लिए बीच में न आएँ। छोटी गलतियों से सीखने दें।"}},
 {a:3,c:"money", en:{t:"Saving and needs versus wants", how:"Before a big purchase, ask him to wait 7 days and compare prices. Discuss why the wait helps.", dont:"Do not shame a teen for wanting something."},
  hi:{t:"बचत और ज़रूरत बनाम चाहत", how:"कोई बड़ी खरीदारी करने से पहले उसे 7 दिन रुकने और कीमतें तुलना करने को कहें। चर्चा करें कि इंतज़ार क्यों मदद करता है।", dont:"किशोर को कुछ चाहने पर शर्मिंदा न करें।"}},
 {a:3,c:"responsibility", en:{t:"Owning a responsibility fully", how:"Give him one task he owns completely, such as laundry, or cooking one meal a week. Let him learn from the result.", dont:"Do not redo his tasks in secret."},
  hi:{t:"एक ज़िम्मेदारी पूरी तरह उसकी", how:"उसे एक काम पूरी तरह दें, जैसे कपड़े धोना, या हफ़्ते में एक खाना बनाना। नतीजे से सीखने दें।", dont:"उसके काम चुपके से दोबारा न करें।"}},
 {a:3,c:"time", en:{t:"Time management for exams and life", how:"Use a weekly planner with study, sports, friends and rest. Review it every Sunday.", dont:"Do not fill every hour. Rest is part of good time management."},
  hi:{t:"परीक्षा और जीवन के लिए समय प्रबंधन", how:"एक साप्ताहिक योजना में पढ़ाई, खेल, दोस्त और आराम रखें। हर रविवार उसकी समीक्षा करें।", dont:"हर घंटा न भरें। आराम भी अच्छे समय प्रबंधन का हिस्सा है।"}},
 {a:3,c:"elders", en:{t:"Disagreeing with elders respectfully", how:"Teach him to state his view calmly, listen, then accept a decision with grace, or ask for a later talk.", dont:"Do not call disagreement disrespect. Do not demand silence."},
  hi:{t:"बड़ों से आदर के साथ असहमत होना", how:"सिखाएँ कि अपनी बात शांति से कहे, सुने, और फिर विनम्रता से फ़ैसला माने, या बाद में बात करने को कहे।", dont:"असहमति को बेअदबी न कहें। चुप रहने की ज़िद न करें।"}},
 {a:3,c:"respect", en:{t:"Consent and respect for others' bodies", how:"Teach that 'no' means no, that everyone has a right to their body and space, and that asking first is always right. Keep the talk open and factual.", dont:"Do not avoid the topic, and do not shame questions. Do not treat it as a one-time talk."},
  hi:{t:"सहमति और दूसरों के शरीर का आदर", how:"सिखाएँ कि 'ना' का मतलब ना है, हर किसी को अपने शरीर और जगह का अधिकार है, और पहले पूछना हमेशा सही है। बातचीत खुली और तथ्यात्मक रखें।", dont:"विषय से बचें नहीं, और सवालों पर शर्मिंदा न करें। इसे एक बार की बातचीत न समझें।"}},
 {a:3,c:"digital", en:{t:"Online manners and kindness", how:"Teach: think before posting, ask if it would hurt someone, and never share private messages or photos of others.", dont:"Do not forward cruel jokes, memes that mock people, or private images."},
  hi:{t:"ऑनलाइन तमीज़ और दया", how:"सिखाएँ: पोस्ट करने से पहले सोचें, पूछें कि इससे किसी को दुख होगा क्या, और दूसरों के निजी संदेश या फोटो कभी शेयर न करें।", dont:"क्रूर मज़ाक, लोगों का मज़ाक उड़ाने वाले मीम, या निजी तस्वीरें आगे न भेजें।"}},
 {a:3,c:"kindness", en:{t:"Honesty and keeping promises", how:"Teach him to keep his word. If he cannot, tell early and explain. Praise honesty about a broken promise.", dont:"Do not reward excuses, and do not punish honest explanations harshly."},
  hi:{t:"ईमानदारी और वादा निभाना", how:"सिखाएँ कि वादा निभाए। न निभा पाए तो जल्दी बताए और कारण समझाए। टूटे वादे पर भी ईमानदारी की तारीफ़ करें।", dont:"बहानों को इनाम न दें, और ईमानदार कारण को कठोर सज़ा न दें।"}},
 {a:3,c:"equality", en:{t:"Equal respect for every person", how:"Discuss how boys and girls can share work and opportunities, and how every person deserves equal respect regardless of gender, religion, caste or background.", dont:"Do not joke about women or men as 'weaker' or 'less capable', and do not accept such jokes at home."},
  hi:{t:"हर इंसान का बराबर आदर", how:"चर्चा करें कि लड़के और लड़कियाँ काम और मौकों को कैसे बाँट सकते हैं, और हर इंसान को लिंग, आस्था, जाति या पृष्ठभूमि से परे बराबर आदर मिलना चाहिए।", dont:"महिलाओं या पुरुषों को 'कमज़ोर' या 'कम काबिल' बताने वाले मज़ाक न करें, और घर पर ऐसे मज़ाक को स्वीकार न करें।"}},
 {a:3,c:"kindness", en:{t:"Community service and empathy", how:"Volunteer once a month together: teaching children, cleaning a park, or helping at a shelter. Talk about what he felt afterwards.", dont:"Do not make service only about a certificate."},
  hi:{t:"समाज सेवा और सहानुभूति", how:"महीने में एक बार साथ में स्वयंसेवा करें: बच्चों को पढ़ाना, पार्क साफ़ करना, या किसी आश्रय में मदद करना। बाद में बात करें कि उसे कैसा लगा।", dont:"सेवा को सिर्फ़ सर्टिफ़िकेट के लिए न बनाएँ।"}},
 {a:3,c:"responsibility", en:{t:"Helping the family with care", how:"Share a family responsibility, such as caring for a younger sibling, or helping a grandparent with medicine reminders.", dont:"Do not turn help into a burden, or make it a reason to skip study."},
  hi:{t:"परिवार की देखभाल में मदद", how:"परिवार की एक ज़िम्मेदारी साझा करें, जैसे छोटे भाई-बहन की देखभाल, या दादा-दादी को दवा की याद दिलाना।", dont:"मदद को बोझ न बनाएँ, और इसे पढ़ाई छोड़ने का बहाना न बनने दें।"}}
];

// Extra situation cards: 6–12 years (a:2) and 13–18 years (a:3), to make 20 each.
SIT.push(
 {a:2,g:2,en:{t:"Pretends to be sick to avoid school", s:"I can see you feel unwell. Let's check together, and then we will decide what to do.", d:"Do not force school with threats, and do not dismiss real illness.", e:"Children sometimes avoid school because of worry or bullying. Find the reason first.", b:"Ask calmly what happens at school or on the way. Notice patterns, such as only on test days or Mondays. Talk to the class teacher. If there is a fever or real pain, see a doctor.", x:"Repeated stomach or head pain with no clear cause, or weight loss: see a doctor."},
  hi:{t:"स्कूल से बचने के लिए बीमार होने का नाटक", s:"मुझे लग रहा है तुम्हारी तबीयत ठीक नहीं है। चलो साथ में देखते हैं, फिर तय करेंगे क्या करना है।", d:"धमकी देकर स्कूल न भेजें, और असली बीमारी को नज़रअंदाज़ न करें।", e:"बच्चे कभी डर या धमकाए जाने की वजह से स्कूल से बचते हैं। पहले कारण ढूँढें।", b:"शांति से पूछें कि स्कूल में या रास्ते में क्या होता है। देखें कि यह कब होता है, जैसे टेस्ट वाले दिन या सोमवार को। क्लास टीचर से बात करें। बुखार या असली दर्द हो तो डॉक्टर को दिखाएँ।", x:"बार-बार पेट या सिर दर्द बिना साफ़ कारण के, या वज़न घटना: डॉक्टर को दिखाएँ।"}},
 {a:2,g:1,en:{t:"Does not finish chores", s:"Your chore is to put the plates away. Let's do it now, then you can play.", d:"Do not do the chore yourself to save time, and do not nag all day.", e:"Responsibility grows through small, repeated tasks with clear expectations.", b:"Write the chores on a small chart with a check box. Agree on a time, and praise the finished chore. If it is not done, the play time waits until it is.", x:""},
  hi:{t:"घर के काम पूरे न करना", s:"तुम्हारा काम है प्लेटें रखना। अभी कर लेते हैं, फिर तुम खेल सकते/सकती हो।", d:"समय बचाने के लिए काम खुद न करें, और दिन भर टोकें नहीं।", e:"ज़िम्मेदारी छोटे-छोटे, बार-बार दिए गए कामों और साफ़ उम्मीद से बढ़ती है।", b:"छोटे चार्ट पर काम लिखें, हर काम के आगे बॉक्स हो। समय तय करें, और पूरा होने पर तारीफ़ करें। काम पूरा न हो तो खेलने का समय उसके बाद रखें।", x:""}},
 {a:2,g:2,en:{t:"Rude to relatives or guests", s:"Please say hello and thank them. You do not have to like the gift, but you can say thank you.", d:"Do not shame the child in front of others. Do not force an apology he does not understand.", e:"Manners in public are learnt by watching adults at home.", b:"Practise greetings before visits. Afterwards, talk about what went well and what to try next time. Show polite words yourself when a guest is in the house.", x:""},
  hi:{t:"मेहमानों या रिश्तेदारों से रूखा व्यवहार", s:"कृपया नमस्ते करो और धन्यवाद कहो। तोहफ़ा पसंद न भी आए, तो भी धन्यवाद कह सकते हो।", d:"सबके सामने शर्मिंदा न करें। ऐसी माफ़ी न मँगवाएँ जिसका मतलब बच्चा न समझे।", e:"सार्वजनिक शिष्टाचार बच्चे घर पर बड़ों को देखकर सीखते हैं।", b:"मिलने जाने से पहले नमस्ते का अभ्यास करें। बाद में बताएँ कि क्या अच्छा हुआ और अगली बार क्या करना है। मेहमान घर आएँ तो खुद विनम्र शब्द बोलकर दिखाएँ।", x:""}},
 {a:2,g:2,en:{t:"Sudden anger and outbursts", s:"You are very angry. Let's take a break, and then talk.", d:"Do not argue while he is shouting. Do not hit, threaten or throw things.", e:"Strong anger is common at this age. Adults teach calming skills over time.", b:"Give a calm space. Afterwards, name the feeling and find a solution together. Practise calming steps, like slow breathing, when he is calm.", x:"Anger that harms himself or others, or very frequent extreme outbursts: see a doctor."},
  hi:{t:"अचानक गुस्सा और विस्फोट", s:"तुम बहुत गुस्से में हो। चलो थोड़ा ब्रेक लेते हैं, फिर बात करते हैं।", d:"चिल्लाते समय बहस न करें। मारें, धमकाएँ नहीं, और चीज़ें न फेंकें।", e:"इस उम्र में तेज़ गुस्सा आम है। बड़े समय के साथ शांत होने के तरीके सिखाते हैं।", b:"शांत जगह दें। बाद में भावना का नाम लें और मिलकर हल निकालें। शांत होने पर धीमी साँस जैसे तरीके अभ्यास कराएँ।", x:"गुस्सा जो खुद को या दूसरों को नुकसान पहुँचाए, या बहुत बार बहुत तेज़ विस्फोट: डॉक्टर को दिखाएँ।"}},
 {a:2,g:1,en:{t:"Fear of making mistakes", s:"Trying matters more than being perfect. What did you learn from this?", d:"Do not punish a mistake with anger or comparison.", e:"Children who fear mistakes may avoid trying. Calm reactions help them take risks.", b:"Praise the attempt, not only the result. Share one of your own mistakes and what you learnt from it.", x:""},
  hi:{t:"गलती होने का डर", s:"कोशिश करना सही होने से ज़्यादा ज़रूरी है। इससे तुमने क्या सीखा?", d:"गलती पर गुस्सा या तुलना करके सज़ा न दें।", e:"गलती का डर रखने वाले बच्चे कोशिश करना छोड़ देते हैं। शांत प्रतिक्रिया उन्हें नया करने की हिम्मत देती है।", b:"नतीजे के साथ-साथ कोशिश की भी तारीफ़ करें। अपनी एक गलती और उससे सीखी बात बताएँ।", x:""}},
 {a:2,g:1,en:{t:"Brushing teeth and bathing routine", s:"Brush for two minutes, morning and night. Let's do it together.", d:"Do not argue at every routine, and do not shame the child about his body.", e:"Routines become easier when they are short, fixed and done together.", b:"Make a fixed routine with a timer and a song. Let him choose his toothpaste and towel. Praise each day he does it alone.", x:"Bleeding gums, bad tooth pain, or swelling of the face: see a doctor or dentist."},
  hi:{t:"दाँत साफ़ करना और नहाने की आदत", s:"सुबह-रात दो मिनट तक ब्रश करो। चलो, साथ में करते हैं।", d:"हर रूटीन पर बहस न करें, और शरीर को लेकर शर्मिंदा न करें।", e:"रूटीन छोटे, तय और साथ में किए जाएँ तो आसान होते हैं।", b:"टाइमर और गाने के साथ एक तय रूटीन बनाएँ। टूथपेस्ट और तौलिया खुद चुनने दें। जिस दिन अकेले करे, उस दिन तारीफ़ करें।", x:"मसूड़ों से खून, दाँत में तेज़ दर्द, या चेहरे पर सूजन: डॉक्टर या दंत चिकित्सक को दिखाएँ।"}},
 {a:2,g:2,en:{t:"Cannot start homework without help", s:"You can try the first step alone. I am here if you get stuck.", d:"Do not do the whole homework for him. Do not sit and wait with him for hours.", e:"Children learn independence when they try first and get help only when stuck.", b:"Ask him to write one thing he can do alone, then ask for help with one step only. Praise the independent steps.", x:""},
  hi:{t:"होमवर्क बिना मदद के शुरू न कर पाना", s:"पहला कदम तुम अकेले आज़मा सकते/सकती हो। अटको तो मैं यहाँ हूँ।", d:"पूरा होमवर्क खुद न करें, और घंटों साथ बैठकर इंतज़ार न करें।", e:"बच्चे पहले खुद कोशिश करें और अटकने पर ही मदद लें, तो आत्मनिर्भरता सीखते हैं।", b:"उसे लिखने दें कि वह अकेले क्या कर सकता है, फिर एक कदम के लिए ही मदद माँगे। खुद किए कदमों की तारीफ़ करें।", x:""}},
 {a:2,g:2,en:{t:"Respecting body boundaries and safe touch", s:"Your body belongs to you. No one should touch you where your swimsuit covers, or ask you to keep secrets. If anyone does, tell me, and you will not be in trouble.", d:"Do not avoid the topic. Do not punish the child for telling you something.", e:"Simple, calm body-safety words protect children, and they help a child speak up early.", b:"Use correct body names. Practise simple rules, such as 'I can say no to anyone who makes me uncomfortable.' Keep talking openly. If you have any concern, speak to a doctor. CHILDLINE 1098 is free for children, and 112 for emergencies.", x:"Any sign of injury, pain in private areas, changes in behaviour, or a child telling you about touch: see a doctor and seek help at once."},
  hi:{t:"शरीर की सीमाएँ और सुरक्षित स्पर्श", s:"तुम्हारा शरीर तुम्हारा है। कोई भी तुम्हें वहाँ न छुए जहाँ कपड़े से ढका रहता है, और न ही कोई राज़ रखने को कहे। अगर कोई ऐसा करे, तो मुझे बताना, तुम्हें डाँट नहीं पड़ेगी।", d:"इस विषय को टालें नहीं। बच्चा कुछ बताए तो उसे सज़ा न दें।", e:"सरल और शांत शब्दों में शरीर की सुरक्षा सिखाने से बच्चे जल्दी बोल पाते हैं।", b:"शरीर के सही नाम इस्तेमाल करें। सरल नियम सिखाएँ, जैसे 'जो मुझे असहज करे उसे मैं ना कह सकता/सकती हूँ।' बातचीत खुली रखें। कोई चिंता हो तो डॉक्टर से बात करें। चाइल्डलाइन 1098 बच्चों के लिए मुफ़्त है, और आपात स्थिति में 112।", x:"चोट के निशान, निजी अंगों में दर्द, व्यवहार में बदलाव, या बच्चा स्पर्श के बारे में कुछ बताए: तुरंत डॉक्टर और मदद से संपर्क करें।"}},
 {a:2,g:1,en:{t:"Watching videos alone without guidance", s:"Let's watch this together and talk about it afterwards.", d:"Do not leave the child alone with videos that you have not checked.", e:"Children copy what they watch. Watching together lets you explain what is real and what is not.", b:"Choose age-appropriate channels together. Ask what he liked and what felt scary or wrong. Keep the TV in a shared room.", x:""},
  hi:{t:"बिना निगरानी के वीडियो देखना", s:"चलो, इसे साथ में देखते हैं, बाद में इस पर बात करेंगे।", d:"जो वीडियो आपने नहीं देखे, उन्हें देखने के लिए बच्चे को अकेला न छोड़ें।", e:"बच्चे जो देखते हैं उसकी नकल करते हैं। साथ देखने से आप समझा सकते हैं कि क्या असली है और क्या नहीं।", b:"उम्र के हिसाब से चैनल मिलकर चुनें। पूछें कि उसे क्या अच्छा लगा और क्या डरावना या गलत लगा। टीवी साझा कमरे में रखें।", x:""}}
);

SIT.push(
 {a:3,g:2,en:{t:"Pressure from parents about future and marks", s:"I want you to do your best, not to be perfect. Tell me what you want from your future.", d:"Do not compare with relatives or threaten with disappointment.", e:"Teens who feel constant pressure often become anxious or withdrawn. Listening to their goals helps.", b:"Ask what he wants, and discuss options with facts, not fear. Agree on a study plan that includes rest. Praise effort and steady progress.", x:"Constant worry, panic, or refusing food or school because of pressure: see a doctor."},
  hi:{t:"भविष्य और नंबरों को लेकर माता-पिता का दबाव", s:"मैं चाहता/चाहती हूँ कि तुम अपना सबसे अच्छा करो, परफेक्ट होना ज़रूरी नहीं। बताओ, तुम अपने भविष्य से क्या चाहते/चाहती हो?", d:"रिश्तेदारों से तुलना न करें, और निराशा का डर दिखाकर धमकाएँ नहीं।", e:"लगातार दबाव झेलने वाले किशोर अक्सर चिंतित या अलग-थलग हो जाते हैं। उनके लक्ष्य सुनने से मदद मिलती है।", b:"पूछें कि वह क्या चाहता है, और डर से नहीं बल्कि तथ्यों से विकल्पों पर बात करें। आराम शामिल करने वाली पढ़ाई की योजना पर सहमत हों। मेहनत और लगातार प्रगति की तारीफ़ करें।", x:"लगातार चिंता, घबराहट, या दबाव के कारण खाना या स्कूल छोड़ना: डॉक्टर को दिखाएँ।"}},
 {a:3,g:2,en:{t:"Crushes, dating and relationships", s:"Feelings are normal. Relationships should be respectful, safe and equal. How do you feel about this?", d:"Do not shame or spy on the teen. Do not dismiss the feelings as 'just a phase'.", e:"Teens explore relationships. Open, respectful talk protects them more than rules alone.", b:"Talk about respect, consent, and safe boundaries, including online. Encourage him to talk to you if someone pressures him or makes him uncomfortable.", x:"Pressure, threats, blackmail, or any unsafe situation: call 1098 for children, 112 for emergencies, and report to police and 1930 for online threats."},
  hi:{t:"क्रश, डेटिंग और रिश्ते", s:"भावनाएँ आना सामान्य है। रिश्ते सम्मानजनक, सुरक्षित और बराबरी के होने चाहिए। तुम्हें इस बारे में कैसा लगता है?", d:"किशोर को शर्मिंदा न करें, न उसकी जासूसी करें। भावनाओं को 'बस उम्र की बात है' कहकर न टालें।", e:"किशोर रिश्तों को समझते हैं। खुली और सम्मानजनक बात नियमों से ज़्यादा सुरक्षा देती है।", b:"सम्मान, सहमति और सुरक्षित सीमाओं पर बात करें, ऑनलाइन भी। प्रोत्साहित करें कि कोई दबाव डाले या असहज करे, तो वह आपसे बात करे।", x:"दबाव, धमकी, ब्लैकमेल, या कोई असुरक्षित स्थिति: बच्चों के लिए 1098, आपात स्थिति में 112, और ऑनलाइन धमकी हो तो पुलिस और 1930 पर रिपोर्ट करें।"}},
 {a:3,g:2,en:{t:"Skipping school or classes", s:"I want to understand what is happening. Let's talk about it, and then with the school.", d:"Do not punish only by locking him at home. Do not ignore it and hope it stops.", e:"Skipping school is often a sign of a problem: bullying, low mood, friends, or academic stress.", b:"Ask about the last few weeks, not just today. Check attendance patterns, talk to the class teacher or counsellor, and agree on one small step together.", x:"Skipping school for weeks, sudden drop in marks, or withdrawal from friends: see a doctor or counsellor."},
  hi:{t:"स्कूल या क्लास छोड़ना", s:"मैं समझना चाहता/चाहती हूँ कि क्या हो रहा है। पहले इस पर बात करते हैं, फिर स्कूल से।", d:"सिर्फ़ घर में बंद करके सज़ा न दें। इसे नज़रअंदाज़ करके ठीक होने की उम्मीद न करें।", e:"स्कूल छोड़ना अक्सर किसी समस्या का संकेत होता है: धमकाए जाना, उदासी, दोस्त, या पढ़ाई का दबाव।", b:"सिर्फ़ आज नहीं, पिछले कुछ हफ़्तों के बारे में पूछें। उपस्थिति का पैटर्न देखें, क्लास टीचर या काउंसलर से बात करें, और मिलकर एक छोटा कदम तय करें।", x:"हफ़्तों तक स्कूल छोड़ना, अचानक नंबर गिरना, या दोस्तों से दूर होना: डॉक्टर या काउंसलर को दिखाएँ।"}},
 {a:3,g:1,en:{t:"Road safety: two-wheelers and travel", s:"Helmet and seatbelt every time. Never ride with someone who has been drinking.", d:"Do not hand over a vehicle to a child without training and the legal age. Do not allow unsafe speed.", e:"Road injuries are a major cause of harm in teens. Clear rules reduce the risk.", b:"Agree on family travel rules in advance. Set a plan to call home when travelling late. Model safe driving yourself.", x:"Any head injury, vomiting after a fall, or drowsiness after a crash: go to a hospital at once."},
  hi:{t:"सड़क सुरक्षा: दोपहिया और यात्रा", s:"हर बार हेलमेट और सीटबेल्ट। जिसने शराब पी हो, उसके साथ कभी न बैठें।", d:"बिना प्रशिक्षण और कानूनी उम्र के बच्चे को गाड़ी न दें। असुरक्षित रफ़्तार की इजाज़त न दें।", e:"किशोरों में सड़क दुर्घटना नुकसान का बड़ा कारण है। साफ़ नियम जोखिम कम करते हैं।", b:"यात्रा के नियम पहले से मिलकर तय करें। देर रात यात्रा में घर फ़ोन करने की योजना बनाएँ। खुद सुरक्षित गाड़ी चलाकर उदाहरण बनें।", x:"सिर में चोट, गिरने के बाद उल्टी, या दुर्घटना के बाद नींद आना: तुरंत अस्पताल जाएँ।"}},
 {a:3,g:2,en:{t:"Low self-esteem and social media comparison", s:"Social media shows only the best moments. How do you feel about yourself, not about others?", d:"Do not mock his posts or photos. Do not compare his looks or success with others.", e:"Constant comparison online can lower confidence and mood. Real connections help.", b:"Ask him to list what he likes about himself. Limit the time spent on comparison apps. Encourage hobbies and friends in person.", x:"Saying 'I hate myself', self-harm, or talk of being worthless: contact a doctor urgently. In immediate danger call 112. Tele-MANAS 14416 is free and available 24 hours."},
  hi:{t:"कम आत्मविश्वास और सोशल मीडिया पर तुलना", s:"सोशल मीडिया पर सिर्फ़ अच्छे पल दिखते हैं। तुम खुद के बारे में कैसा महसूस करते/करती हो, दूसरों के बारे में नहीं?", d:"उसकी पोस्ट या फोटो का मज़ाक न उड़ाएँ। उसकी शक्ल या कामयाबी की दूसरों से तुलना न करें।", e:"ऑनलाइन लगातार तुलना आत्मविश्वास और मूड कम कर सकती है। असली दोस्ती और रिश्ते मदद करते हैं।", b:"पूछें कि उसे खुद में क्या अच्छा लगता है, उसकी सूची बनवाएँ। तुलना वाले ऐप्स पर समय सीमित करें। शौक और आमने-सामने के दोस्त प्रोत्साहित करें।", x:"'मैं खुद से नफ़रत करता/करती हूँ', खुद को नुकसान पहुँचाना, या खुद को बेकार समझना: तुरंत डॉक्टर से संपर्क करें। तुरंत खतरा हो तो 112। Tele-MANAS 14416 मुफ़्त है और 24 घंटे उपलब्ध है।"}},
 {a:3,g:2,en:{t:"Money missing or lying about money", s:"I noticed some money is missing. Let's talk about it calmly, without shouting.", d:"Do not accuse before checking. Do not lock everything away without talking.", e:"Money trouble can come from peer pressure, debts to friends, or online betting games.", b:"Ask calmly what the money was for. Set up a clear allowance and a simple record together. If there is debt or betting, get help early, not only punishment.", x:"Online betting or gambling apps, threats from lenders, or sudden big losses: seek help early from a doctor or counsellor."},
  hi:{t:"पैसे गायब होना या पैसों पर झूठ बोलना", s:"मैंने देखा कि कुछ पैसे गायब हैं। चलो, शांति से बात करते हैं, चिल्लाए बिना।", d:"जाँच किए बिना आरोप न लगाएँ। बात किए बिना सब कुछ ताले में न रखें।", e:"पैसों की दिक्कत दोस्तों के दबाव, दोस्तों से उधार, या ऑनलाइन सट्टे वाले गेम से हो सकती है।", b:"शांति से पूछें कि पैसे किस काम के थे। मिलकर एक साफ़ जेब खर्च और सरल हिसाब तय करें। उधार या सट्टा हो तो सिर्फ़ सज़ा नहीं, जल्दी मदद लें।", x:"ऑनलाइन सट्टा या जुए वाले ऐप्स, उधार देने वालों की धमकी, या अचानक बड़ा नुकसान: जल्दी डॉक्टर या काउंसलर से मदद लें।"}},
 {a:3,g:2,en:{t:"Vaping and e-cigarettes", s:"Vapes are harmful even when they look harmless. Let's talk about why you tried it.", d:"Do not ignore it, and do not hide your worry. Do not panic and punish without talking.", e:"Many teens try vaping because of friends or curiosity. Early help makes quitting easier.", b:"Ask calmly who, where and why. Agree on a plan to stop, and check in regularly. Involve a doctor if he cannot stop on his own.", x:"Cough that does not go away, breathlessness, chest pain, or a sudden illness after vaping: see a doctor."},
  hi:{t:"वेपिंग और ई-सिगरेट", s:"वेप देखने में हल्के लगें, फिर भी नुकसानदेह होते हैं। बताओ, तुमने इसे क्यों आज़माया?", d:"इसे नज़रअंदाज़ न करें और अपनी चिंता न छिपाएँ। बात किए बिना घबराकर सज़ा न दें।", e:"कई किशोर दोस्तों के दबाव या जिज्ञासा से वेप आज़माते हैं। जल्दी मदद से छोड़ना आसान होता है।", b:"शांति से पूछें कि किसके साथ, कहाँ और क्यों। छोड़ने की योजना मिलकर बनाएँ और नियमित बात करें। खुद न छोड़ पाए तो डॉक्टर की मदद लें।", x:"लगातार खाँसी, साँस फूलना, सीने में दर्द, या वेपिंग के बाद अचानक बीमारी: डॉक्टर को दिखाएँ।"}},
 {a:3,g:1,en:{t:"Family values and modern life", s:"Family traditions matter to us. Tell me where you agree and where you disagree, and let's find respect on both sides.", d:"Do not ban all friendships or choices without reasons. Do not use religion or culture to shame him.", e:"Teens want to belong to family and also to choose their own path. Balance comes through dialogue.", b:"Explain the reason behind each family value in simple words. Listen to his views, and agree on what is non-negotiable and what is his choice.", x:""},
  hi:{t:"पारिवारिक मूल्य और आज का जीवन", s:"पारिवारिक परंपराएँ हमारे लिए मायने रखती हैं। बताओ तुम कहाँ सहमत हो और कहाँ नहीं, और दोनों तरफ़ सम्मान ढूँढते हैं।", d:"बिना कारण सारी दोस्ती या पसंद पर रोक न लगाएँ। धर्म या संस्कृति के नाम पर शर्मिंदा न करें।", e:"किशोर परिवार का हिस्सा भी रहना चाहते हैं और अपना रास्ता भी चुनना चाहते हैं। संवाद से संतुलन बनता है।", b:"हर पारिवारिक मूल्य का कारण सरल शब्दों में समझाएँ। उसकी राय सुनें, और तय करें कि क्या ज़रूरी है और कौन सी बात उसकी अपनी पसंद होगी।", x:""}}
);

SIT.push(
 {a:1,g:1,en:{t:"Refuses to wash hands or bathe", s:"Soap and water first, then we eat. Let's count to twenty while we wash.", d:"Do not force it with threats. Do not let it become a daily battle.", e:"Hygiene habits take months to settle in young children.", b:"Make washing a song-and-count routine. Let him choose the soap. Praise every time he washes without a reminder.", x:"Skin rash, boils, or itching that does not go away: see a doctor."},

 {a:1,g:2,en:{t:"Bossy with other children", s:"Your friend can choose too. Let's ask him what he wants to play.", d:"Do not label him 'bossy' in front of others. Do not let him push others around.", e:"Young children are still learning to share control. Guided turn-taking helps.", b:"Set turns for choosing the game. Praise when he asks a friend's choice. Model asking politely yourself."},

 {a:1,g:2,en:{t:"Afraid of dogs or animals", s:"The dog is sleeping. We can watch from here.", d:"Do not force the child near the animal. Do not laugh at or tease the fear.", e:"Fear of animals is common. Gradual, safe exposure helps.", b:"Watch the animal from a distance, then move a little closer step by step, praising each step. Teach that dogs should be approached only with the owner's permission."},

 {a:1,g:2,en:{t:"Jealous of a new baby brother or sister", s:"You are a big brother or sister now. You can help me choose the baby's blanket.", d:"Do not say 'you are big now, you don't need attention'. Do not punish him for feeling jealous.", e:"Jealousy of a new baby is very common. Special time with the older child reduces it.", b:"Give him a special job with the baby, such as bringing the nappy. Spend ten minutes alone with him each day, and praise his gentle moments."},

 {a:1,g:1,en:{t:"Dressing takes forever", s:"Put the shirt on first, then the pants. I will watch.", d:"Do not dress him yourself when he could do it. Do not rush him with threats.", e:"Dressing is a skill that grows slowly. Small steps help.", b:"Break dressing into steps on a picture chart. Praise each step he does alone, and give him more time on school mornings."},

 {a:1,g:1,en:{t:"Upset when losing a game", s:"It is okay to feel sad. Let's play again, and try your best.", d:"Do not let him win every time, and do not shame him for losing.", e:"Losing is hard at this age. Learning to lose gracefully builds resilience.", b:"Praise good effort, not only winning. Show how you handle losing yourself, by saying 'Good game' and smiling."},

 {a:1,g:1,en:{t:"Answers back with 'No, you!'", s:"You can say 'I don't want to' politely. Please tell me in a kind voice.", d:"Do not reply in the same tone, and do not shout.", e:"Answering back is part of learning to express needs. Teaching a kind way to say it helps.", b:"Model a polite 'I don't want' yourself. Praise the kind voice, and say 'Thank you for telling me politely.'"},

 {a:2,g:2,en:{t:"Sports and rough play", s:"Sport is about fair play. Let's talk about the rules of the game.", d:"Do not defend violence in sport. Do not praise winning by hurting others.", e:"Rough play can turn into real injury or conflict. Clear rules keep games fun and safe.", b:"Talk about fair play after each game. Praise the child who helps an opponent up. Ask the coach to set clear rules for conduct."},

let lang = "en";
let tab = "sit";
let age = 1; // default 3–6 years

function render(){
  const T = UI[lang];
  document.getElementById("clinicLine").textContent = T.clinic;
  document.getElementById("title").textContent = T.title;
  document.getElementById("subtitle").textContent = T.sub;
  document.getElementById("langBtn").textContent = lang === "en" ? "हिन्दी" : "English";
  document.documentElement.lang = lang === "en" ? "en" : "hi";
  document.getElementById("tabA").textContent = T.tabA;
  document.getElementById("tabB").textContent = T.tabB;
  document.getElementById("tabA").className = "tab" + (tab === "sit" ? " on" : "");
  document.getElementById("tabB").className = "tab" + (tab === "hum" ? " on" : "");
  document.getElementById("ageChips").innerHTML = T.ages.map((a, i) =>
    `<button class="chip ${i === age ? "on" : ""}" data-age="${i}">${a}</button>`).join("");

  document.getElementById("intro").innerHTML = `
    <h2>${T.introTitle}</h2>
    <p>${T.introText}</p>
    <div class="three">
      <div class="box no"><b>${T.three[0][0]}</b>${T.three[0][1]}</div>
      <div class="box soft"><b>${T.three[1][0]}</b>${T.three[1][1]}</div>
      <div class="box good"><b>${T.three[2][0]}</b>${T.three[2][1]}</div>
    </div>
    <div class="small">${T.smallPrint}</div>`;

  const content = document.getElementById("content");
  let html = "";
  if (tab === "sit") {
    html = SIT.filter(c => c.a === age).map(c => {
      const C = c[lang];
      return `<div class="card">
        <span class="badge ${c.g === 2 ? "hard" : ""}">${c.g === 2 ? T.hard : T.easy}</span>
        <h3>${C.t}</h3>
        <div class="row say"><span class="k">✔ ${T.say}</span>${C.s}</div>
        <div class="row dont"><span class="k">✖ ${T.dont}</span>${C.d}</div>
        <div class="row exp"><span class="k">ℹ ${T.exp}</span>${C.e}</div>
        <div class="row better"><span class="k">★ ${T.better}</span>${C.b}</div>
        ${C.x ? `<div class="see"><b>${T.see}:</b> ${C.x}</div>` : ""}
      </div>`;
    }).join("");
  } else {
    html = HUM.filter(c => c.a === age).map(c => {
      const C = c[lang];
      return `<div class="card hum">
        <span class="badge">${T.cats[c.c]}</span>
        <h3>${C.t}</h3>
        <div class="row how"><span class="k">✔ ${T.how}</span>${C.how}</div>
        <div class="row dont"><span class="k">✖ ${T.avoid}</span>${C.dont}</div>
      </div>`;
    }).join("");
  }
  content.innerHTML = html;

  document.getElementById("note").innerHTML = T.note + (age === 3 ? "<br><br>" + T.teenHelp : "");
  document.getElementById("foot1").textContent = T.foot;
}

document.getElementById("langBtn").addEventListener("click", () => { lang = lang === "en" ? "hi" : "en"; render(); });
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); }));
document.getElementById("ageChips").addEventListener("click", e => {
  const b = e.target.closest("button[data-age]");
  if (b) { age = Number(b.dataset.age); render(); }
});
render();
</script>
<script src="/site-nav.js" defer></script>
</body>
</html>
